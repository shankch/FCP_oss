fcp: '0.1'
design: review
summary: A Python function on strings treated as a chip without memory. Each cycle is one call of parse_duration(text); the argument is an input string of at most 16 characters, the returned number of seconds and the way the call ended are outputs. The request is the specification, and code written by AI models is checked by running it.
docs:
- {id: SPEC, path: spec.md, title: 'Request: parse a duration'}
- {id: FRAME, path: frame.md, title: 'FCP function adapter, version 0.2'}
interface:
  clock: clk
  reset: {name: rst_n, active_low: true, synchronous: true}
  signals:
  - {name: clk, dir: in, width: 1}
  - {name: rst_n, dir: in, width: 1}
  - {name: text, dir: in, width: 8, length: 16, desc: 'the text argument: a string of at most 16 characters, codes 0 to 255'}
  - {name: outcome, dir: out, width: 2, desc: 'how the call ended: 0 returned an int that fits, 1 raised ValueError, 2 other exception or no answer, 3 returned anything else'}
  - {name: seconds, dir: out, width: 19, desc: 'the returned int (outcome 0), 0 to 524,287'}
environment: {initial_reset: true, reset_anytime: false, bmc_depth: 3, cover_depth: 3}
frame:
- {id: F-ZERO, req: R-FR-1, expr: 'outcome != 0 -> seconds == 0'}
function:
  name: parse_duration
  args:
  - {name: text, signal: text, type: str}
  returns: {signal: seconds, type: int}
  outcome: {signal: outcome, raises: [ValueError]}
  scope:
    text: {alphabet: '0123456789hms ', random: 3000, values: ['1h30m', '45s', '']}
