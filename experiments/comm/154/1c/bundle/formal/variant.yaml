  - {req: R-RES-2, phrase: 'cycpattern_check("efef","eeff") => True', reading: 2}
  - {req: R-EX-1, phrase: 'cycpattern_check("abcd","abd") => True', reading: 2}
  - {req: R-EX-2, phrase: 'cycpattern_check("hello","ell") => False', reading: 2}
  - {req: R-EX-3, phrase: 'cycpattern_check("whassup","psus") => True', reading: 2}
  - {req: R-EX-4, phrase: 'cycpattern_check("abab","baa") => False', reading: 2}
