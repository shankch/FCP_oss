- id: R-NF-1
  doc: SPEC
  quote: 'Complete this function:'
  text: The deliverable is a Python implementation of the function cycpattern_check(a, b) with the given signature.
  kind: non_functional
  lines:
  - 1
- id: R-DEF-1
  doc: SPEC
  quote: 'def cycpattern_check(a , b):'
  text: The first argument a of cycpattern_check is the first word and the second argument b is the second word.
  kind: definition
  lines:
  - 4
- id: R-DEF-2
  doc: SPEC
  quote: any of its rotations
  text: 'A rotation of the second word b is a cyclic shift of b: b[k:] + b[:k] for some k with 0 <= k < len(b), i.e. characters moved from the front of b to its end, keeping their order.'
  kind: definition
  ambiguity:
  - phrase: rotations
    readings:
    - 'Cyclic shifts only: b[k:] + b[:k] for 0 <= k < len(b) ("abd" has the rotations "abd", "bda", "dab").'
    - Any rearrangement (permutation) of the characters of b ("abd" also has "adb", "bad", "dba").
  lines:
  - 5
- id: R-DEF-3
  doc: SPEC
  quote: is a substring in the first word
  text: 'A string s is a substring in the first word a when s occurs in a as a run of adjacent characters: a[i:i+len(s)] == s for some i with 0 <= i <= len(a) - len(s).'
  kind: definition
  ambiguity:
  - phrase: substring
    readings:
    - 'Contiguous: s occurs in a as a run of adjacent characters (Python `s in a`).'
    - 'Subsequence: the characters of s occur in a in the same order, not necessarily adjacent ("abd" would be in "abcd").'
  - phrase: is a substring in the first word
    readings:
    - 'Characters are compared exactly (case-sensitive): "Ell" is not a substring of "hello".'
    - 'Letters are compared ignoring case: "Ell" is a substring of "hello".'
  lines:
  - 5
- id: R-IN-1
  doc: SPEC
  quote: You are given 2 words.
  text: Both arguments a and b of cycpattern_check are words.
  kind: assumption
  ambiguity:
  - phrase: words
    readings:
    - Any string, including the empty string and strings with spaces, digits or other non-letter characters; every such call must follow the rule.
    - A non-empty string of letters only; calls where a or b is empty or contains a non-letter character are outside the contract (any outcome allowed).
  lines:
  - 5
- id: R-RES-1
  doc: SPEC
  quote: You need to return True if the second word or any of its rotations is a substring in the first word
  text: If the second word b, or some rotation of b, is a substring of the first word a, then cycpattern_check(a, b) returns True.
  kind: guarantee
  depends:
  - R-DEF-1
  - R-DEF-2
  - R-DEF-3
  - R-IN-1
  ambiguity:
  - phrase: return True
    readings:
    - The function returns the boolean True.
    - Any truthy value (such as 1 or a non-empty string) counts as returning True.
  - phrase: the second word or any of its rotations
    readings:
    - When b is empty, the empty string is a substring of every a, so the call returns True.
    - When b is empty there is nothing to find, so the condition does not hold and the call does not return True.
  - phrase: cycpattern_check("hello","ell") => False
    readings:
    - 'The rule wins: "ell" is a substring of "hello" ("hello"[1:4]), so cycpattern_check("hello", "ell") returns True and the example R-EX-2 is wrong.'
    - 'The example R-EX-2 wins: the call returns False, so the rule does not hold as written (all six examples fit the negated rule: True exactly when neither b nor any rotation of b is a substring of a).'
  - phrase: cycpattern_check("abab","baa") => False
    readings:
    - 'The rule wins: the rotation "aba" of "baa" is a substring of "abab" ("abab"[0:3]), so cycpattern_check("abab", "baa") returns True and the example R-EX-4 is wrong.'
    - 'The example R-EX-4 wins: the call returns False, so the rule does not hold as written (all six examples fit the negated rule: True exactly when neither b nor any rotation of b is a substring of a).'
  - phrase: cycpattern_check("himenss","simen") => False
    readings:
    - 'The rule wins: the rotation "imens" of "simen" is a substring of "himenss" ("himenss"[1:6]), so cycpattern_check("himenss", "simen") returns True and the example R-EX-6 is wrong.'
    - 'The example R-EX-6 wins: the call returns False, so the rule does not hold as written (all six examples fit the negated rule: True exactly when neither b nor any rotation of b is a substring of a).'
  lines:
  - 5
- id: R-RES-2
  doc: SPEC
  quote: You need to return True if the second word or any of its rotations is a substring in the first word
  text: If neither the second word b nor any rotation of b is a substring of the first word a, then cycpattern_check(a, b) returns False (in particular whenever b is longer than a).
  kind: guarantee
  depends:
  - R-DEF-1
  - R-DEF-2
  - R-DEF-3
  - R-IN-1
  ambiguity:
  - phrase: return True if
    readings:
    - '"if" means "if and only if": when the condition does not hold, the function returns False.'
    - 'Only the True case is specified: when the condition does not hold, the result is not specified (any outcome allowed).'
  - phrase: cycpattern_check("abcd","abd") => True
    readings:
    - 'The rule wins: no rotation of "abd" ("abd", "bda", "dab") is a substring of "abcd" (whose 3-character substrings are "abc", "bcd"), so cycpattern_check("abcd", "abd") returns False and the example
      R-EX-1 is wrong.'
    - 'The example R-EX-1 wins: the call returns True, so the rule does not hold as written (all six examples fit the negated rule: True exactly when neither b nor any rotation of b is a substring of a).'
  - phrase: cycpattern_check("whassup","psus") => True
    readings:
    - 'The rule wins: no rotation of "psus" ("psus", "susp", "usps", "spsu") is a substring of "whassup" (whose 4-character substrings are "whas", "hass", "assu", "ssup"), so cycpattern_check("whassup",
      "psus") returns False and the example R-EX-3 is wrong.'
    - 'The example R-EX-3 wins: the call returns True, so the rule does not hold as written (all six examples fit the negated rule: True exactly when neither b nor any rotation of b is a substring of a).'
  - phrase: cycpattern_check("efef","eeff") => True
    readings:
    - 'The rule wins: no rotation of "eeff" ("eeff", "effe", "ffee", "feef") is a substring of "efef" (whose only 4-character substring is "efef"), so cycpattern_check("efef", "eeff") returns False and
      the example R-EX-5 is wrong.'
    - 'The example R-EX-5 wins: the call returns True, so the rule does not hold as written (all six examples fit the negated rule: True exactly when neither b nor any rotation of b is a substring of a).'
  lines:
  - 5
