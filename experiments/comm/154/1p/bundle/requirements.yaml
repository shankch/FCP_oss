fcp: '0.1'
design: review
origin:
  kind: agent
  role: decomposer
  id: decomposer
requirements:
- id: R-SIG-1
  doc: SPEC
  quote: 'def candidate(a , b):'
  text: 'The function to implement is named candidate and takes two positional arguments: a (the first) and b (the second).'
  kind: definition
  lines:
  - 4
- id: R-RET-1
  doc: SPEC
  quote: 'Complete this function:'
  text: 'Every call candidate(a, b) on two strings finishes and returns a bool (True or False): it raises no exception, does not run forever, and returns no value of another type (such as None, a number
    or a string).'
  kind: guarantee
  ambiguity:
  - phrase: Complete this function
    readings:
    - every call on any two strings must return True or False
    - only the calls shown in the examples must return a bool; on other calls (for example with an empty string) raising an exception or returning another type is allowed
  - phrase: => True / => False (the result notation of the examples)
    readings:
    - the returned value is exactly the bool True (False)
    - any truthy (falsy) value, such as 1, 0, "" or None, is acceptable
  lines:
  - 1
- id: R-RULE-1
  doc: SPEC
  quote: candidate("abcd","abd") => False candidate("hello","ell") => True candidate("whassup","psus") => False candidate("abab","baa") => True candidate("efef","eeff") => False candidate("himenss","simen")
    => True
  text: Whenever b, or some rotation of b, occurs as a contiguous substring of a, candidate(a, b) returns True. A rotation of b is b with some prefix moved to its end (the rotations of "baa" are "baa",
    "aab" and "aba"). This rule is not stated; it is the simplest rule that agrees with all six examples (plain substring contradicts candidate("abab","baa") => True, subsequence contradicts candidate("abcd","abd")
    => False, and "some permutation of b is a substring" contradicts candidate("efef","eeff") => False).
  kind: guarantee
  ambiguity:
  - phrase: the prompt states no rule, only six examples
    readings:
    - True exactly when b or some rotation of b is a contiguous substring of a
    - True exactly when some rotation of b or some rotation of the reverse of b is a contiguous substring of a (also agrees with all six examples)
    - only the six example calls are constrained; every other call may return True or False
  - phrase: an empty b (no example has one)
    readings:
    - 'True: the empty string is a substring of every string, including the empty one'
    - 'False: an empty pattern never matches'
    - 'unconstrained: either result is acceptable'
  - phrase: upper and lower case (every example is lower case)
    readings:
    - characters are compared by their exact codes ("A" differs from "a")
    - letters are compared ignoring case ("A" matches "a")
  lines:
  - 6
  - 11
- id: R-RULE-2
  doc: SPEC
  quote: candidate("abcd","abd") => False candidate("hello","ell") => True candidate("whassup","psus") => False candidate("abab","baa") => True candidate("efef","eeff") => False candidate("himenss","simen")
    => True
  text: Whenever neither b nor any rotation of b (b with some prefix moved to its end) occurs as a contiguous substring of a, candidate(a, b) returns False. In particular, when b is longer than a the call
    returns False. This rule is not stated; it is the simplest rule that agrees with all six examples.
  kind: guarantee
  ambiguity:
  - phrase: the prompt states no rule, only six examples
    readings:
    - False exactly when neither b nor any rotation of b is a contiguous substring of a
    - False exactly when no rotation of b and no rotation of the reverse of b is a contiguous substring of a (also agrees with all six examples)
    - only the six example calls are constrained; every other call may return True or False
  - phrase: an empty b (no example has one)
    readings:
    - an empty b is a substring of every a, so this rule never applies to it and the call returns True
    - an empty b never matches, so the call returns False
    - 'unconstrained: either result is acceptable'
  - phrase: upper and lower case (every example is lower case)
    readings:
    - characters are compared by their exact codes ("A" differs from "a")
    - letters are compared ignoring case ("A" matches "a")
  lines:
  - 6
  - 11
- id: R-EX-1
  doc: SPEC
  quote: candidate("abcd","abd") => False
  text: candidate("abcd", "abd") returns False (no rotation of "abd" - "abd", "bda", "dab" - is a substring of "abcd", although "abd" is a subsequence of it).
  kind: scenario
  lines:
  - 6
- id: R-EX-2
  doc: SPEC
  quote: candidate("hello","ell") => True
  text: candidate("hello", "ell") returns True ("ell" itself is a substring of "hello").
  kind: scenario
  lines:
  - 7
- id: R-EX-3
  doc: SPEC
  quote: candidate("whassup","psus") => False
  text: candidate("whassup", "psus") returns False (no rotation of "psus" - "psus", "susp", "usps", "spsu" - is a substring of "whassup").
  kind: scenario
  lines:
  - 8
- id: R-EX-4
  doc: SPEC
  quote: candidate("abab","baa") => True
  text: candidate("abab", "baa") returns True (the rotation "aba" of "baa" is a substring of "abab", although "baa" itself is not).
  kind: scenario
  lines:
  - 9
- id: R-EX-5
  doc: SPEC
  quote: candidate("efef","eeff") => False
  text: candidate("efef", "eeff") returns False (no rotation of "eeff" - "eeff", "effe", "ffee", "feef" - equals "efef", although "efef" is a permutation of "eeff").
  kind: scenario
  lines:
  - 10
- id: R-EX-6
  doc: SPEC
  quote: candidate("himenss","simen") => True
  text: candidate("himenss", "simen") returns True (the rotation "imens" of "simen" is a substring of "himenss").
  kind: scenario
  lines:
  - 11
- id: R-FR-1
  doc: FRAME
  quote: 'F-ZERO: `result` is 0 (false) unless `outcome` is 0.'
  text: In every call, result is 0 (false) unless outcome is 0 (the call returned True or False).
  kind: guarantee
  lines:
  - 50
- id: R-FR-2
  doc: FRAME
  quote: 'F-CODE: `outcome` is never 3.'
  text: In every call, outcome is 0, 1 or 2; it is never 3.
  kind: guarantee
  lines:
  - 51
