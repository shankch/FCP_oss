fcp: "0.1"
set: agent_b
origin: {kind: agent, role: formalizer, id: agent_b}

# Specification model.  simplify keeps no state between calls (frame.md), so
# the model is combinational: it parses both argument strings, x = a and
# n = b (R-FN-2), into numerator / denominator values and decides with exact
# integer arithmetic whether x * n and x + n are whole numbers.  The outputs
# are checked against that model.  No ghost is needed: a ghost would only
# carry state from one call to the next, and there is none.
#
# FCP-PL only allows `%` by a constant, so "D divides N" for the data-dependent
# D = den_a * den_b is computed by long division (Horner's rule) over the
# decimal digits of the numerators, reducing modulo D after every digit:
#   r_0 = 0,  r_{j+1} = (10 * r_j + digit_j * m) mod D        (m <= D)
# With r_j < D and m <= D, 10 * r_j + digit_j * m < 19 * D, so the quotient
# of each step is count(k < 18: t >= (k + 1) * D), exactly.  A numerator has
# at most 14 digits (16 characters hold "d...d/d"), hence 14 steps.
defs:
  # ---- argument a (the fraction x) ----
  sl_a: 'count(i < len(a): a[i] == "/")'
  pa: 'sum(i < len(a): a[i] == "/" ? i : 0)'
  fmt_a: 'sl_a == 1 && pa >= 1 && pa + 2 <= len(a) && all(i < len(a): a[i] == "/" || isdigit(a[i])) && a[0] != "0" && a[pa + 1] != "0"'
  num_a: 'sum(k < 16: k < pa ? (a[pa - 1 - k] - "0") * (k == 0 ? 1 : k == 1 ? 10 : k == 2 ? 100 : k == 3 ? 1000 : k == 4 ? 10000 : k == 5 ? 100000 : k == 6 ? 1000000 : k == 7 ? 10000000 : k == 8 ? 100000000 : k == 9 ? 1000000000 : k == 10 ? 10000000000 : k == 11 ? 100000000000 : k == 12 ? 1000000000000 : k == 13 ? 10000000000000 : k == 14 ? 100000000000000 : 1000000000000000) : 0)'
  den_a: 'sum(k < 16: k < len(a) - 1 - pa ? (a[len(a) - 1 - k] - "0") * (k == 0 ? 1 : k == 1 ? 10 : k == 2 ? 100 : k == 3 ? 1000 : k == 4 ? 10000 : k == 5 ? 100000 : k == 6 ? 1000000 : k == 7 ? 10000000 : k == 8 ? 100000000 : k == 9 ? 1000000000 : k == 10 ? 10000000000 : k == 11 ? 100000000000 : k == 12 ? 1000000000000 : k == 13 ? 10000000000000 : k == 14 ? 100000000000000 : 1000000000000000) : 0)'
  valid_a: 'fmt_a && num_a >= 1 && den_a >= 1'
  # ---- argument b (the fraction n) ----
  sl_b: 'count(i < len(b): b[i] == "/")'
  pb: 'sum(i < len(b): b[i] == "/" ? i : 0)'
  fmt_b: 'sl_b == 1 && pb >= 1 && pb + 2 <= len(b) && all(i < len(b): b[i] == "/" || isdigit(b[i])) && b[0] != "0" && b[pb + 1] != "0"'
  num_b: 'sum(k < 16: k < pb ? (b[pb - 1 - k] - "0") * (k == 0 ? 1 : k == 1 ? 10 : k == 2 ? 100 : k == 3 ? 1000 : k == 4 ? 10000 : k == 5 ? 100000 : k == 6 ? 1000000 : k == 7 ? 10000000 : k == 8 ? 100000000 : k == 9 ? 1000000000 : k == 10 ? 10000000000 : k == 11 ? 100000000000 : k == 12 ? 1000000000000 : k == 13 ? 10000000000000 : k == 14 ? 100000000000000 : 1000000000000000) : 0)'
  den_b: 'sum(k < 16: k < len(b) - 1 - pb ? (b[len(b) - 1 - k] - "0") * (k == 0 ? 1 : k == 1 ? 10 : k == 2 ? 100 : k == 3 ? 1000 : k == 4 ? 10000 : k == 5 ? 100000 : k == 6 ? 1000000 : k == 7 ? 10000000 : k == 8 ? 100000000 : k == 9 ? 1000000000 : k == 10 ? 10000000000 : k == 11 ? 100000000000 : k == 12 ? 1000000000000 : k == 13 ? 10000000000000 : k == 14 ? 100000000000000 : 1000000000000000) : 0)'
  valid_b: 'fmt_b && num_b >= 1 && den_b >= 1'
  valid: 'valid_a && valid_b'
  # common denominator of x * n = (num_a * num_b) / dd and x + n = (num_a * den_b + num_b * den_a) / dd
  dd: 'den_a * den_b'
  # ---- ra_14 = num_a mod dd ----
  ra_0: '0'
  ra_1: '0 < pa ? 10 * ra_0 + a[0] - "0" - dd * count(k < 18: 10 * ra_0 + a[0] - "0" >= (k + 1) * dd) : ra_0'
  ra_2: '1 < pa ? 10 * ra_1 + a[1] - "0" - dd * count(k < 18: 10 * ra_1 + a[1] - "0" >= (k + 1) * dd) : ra_1'
  ra_3: '2 < pa ? 10 * ra_2 + a[2] - "0" - dd * count(k < 18: 10 * ra_2 + a[2] - "0" >= (k + 1) * dd) : ra_2'
  ra_4: '3 < pa ? 10 * ra_3 + a[3] - "0" - dd * count(k < 18: 10 * ra_3 + a[3] - "0" >= (k + 1) * dd) : ra_3'
  ra_5: '4 < pa ? 10 * ra_4 + a[4] - "0" - dd * count(k < 18: 10 * ra_4 + a[4] - "0" >= (k + 1) * dd) : ra_4'
  ra_6: '5 < pa ? 10 * ra_5 + a[5] - "0" - dd * count(k < 18: 10 * ra_5 + a[5] - "0" >= (k + 1) * dd) : ra_5'
  ra_7: '6 < pa ? 10 * ra_6 + a[6] - "0" - dd * count(k < 18: 10 * ra_6 + a[6] - "0" >= (k + 1) * dd) : ra_6'
  ra_8: '7 < pa ? 10 * ra_7 + a[7] - "0" - dd * count(k < 18: 10 * ra_7 + a[7] - "0" >= (k + 1) * dd) : ra_7'
  ra_9: '8 < pa ? 10 * ra_8 + a[8] - "0" - dd * count(k < 18: 10 * ra_8 + a[8] - "0" >= (k + 1) * dd) : ra_8'
  ra_10: '9 < pa ? 10 * ra_9 + a[9] - "0" - dd * count(k < 18: 10 * ra_9 + a[9] - "0" >= (k + 1) * dd) : ra_9'
  ra_11: '10 < pa ? 10 * ra_10 + a[10] - "0" - dd * count(k < 18: 10 * ra_10 + a[10] - "0" >= (k + 1) * dd) : ra_10'
  ra_12: '11 < pa ? 10 * ra_11 + a[11] - "0" - dd * count(k < 18: 10 * ra_11 + a[11] - "0" >= (k + 1) * dd) : ra_11'
  ra_13: '12 < pa ? 10 * ra_12 + a[12] - "0" - dd * count(k < 18: 10 * ra_12 + a[12] - "0" >= (k + 1) * dd) : ra_12'
  ra_14: '13 < pa ? 10 * ra_13 + a[13] - "0" - dd * count(k < 18: 10 * ra_13 + a[13] - "0" >= (k + 1) * dd) : ra_13'
  # ---- rp_14 = (num_b * ra_14) mod dd = (num_a * num_b) mod dd ----
  rp_0: '0'
  rp_1: '0 < pb ? 10 * rp_0 + (b[0] - "0") * ra_14 - dd * count(k < 18: 10 * rp_0 + (b[0] - "0") * ra_14 >= (k + 1) * dd) : rp_0'
  rp_2: '1 < pb ? 10 * rp_1 + (b[1] - "0") * ra_14 - dd * count(k < 18: 10 * rp_1 + (b[1] - "0") * ra_14 >= (k + 1) * dd) : rp_1'
  rp_3: '2 < pb ? 10 * rp_2 + (b[2] - "0") * ra_14 - dd * count(k < 18: 10 * rp_2 + (b[2] - "0") * ra_14 >= (k + 1) * dd) : rp_2'
  rp_4: '3 < pb ? 10 * rp_3 + (b[3] - "0") * ra_14 - dd * count(k < 18: 10 * rp_3 + (b[3] - "0") * ra_14 >= (k + 1) * dd) : rp_3'
  rp_5: '4 < pb ? 10 * rp_4 + (b[4] - "0") * ra_14 - dd * count(k < 18: 10 * rp_4 + (b[4] - "0") * ra_14 >= (k + 1) * dd) : rp_4'
  rp_6: '5 < pb ? 10 * rp_5 + (b[5] - "0") * ra_14 - dd * count(k < 18: 10 * rp_5 + (b[5] - "0") * ra_14 >= (k + 1) * dd) : rp_5'
  rp_7: '6 < pb ? 10 * rp_6 + (b[6] - "0") * ra_14 - dd * count(k < 18: 10 * rp_6 + (b[6] - "0") * ra_14 >= (k + 1) * dd) : rp_6'
  rp_8: '7 < pb ? 10 * rp_7 + (b[7] - "0") * ra_14 - dd * count(k < 18: 10 * rp_7 + (b[7] - "0") * ra_14 >= (k + 1) * dd) : rp_7'
  rp_9: '8 < pb ? 10 * rp_8 + (b[8] - "0") * ra_14 - dd * count(k < 18: 10 * rp_8 + (b[8] - "0") * ra_14 >= (k + 1) * dd) : rp_8'
  rp_10: '9 < pb ? 10 * rp_9 + (b[9] - "0") * ra_14 - dd * count(k < 18: 10 * rp_9 + (b[9] - "0") * ra_14 >= (k + 1) * dd) : rp_9'
  rp_11: '10 < pb ? 10 * rp_10 + (b[10] - "0") * ra_14 - dd * count(k < 18: 10 * rp_10 + (b[10] - "0") * ra_14 >= (k + 1) * dd) : rp_10'
  rp_12: '11 < pb ? 10 * rp_11 + (b[11] - "0") * ra_14 - dd * count(k < 18: 10 * rp_11 + (b[11] - "0") * ra_14 >= (k + 1) * dd) : rp_11'
  rp_13: '12 < pb ? 10 * rp_12 + (b[12] - "0") * ra_14 - dd * count(k < 18: 10 * rp_12 + (b[12] - "0") * ra_14 >= (k + 1) * dd) : rp_12'
  rp_14: '13 < pb ? 10 * rp_13 + (b[13] - "0") * ra_14 - dd * count(k < 18: 10 * rp_13 + (b[13] - "0") * ra_14 >= (k + 1) * dd) : rp_13'
  # ---- sa_14 = (num_a * den_b) mod dd ----
  sa_0: '0'
  sa_1: '0 < pa ? 10 * sa_0 + (a[0] - "0") * den_b - dd * count(k < 18: 10 * sa_0 + (a[0] - "0") * den_b >= (k + 1) * dd) : sa_0'
  sa_2: '1 < pa ? 10 * sa_1 + (a[1] - "0") * den_b - dd * count(k < 18: 10 * sa_1 + (a[1] - "0") * den_b >= (k + 1) * dd) : sa_1'
  sa_3: '2 < pa ? 10 * sa_2 + (a[2] - "0") * den_b - dd * count(k < 18: 10 * sa_2 + (a[2] - "0") * den_b >= (k + 1) * dd) : sa_2'
  sa_4: '3 < pa ? 10 * sa_3 + (a[3] - "0") * den_b - dd * count(k < 18: 10 * sa_3 + (a[3] - "0") * den_b >= (k + 1) * dd) : sa_3'
  sa_5: '4 < pa ? 10 * sa_4 + (a[4] - "0") * den_b - dd * count(k < 18: 10 * sa_4 + (a[4] - "0") * den_b >= (k + 1) * dd) : sa_4'
  sa_6: '5 < pa ? 10 * sa_5 + (a[5] - "0") * den_b - dd * count(k < 18: 10 * sa_5 + (a[5] - "0") * den_b >= (k + 1) * dd) : sa_5'
  sa_7: '6 < pa ? 10 * sa_6 + (a[6] - "0") * den_b - dd * count(k < 18: 10 * sa_6 + (a[6] - "0") * den_b >= (k + 1) * dd) : sa_6'
  sa_8: '7 < pa ? 10 * sa_7 + (a[7] - "0") * den_b - dd * count(k < 18: 10 * sa_7 + (a[7] - "0") * den_b >= (k + 1) * dd) : sa_7'
  sa_9: '8 < pa ? 10 * sa_8 + (a[8] - "0") * den_b - dd * count(k < 18: 10 * sa_8 + (a[8] - "0") * den_b >= (k + 1) * dd) : sa_8'
  sa_10: '9 < pa ? 10 * sa_9 + (a[9] - "0") * den_b - dd * count(k < 18: 10 * sa_9 + (a[9] - "0") * den_b >= (k + 1) * dd) : sa_9'
  sa_11: '10 < pa ? 10 * sa_10 + (a[10] - "0") * den_b - dd * count(k < 18: 10 * sa_10 + (a[10] - "0") * den_b >= (k + 1) * dd) : sa_10'
  sa_12: '11 < pa ? 10 * sa_11 + (a[11] - "0") * den_b - dd * count(k < 18: 10 * sa_11 + (a[11] - "0") * den_b >= (k + 1) * dd) : sa_11'
  sa_13: '12 < pa ? 10 * sa_12 + (a[12] - "0") * den_b - dd * count(k < 18: 10 * sa_12 + (a[12] - "0") * den_b >= (k + 1) * dd) : sa_12'
  sa_14: '13 < pa ? 10 * sa_13 + (a[13] - "0") * den_b - dd * count(k < 18: 10 * sa_13 + (a[13] - "0") * den_b >= (k + 1) * dd) : sa_13'
  # ---- sb_14 = (num_b * den_a) mod dd ----
  sb_0: '0'
  sb_1: '0 < pb ? 10 * sb_0 + (b[0] - "0") * den_a - dd * count(k < 18: 10 * sb_0 + (b[0] - "0") * den_a >= (k + 1) * dd) : sb_0'
  sb_2: '1 < pb ? 10 * sb_1 + (b[1] - "0") * den_a - dd * count(k < 18: 10 * sb_1 + (b[1] - "0") * den_a >= (k + 1) * dd) : sb_1'
  sb_3: '2 < pb ? 10 * sb_2 + (b[2] - "0") * den_a - dd * count(k < 18: 10 * sb_2 + (b[2] - "0") * den_a >= (k + 1) * dd) : sb_2'
  sb_4: '3 < pb ? 10 * sb_3 + (b[3] - "0") * den_a - dd * count(k < 18: 10 * sb_3 + (b[3] - "0") * den_a >= (k + 1) * dd) : sb_3'
  sb_5: '4 < pb ? 10 * sb_4 + (b[4] - "0") * den_a - dd * count(k < 18: 10 * sb_4 + (b[4] - "0") * den_a >= (k + 1) * dd) : sb_4'
  sb_6: '5 < pb ? 10 * sb_5 + (b[5] - "0") * den_a - dd * count(k < 18: 10 * sb_5 + (b[5] - "0") * den_a >= (k + 1) * dd) : sb_5'
  sb_7: '6 < pb ? 10 * sb_6 + (b[6] - "0") * den_a - dd * count(k < 18: 10 * sb_6 + (b[6] - "0") * den_a >= (k + 1) * dd) : sb_6'
  sb_8: '7 < pb ? 10 * sb_7 + (b[7] - "0") * den_a - dd * count(k < 18: 10 * sb_7 + (b[7] - "0") * den_a >= (k + 1) * dd) : sb_7'
  sb_9: '8 < pb ? 10 * sb_8 + (b[8] - "0") * den_a - dd * count(k < 18: 10 * sb_8 + (b[8] - "0") * den_a >= (k + 1) * dd) : sb_8'
  sb_10: '9 < pb ? 10 * sb_9 + (b[9] - "0") * den_a - dd * count(k < 18: 10 * sb_9 + (b[9] - "0") * den_a >= (k + 1) * dd) : sb_9'
  sb_11: '10 < pb ? 10 * sb_10 + (b[10] - "0") * den_a - dd * count(k < 18: 10 * sb_10 + (b[10] - "0") * den_a >= (k + 1) * dd) : sb_10'
  sb_12: '11 < pb ? 10 * sb_11 + (b[11] - "0") * den_a - dd * count(k < 18: 10 * sb_11 + (b[11] - "0") * den_a >= (k + 1) * dd) : sb_11'
  sb_13: '12 < pb ? 10 * sb_12 + (b[12] - "0") * den_a - dd * count(k < 18: 10 * sb_12 + (b[12] - "0") * den_a >= (k + 1) * dd) : sb_12'
  sb_14: '13 < pb ? 10 * sb_13 + (b[13] - "0") * den_a - dd * count(k < 18: 10 * sb_13 + (b[13] - "0") * den_a >= (k + 1) * dd) : sb_13'
  # ---- the model's verdicts ----
  rem_p: 'rp_14'
  rem_s: 'sa_14 + sb_14 - (sa_14 + sb_14 >= dd ? dd : 0)'
  whole_p: 'rem_p == 0'
  whole_s: 'rem_s == 0'
  expected: 'whole_p || whole_s'

assumptions:
  - id: RB-A-IN-1-A
    req: R-IN-1
    expr: 'fmt_a'
    note: >-
      Reading 1 of "<numerator>/<denominator>": a is exactly a non-empty run of
      decimal digits, one '/', and a non-empty run of decimal digits, with no
      leading zero, sign or space (a[0] and the first character after the '/'
      are not '0').
  - id: RB-A-IN-1-B
    req: R-IN-1
    expr: 'fmt_b'
    note: Same format obligation as RB-A-IN-1-A, for the second argument b.
  - id: RB-A-IN-2
    req: R-IN-2
    expr: 'num_a >= 1 && den_a >= 1 && num_b >= 1 && den_b >= 1'
    note: >-
      Reading 1 of "positive whole numbers": integers of at least 1, so a
      numerator of 0 never occurs.  Given RB-A-IN-1-* (digits, no leading
      zero) this is already implied; it is kept as its own obligation.
  - id: RB-A-IN-3
    req: R-IN-3
    expr: 'valid_a && valid_b'
    note: >-
      Reading 1 of "valid fractions": a valid fraction is a string in the
      stated <numerator>/<denominator> format whose numerator and denominator
      are positive whole numbers (valid_s = fmt_s && num_s >= 1 && den_s >= 1).
  - id: RB-A-IN-4
    req: R-IN-4
    expr: 'den_a != 0 && den_b != 0'
    note: >-
      Reading 1 of "do not have zero as denominator": a redundant restatement
      of R-IN-2; it implies nothing about the numerator.

properties:
  - id: RB-RES-1-PROD
    req: R-RES-1
    pattern: implies
    args: {trigger: 'valid && whole_p', cond: 'outcome == 0 && result'}
    note: >-
      Reading 1 of "x * n or x + n evaluates to a whole number" (True when at
      least one of the two is whole); this item is the product half.  x is a,
      n is b (R-FN-2, reading 1).  "evaluates" is exact rational arithmetic
      (reading 1): x * n = (num_a * num_b) / dd is whole iff dd divides
      num_a * num_b, i.e. rem_p == 0.  "whole number" is any integer
      (reading 1); with positive numerators the product and sum are positive,
      so readings 1 to 3 of that phrase coincide here.  "returns True" means
      the call returns the bool True (outcome 0, result 1).  The trigger
      repeats the validity of the arguments so that the obligation applies to
      every call with valid arguments, whatever the other calls were.
  - id: RB-RES-1-SUM
    req: R-RES-1
    pattern: implies
    args: {trigger: 'valid && whole_s', cond: 'outcome == 0 && result'}
    note: >-
      The sum half of R-RES-1 under reading 1 (either expression being whole
      suffices): x + n = (num_a * den_b + num_b * den_a) / dd is whole iff
      rem_s == 0.  Under this literal reading, e.g. simplify("1/2", "1/2")
      must return True (sum 1) although the product 1/4 is not whole; no
      example of the prompt exercises this case.
  - id: RB-RES-2
    req: R-RES-2
    pattern: implies
    args: {trigger: 'valid && !whole_p && !whole_s', cond: 'outcome == 0 && !result'}
    note: >-
      Reading 1 of "otherwise": False when neither x * n nor x + n is a whole
      number.  "False" is the bool False (outcome 0, result 0), reading 1.
      Together with RB-RES-1-PROD and RB-RES-1-SUM this fixes, for every
      valid call, outcome == 0 && result == expected.
  - id: RB-EX-1
    req: R-EX-1
    pattern: implies
    args: {trigger: 'a == "1/5" && b == "5/1"', cond: 'outcome == 0 && result'}
    note: >-
      The example as a required input/output pair.  Reading 1: consistent with
      R-RES-1 because the product 1/5 * 5/1 = 1 is whole (the sum 26/5 is not).
  - id: RB-EX-2
    req: R-EX-2
    pattern: implies
    args: {trigger: 'a == "1/6" && b == "2/1"', cond: 'outcome == 0 && !result'}
    note: The example as a required input/output pair (product 1/3, sum 13/6, neither whole).
  - id: RB-EX-3
    req: R-EX-3
    pattern: implies
    args: {trigger: 'a == "7/10" && b == "10/2"', cond: 'outcome == 0 && !result'}
    note: >-
      The example as a required input/output pair (product 7/2, sum 57/10,
      neither whole); "10/2" is not in lowest terms and is still a valid
      argument.

scenarios:
  - id: RB-S-EX-1
    req: R-EX-1
    cover: 'a == "1/5" && b == "5/1" && outcome == 0 && result'
  - id: RB-S-EX-2
    req: R-EX-2
    cover: 'a == "1/6" && b == "2/1" && outcome == 0 && !result'
  - id: RB-S-EX-3
    req: R-EX-3
    cover: 'a == "7/10" && b == "10/2" && outcome == 0 && !result'
  - id: RB-S-RES-1-SUM
    req: R-RES-1
    cover: 'a == "1/2" && b == "1/2" && outcome == 0 && result'
    note: >-
      Witness of the sum branch under reading 1 of R-RES-1: 1/2 + 1/2 = 1 is
      whole while 1/2 * 1/2 = 1/4 is not, so the call must return True.  Under
      the product-only reading (reading 2) it would return False.

dont_cares:
  - id: RB-D-IN-3-OUTCOME
    req: R-IN-3
    signal: outcome
    when: '!valid'
    note: The prompt only covers valid fractions; how a call with an invalid argument ends is not specified.
  - id: RB-D-IN-3-RESULT
    req: R-IN-3
    signal: result
    when: '!valid'
    note: The value returned for an invalid argument is not specified (the frame rule F-ZERO still applies).

unformalized:
  - req: R-FN-1
    reason: >-
      Non-functional: the name simplify and its two parameters are fixed by the
      adapter's `function` section in design.yaml, not by any trace property.
      A missing function would surface as outcome != 0 on valid calls, which
      RB-RES-1-* and RB-RES-2 reject.
  - req: R-FN-2
    reason: >-
      Definition (reading 1, by position): x is the first argument a, n the
      second argument b.  It is realized by the defs num_a/den_a (x) and
      num_b/den_b (n) used by the result properties.
    covered_by: [RB-RES-1-PROD, RB-RES-1-SUM, RB-RES-2]
  - req: R-FN-3
    reason: >-
      Definition: the expressions x * n and x + n are realized by the defs
      rem_p/whole_p (product) and rem_s/whole_s (sum).  "simplify the
      expression" is read as a loose description of the task (reading 1); the
      function returns a bool, as R-RES-1 and R-RES-2 say.  "x * n, or x + n"
      is read as both expressions being considered (reading 3).
    covered_by: [RB-RES-1-PROD, RB-RES-1-SUM, RB-RES-2]
  - req: R-FR-1
    reason: Frame rule F-ZERO of design.yaml, which is part of every formalization set; restating it would duplicate it.
    covered_by: [F-ZERO]

decisions:
  - {req: R-FN-2, phrase: 'a, b', reading: 1}
  - {req: R-FN-3, phrase: 'simplify the expression', reading: 1}
  - {req: R-FN-3, phrase: 'x * n, or x + n', reading: 3}
  - {req: R-IN-1, phrase: '<numerator>/<denominator>', reading: 1}
  - {req: R-IN-2, phrase: 'positive whole numbers', reading: 1}
  - {req: R-IN-3, phrase: 'valid fractions', reading: 1}
  - {req: R-IN-4, phrase: 'do not have zero as denominator', reading: 1}
  - {req: R-RES-1, phrase: 'x * n or x + n evaluates to a whole number', reading: 1}
  - {req: R-RES-1, phrase: 'evaluates', reading: 1}
