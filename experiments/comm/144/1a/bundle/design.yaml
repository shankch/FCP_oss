fcp: '0.1'
design: review
summary: A Python function on strings treated as a chip without memory. Each cycle is one call of simplify(a, b); the two arguments are input strings of at most 16 characters, the returned boolean and the way the call ended are outputs. The prompt is the specification, and code written by AI models is checked by running it.
docs:
- {id: SPEC, path: spec.md, title: 'Prompt: simplify(a, b) on fractions written as strings'}
- {id: FRAME, path: frame.md, title: 'FCP function adapter, version 0.2'}
interface:
  clock: clk
  reset: {name: rst_n, active_low: true, synchronous: true}
  signals:
  - {name: clk, dir: in, width: 1}
  - {name: rst_n, dir: in, width: 1}
  - {name: a, dir: in, width: 8, length: 16, desc: 'the first argument, a: a string of at most 16 characters, codes 0 to 255'}
  - {name: b, dir: in, width: 8, length: 16, desc: 'the second argument, b: a string of at most 16 characters, codes 0 to 255'}
  - {name: outcome, dir: out, width: 2, desc: 'how the call ended: 0 returned a bool, 1 any exception or no answer, 2 returned anything else'}
  - {name: result, dir: out, width: 1, desc: 'the returned value (outcome 0), 1: True'}
environment: {initial_reset: true, reset_anytime: false, bmc_depth: 3, cover_depth: 3}
frame:
- {id: F-ZERO, req: R-FR-1, expr: 'outcome != 0 -> !result'}
function:
  name: simplify
  args:
  - {name: a, signal: a, type: str}
  - {name: b, signal: b, type: str}
  returns: {signal: result, type: bool}
  outcome: {signal: outcome, raises: []}
  scope:
    a: {alphabet: '0123456789/', random: 2000, values: ['1/5', '1/6', '7/10']}
    b: {alphabet: '0123456789/', random: 2000, values: ['5/1', '2/1', '10/2']}
