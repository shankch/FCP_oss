fcp: '0.1'
set: agent_b
origin: {kind: agent, role: formalizer, id: agent_b}

# Specification model. simplify keeps no state between calls (frame.md), so the
# model is combinational: each argument is parsed into its numerator and
# denominator values, and x * n is the fraction num / den (R-DEF-1).
defs:
  # powers of ten, indexed by exponent (0 .. 11)
  p10: '[1, 10, 100, 1000, 10000, 100000, 1000000, 10000000, 100000000, 1000000000, 10000000000, 100000000000]'

  # ---- argument x -------------------------------------------------------
  # index of the first "/" in x (len(x) when there is none)
  xs: 'count(i < len(x): all(j < i + 1: x[j] != "/"))'
  # <numerator>/<denominator>: one "/", a non-empty digit string on each side, nothing else
  xshape: 'xs >= 1 && xs + 2 <= len(x) && all(i < len(x): i == xs || isdigit(x[i]))'
  # no leading zero in the numerator or the denominator digit string
  xnlz: '!(xs >= 2 && x[0] == "0") && !(len(x) - xs >= 3 && x[xs + 1] == "0")'
  # decimal value of the characters before / after the first "/"
  xa: 'sum(i < xs: (x[i] - "0") * p10[xs - 1 - i])'
  xb: 'sum(i < len(x): i > xs ? (x[i] - "0") * p10[len(x) - 1 - i] : 0)'
  # numerator / denominator of x is a positive whole number written in decimal digits
  xnum_pos: 'xs >= 1 && all(i < xs: isdigit(x[i])) && xa >= 1'
  xden_pos: 'xs + 2 <= len(x) && all(i < len(x): i > xs -> isdigit(x[i])) && xb >= 1'
  xvalid: 'xshape && xnlz && xnum_pos && xden_pos'

  # ---- argument n -------------------------------------------------------
  ns: 'count(i < len(n): all(j < i + 1: n[j] != "/"))'
  nshape: 'ns >= 1 && ns + 2 <= len(n) && all(i < len(n): i == ns || isdigit(n[i]))'
  nnlz: '!(ns >= 2 && n[0] == "0") && !(len(n) - ns >= 3 && n[ns + 1] == "0")'
  na: 'sum(i < ns: (n[i] - "0") * p10[ns - 1 - i])'
  nb: 'sum(i < len(n): i > ns ? (n[i] - "0") * p10[len(n) - 1 - i] : 0)'
  nnum_pos: 'ns >= 1 && all(i < ns: isdigit(n[i])) && na >= 1'
  nden_pos: 'ns + 2 <= len(n) && all(i < len(n): i > ns -> isdigit(n[i])) && nb >= 1'
  nvalid: 'nshape && nnlz && nnum_pos && nden_pos'

  # ---- the call -----------------------------------------------------------
  valid: 'xvalid && nvalid'
  # x * n = (xa / xb) * (na / nb) = num / den
  num: 'xa * na'
  den: 'xb * nb'

# The quotient candidate. FCP-PL has no existential quantifier over large
# ranges and `%` needs a constant divisor, so "num / den is a whole number"
# (exists q >= 0: num == q * den) is stated universally: for every q, a call
# with num == q * den returns True, and a call with q * den < num < (q + 1) * den
# returns False. Under the assumptions num <= 9999999999 * 9999999999 < 10^20,
# so floor(num / den) always lies in the range.
rigids:
  - {name: q, range: [0, 100000000000000000000]}

assumptions:
  - id: RB-IN-2-X
    req: R-IN-2
    expr: 'xshape && xnlz'
    note: >-
      x is <numerator>/<denominator>: exactly one "/", a non-empty string of
      decimal digits before and after it, no other characters, and no leading
      zero in either digit string. Reading 1 of "<numerator>/<denominator>"
      (no spaces, signs or leading zeros) and reading 1 of "have the following
      format" (a promise by the caller, so it is an assumption).
  - id: RB-IN-2-N
    req: R-IN-2
    expr: 'nshape && nnlz'
    note: Same as RB-IN-2-X for the argument n.
  - id: RB-IN-3-X
    req: R-IN-3
    expr: 'xnum_pos'
    note: >-
      The numerator of x (the characters before the first "/") is a non-empty
      string of decimal digits whose value is at least 1 (reading 1 of
      "positive whole numbers").
  - id: RB-IN-3-N
    req: R-IN-3
    expr: 'nnum_pos'
    note: Same as RB-IN-3-X for the argument n.
  - id: RB-IN-4-X
    req: R-IN-4
    expr: 'xden_pos'
    note: >-
      The denominator of x (the characters after the first "/") is a non-empty
      string of decimal digits whose value is at least 1 (reading 1 of
      "positive whole numbers").
  - id: RB-IN-4-N
    req: R-IN-4
    expr: 'nden_pos'
    note: Same as RB-IN-4-X for the argument n.
  - id: RB-IN-5
    req: R-IN-5
    expr: 'valid'
    note: >-
      x and n are valid fractions. Reading 1 of "valid fractions": the format
      of R-IN-2 with positive whole numerator and denominator (R-IN-3, R-IN-4),
      not necessarily in lowest terms ("10/2" in the third example).
  - id: RB-IN-6-X
    req: R-IN-6
    expr: 'xb != 0'
    note: >-
      The value of the denominator of x is not zero. The value is the decimal
      value of the characters after the first "/"; it is that digit string's
      value whenever RB-IN-2-X holds. Implied by RB-IN-4-X.
  - id: RB-IN-6-N
    req: R-IN-6
    expr: 'nb != 0'
    note: Same as RB-IN-6-X for the argument n.

properties:
  - id: RB-RET-1
    req: R-RET-1
    pattern: implies
    args:
      trigger: 'valid && num == q * den'
      cond: 'outcome == 0 && result'
    note: >-
      For valid arguments whose product num / den equals a whole number q, the
      call returns the bool True. Readings: "whole number" 1 (q ranges over
      non-negative integers; the product of two positive fractions is never 0
      or negative, so readings 1 to 3 coincide here); "evaluates to" 1 (exact
      rational arithmetic, no floating point); "returns True" 1 (the bool True:
      outcome 0 and result 1, not outcome 2 with a truthy value); the bool
      answer is the obligation, "simplify the expression" being only the
      purpose (reading 1).
  - id: RB-RET-2
    req: R-RET-2
    pattern: implies
    args:
      trigger: 'valid && q * den < num && num < (q + 1) * den'
      cond: 'outcome == 0 && !result'
    note: >-
      For valid arguments whose product num / den lies strictly between two
      consecutive whole numbers q and q + 1 (so it is not a whole number), the
      call returns the bool False. Reading 1 of "otherwise": only valid
      arguments are constrained; behaviour on invalid arguments is left free
      (RB-IN-5 and the don't-cares on R-IN-5). Reading 1 of "False": the bool
      False (outcome 0 and result 0, not None or 0).
  - id: RB-EX-1-P
    req: R-EX-1
    pattern: implies
    args:
      trigger: 'x == "1/5" && n == "5/1"'
      cond: 'outcome == 0 && result'
    note: >-
      simplify("1/5", "5/1") = True. The function keeps no state, so the example
      fixes the answer of every such call, not only of some.
  - id: RB-EX-2-P
    req: R-EX-2
    pattern: implies
    args:
      trigger: 'x == "1/6" && n == "2/1"'
      cond: 'outcome == 0 && !result'
    note: simplify("1/6", "2/1") = False, in every such call.
  - id: RB-EX-3-P
    req: R-EX-3
    pattern: implies
    args:
      trigger: 'x == "7/10" && n == "10/2"'
      cond: 'outcome == 0 && !result'
    note: >-
      simplify("7/10", "10/2") = False, in every such call. "10/2" is not in
      lowest terms, so valid fractions need not be reduced.

scenarios:
  - id: RB-EX-1
    req: R-EX-1
    cover: 'x == "1/5" && n == "5/1" && outcome == 0 && result'
    note: The call simplify("1/5", "5/1") returning True is possible (1/5 * 5/1 = 1).
  - id: RB-EX-2
    req: R-EX-2
    cover: 'x == "1/6" && n == "2/1" && outcome == 0 && !result'
    note: The call simplify("1/6", "2/1") returning False is possible (1/6 * 2/1 = 1/3).
  - id: RB-EX-3
    req: R-EX-3
    cover: 'x == "7/10" && n == "10/2" && outcome == 0 && !result'
    note: The call simplify("7/10", "10/2") returning False is possible (7/10 * 10/2 = 7/2).

dont_cares:
  - id: RB-IN-5-DC-OUTCOME
    req: R-IN-5
    signal: outcome
    when: '!valid'
    note: >-
      Reading 1 of "You can assume": on arguments that are not valid fractions
      the function may return anything or raise.
  - id: RB-IN-5-DC-RESULT
    req: R-IN-5
    signal: result
    when: '!valid'
    note: Same as RB-IN-5-DC-OUTCOME for the returned value.

unformalized:
  - req: R-IF-1
    reason: >-
      Interface binding, not a property of the trace: the adapter calls the
      function named simplify with x as the first and n as the second argument
      (design.yaml, function section). A missing or misnamed function ends every
      call with outcome 1, which RB-RET-1 and RB-RET-2 reject on valid
      arguments. Swapping the parameters is not observable at all, because the
      product is commutative.
  - req: R-FN-1
    reason: >-
      Statement of purpose (reading 1 of "simplify the expression x * n"). The
      observable obligation is the True/False answer, formalized by RB-RET-1
      and RB-RET-2. Under reading 2 (return the simplified product) the
      sentence would contradict R-RET-1 and R-RET-2, which require a bool.
    covered_by: [RB-RET-1, RB-RET-2]
  - req: R-DEF-1
    reason: >-
      Definition, realized by the defs xa, xb, na, nb (decimal values of the
      numerators and denominators) and num = xa * na, den = xb * nb, so that
      x * n is the rational num / den (reading 1 of "x * n": the arithmetic
      product of the fraction values, not the Python expression on strings).
    covered_by: [RB-RET-1, RB-RET-2]
  - req: R-IN-1
    reason: >-
      "String" holds by construction of the interface (x and n are string
      signals). What "representation of a fraction" means is given by the
      format of R-IN-2 and the validity of R-IN-5, so those assumptions realize
      it; a separate assumption would only repeat them.
    covered_by: [RB-IN-2-X, RB-IN-2-N, RB-IN-5]
  - req: R-FR-1
    reason: >-
      Frame rule of the adapter (frame.md): design.yaml declares it as F-ZERO
      ('outcome != 0 -> !result'), which is added to every formalization set,
      so it is not restated here.
    covered_by: [F-ZERO]

decisions:
  - {req: R-FN-1, phrase: 'simplify the expression x * n', reading: 1}
  - {req: R-DEF-1, phrase: 'x * n', reading: 1}
  - {req: R-RET-1, phrase: 'whole number', reading: 1}
  - {req: R-RET-1, phrase: 'evaluates to', reading: 1}
  - {req: R-RET-1, phrase: 'returns True', reading: 1}
  - {req: R-RET-1, phrase: 'returns True if x * n evaluates to a whole number', reading: 1}
  - {req: R-RET-2, phrase: 'otherwise', reading: 1}
  - {req: R-RET-2, phrase: 'False', reading: 1}
  - {req: R-RET-2, phrase: 'False otherwise', reading: 1}
  - {req: R-IN-2, phrase: '<numerator>/<denominator>', reading: 1}
  - {req: R-IN-2, phrase: 'have the following format', reading: 1}
  - {req: R-IN-3, phrase: 'positive whole numbers', reading: 1}
  - {req: R-IN-4, phrase: 'positive whole numbers', reading: 1}
  - {req: R-IN-5, phrase: 'valid fractions', reading: 1}
  - {req: R-IN-5, phrase: 'You can assume', reading: 1}
