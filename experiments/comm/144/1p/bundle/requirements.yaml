    - a string '<numerator>/<denominator>' in which the numerator may be zero
    - a string '<numerator>/<denominator>' that may also carry a sign, spaces or leading zeros, or a whole number written without '/'
    - a Fraction object or a number rather than a string (the adapter passes only strings)
  - phrase: valid fractions, and do not have zero as denominator
    readings:
