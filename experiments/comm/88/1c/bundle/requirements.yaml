- id: R-IF-1
  doc: SPEC
  quote: 'def sort_array(array):'
  text: The code defines a Python function named sort_array that takes one parameter, array.
  kind: non_functional
  lines:
  - 4
- id: R-IN-1
  doc: SPEC
  quote: Given an array of non-negative integers
  text: Every element of the argument array passed to sort_array is a non-negative integer.
  kind: assumption
  lines:
  - 6
- id: R-RES-1
  doc: SPEC
  quote: return a copy of the given array after sorting
  text: 'For every allowed argument, sort_array returns a list: it does not raise an exception, fail to finish, or return a value of another kind.'
  kind: guarantee
  lines:
  - 6
- id: R-RES-2
  doc: SPEC
  quote: return a copy of the given array after sorting
  text: The list returned by sort_array holds exactly the elements of the argument array, each as many times as it occurs in the argument (same length, same multiset of values).
  kind: guarantee
  ambiguity:
  - phrase: a copy
    readings:
    - The returned list must be a new list object, distinct from the argument object.
    - Only the contents of the returned list matter; returning the argument object itself is acceptable when it already holds the right contents.
  - phrase: a copy of the given array after sorting
    readings:
    - Return a sorted copy and leave the argument as it was passed (consistent with "don't change the given array", R-MUT-1).
    - Sort the given array itself and then return a copy of it; this contradicts "don't change the given array" (R-MUT-1).
  lines:
  - 6
- id: R-DEF-1
  doc: SPEC
  quote: the sum( first index value, last index value)
  text: 'The parity sum of an argument array is the value of its first element plus the value of its last element: array[0] + array[len(array) - 1].'
  kind: definition
  ambiguity:
  - phrase: first index value
    readings:
    - 'The values stored at the first and the last index: array[0] + array[len(array) - 1].'
    - 'The indices themselves: 0 + (len(array) - 1), so the parity depends only on the length of the array.'
  - phrase: sum( first index value, last index value)
    readings:
    - For a one-element array the single element is both first and last and is counted twice (array[0] + array[0], always even).
    - For a one-element array the single element is counted once (array[0]).
  - phrase: last index value
    readings:
    - For an empty array there is no first or last value, so the sum is undefined and neither order rule applies.
    - For an empty array the missing values count as 0, so the sum is 0 (even) and the descending rule applies.
  lines:
  - 7
- id: R-ORD-1
  doc: SPEC
  quote: you will sort the given array in ascending order if the sum( first index value, last index value) is odd
  text: If the sum of the first and the last element of the argument array is odd, the list returned by sort_array is in ascending order.
  kind: guarantee
  depends:
  - R-DEF-1
  ambiguity:
  - phrase: ascending order
    readings:
    - 'Non-decreasing: each element is at most the next one, duplicates kept.'
    - 'Strictly increasing: each element is less than the next one (impossible while keeping every element when the argument has duplicates).'
  - phrase: you will sort the given array
    readings:
    - Sort a copy of the argument; the argument itself stays unchanged (consistent with "don't change the given array", R-MUT-1).
    - Sort the argument itself in place; this contradicts "don't change the given array" (R-MUT-1).
  - phrase: in ascending order if the sum( first index value, last index value) is odd
    readings:
    - 'The rule is right: an odd sum gives ascending order, so the example sort_array([2, 4, 3, 0, 1, 5]) => [5, 4, 3, 2, 1, 0] (R-EX-3) is wrong, since 2 + 5 = 7 is odd (and 0 + 5 = 5 under the index reading);
      its result should be [0, 1, 2, 3, 4, 5].'
    - 'The example R-EX-3 is right: an odd sum gives descending order, and the rule has odd and even swapped.'
  lines:
  - 7
- id: R-ORD-2
  doc: SPEC
  quote: or sort it in descending order if the sum( first index value, last index value) is even.
  text: If the sum of the first and the last element of the argument array is even, the list returned by sort_array is in descending order.
  kind: guarantee
  depends:
  - R-DEF-1
  ambiguity:
  - phrase: descending order
    readings:
    - 'Non-increasing: each element is at least the next one, duplicates kept.'
    - 'Strictly decreasing: each element is greater than the next one (impossible while keeping every element when the argument has duplicates).'
  - phrase: sort it
    readings:
    - Sort a copy of the argument; the argument itself stays unchanged (consistent with "don't change the given array", R-MUT-1).
    - Sort the argument itself in place; this contradicts "don't change the given array" (R-MUT-1).
  - phrase: in descending order if the sum( first index value, last index value) is even
    readings:
    - 'The rule is right: an even sum gives descending order, so the example sort_array([2, 4, 3, 0, 1, 5, 6]) => [0, 1, 2, 3, 4, 5, 6] (R-EX-4) is wrong, since 2 + 6 = 8 is even (and 0 + 6 = 6 under the
      index reading); its result should be [6, 5, 4, 3, 2, 1, 0].'
    - 'The example R-EX-4 is right: an even sum gives ascending order, and the rule has odd and even swapped.'
  lines:
  - 8
- id: R-MUT-1
  doc: SPEC
  quote: don't change the given array.
  text: 'A call of sort_array leaves its argument list unchanged: after the call it has the same length and the same elements in the same order as before.'
  kind: guarantee
  ambiguity:
  - phrase: don't change the given array
    readings:
    - 'This note wins: the argument is left unchanged, and "you will sort the given array" / "sort it" (R-ORD-1, R-ORD-2) and "a copy of the given array after sorting" (R-RES-2) mean sorting a copy.'
    - 'The statements "you will sort the given array", "sort it" and "return a copy of the given array after sorting" win: the argument is sorted in place and then copied, contradicting this note.'
  lines:
  - 11
