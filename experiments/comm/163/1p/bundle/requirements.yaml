  - phrase: return the even digits
    readings:
    - 'The order is unconstrained: any order of the required elements is acceptable.'
    - Ascending order is implied, as is conventional for a list of numbers in a range.
    - The order runs from a towards b, so the list is descending when a > b.
  lines:
  - 6
