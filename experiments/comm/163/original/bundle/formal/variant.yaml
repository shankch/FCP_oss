fcp: '0.1'
set: variant
origin: {kind: agent, role: formalizer, id: variant}

defs:
  lo: 'min(a, b)'
  hi: 'max(a, b)'

assumptions:
  - id: RV-ENV-1
    req: R-ENV-1
    expr: 'a >= 0 && b >= 0'
    note: >-
      Reading imposed by the request for "positive integers" (reading 2, taken
      although a >= 1 seems more natural): a and b are non-negative, so a call
      with a or b equal to 0 is inside the contract and every rule below
      applies to it. Since a and b are 8-bit signals (0 to 255) the assumption
      excludes no call of the trace. Whether 0 counts as an even digit is
      decided under R-OUT-2/R-OUT-3 (it does not).

properties:
  - id: RV-IF-2-SOUND
    req: R-IF-2
    expr: 'all(i < len(result): result[i] % 2 == 0 && lo < result[i] && result[i] < hi)'
    note: >-
      Reading imposed by the request for "generate_integers" (reading 2, taken
      although reading it as a mere name seems more natural): the name states
      the behaviour, the function generates the even integers between a and b,
      of any size. "between" is read as in the rest of this set (R-OUT-2/R-OUT-3,
      reading 2): strictly between min(a, b) and max(a, b), ends excluded. This
      item: every returned element is such an even integer. It conflicts with
      the docstring ("return the even digits", RV-OUT-2/RV-OUT-3) and with the
      example generate_integers(10, 14) => []. The argument names and order
      (a, b) are fixed by the function section of design.yaml, not by a
      property.
  - id: RV-IF-2-COMPLETE
    req: R-IF-2
    pattern: implies
    args:
      trigger: 'outcome == 0'
      cond: 'all(k < 256: k % 2 == 0 && lo < k && k < hi -> k in result)'
    note: >-
      Reading imposed by the request for "generate_integers" (reading 2, taken
      although reading it as a mere name seems more natural): every even
      integer of any size strictly between min(a, b) and max(a, b) is in the
      returned list. Conditioned on outcome 0 because the trace shows the
      contents only of a returned list of at most 10 numbers; a longer list or
      a value in another form (allowed by RV-OUT-1) is outcome 2. Together with
      RV-OUT-2 this leaves no list answer (outcome 0) whenever an even integer
      of 10 or more lies strictly between the arguments, e.g. (10, 14) must
      then end with outcome 2: the name reading and the docstring conflict.

  - id: RV-OUT-1
    req: R-OUT-1
    expr: 'outcome == 0 || outcome == 2'
    note: >-
      Reading imposed by the request for "return the even digits" (reading 2,
      taken although "a list of int, as the examples show" seems more natural):
      the digits may be returned in another form, as digit characters (strings
      such as '2') or as another sequence type such as a tuple or a generator.
      The frame records such a value as outcome 2, without its contents, so the
      property only requires that the call returns: no exception and no
      non-termination (outcome 1). A returned list of ints (outcome 0) is still
      accepted and is checked by the content rules. The stricter sense "must
      not be a list of int" (outcome == 2 only) was not taken: it would make
      every content rule of the prompt unobservable and contradict the
      examples' form outright.
  - id: RV-OUT-2
    req: R-OUT-2
    expr: 'all(i < len(result): (result[i] == 2 || result[i] == 4 || result[i] == 6 || result[i] == 8) && lo < result[i] && result[i] < hi)'
    note: >-
      Readings imposed by the request (taken although others seem more
      natural): "even digits" (reading 2) are 2, 4, 6 and 8 only, 0 is not
      counted; "between a and b" (reading 2) is strictly between min(a, b) and
      max(a, b), ends excluded. Every returned element is such a digit. This
      contradicts the examples generate_integers(2, 8) => [2, 4, 6, 8] and
      generate_integers(8, 2) => [2, 4, 6, 8] (2 and 8 are ends), which this
      set treats as illustrative (R-EX-1, R-EX-2). Holds trivially when
      outcome is not 0 (result is then empty by F-EMPTY).
  - id: RV-OUT-3
    req: R-OUT-3
    pattern: implies
    args:
      trigger: 'outcome == 0'
      cond: '(lo < 2 && 2 < hi -> 2 in result) && (lo < 4 && 4 < hi -> 4 in result) && (lo < 6 && 6 < hi -> 6 in result) && (lo < 8 && 8 < hi -> 8 in result)'
    note: >-
      Readings imposed by the request (taken although others seem more
      natural): "even digits" (reading 2) are 2, 4, 6 and 8 only, 0 is not
      counted; "between a and b" (reading 2) is strictly between min(a, b) and
      max(a, b), ends excluded. Every such digit appears in the returned list,
      e.g. (2, 8) and (8, 2) give 4 and 6, (0, 4) gives 2. Conditioned on
      outcome 0 because, under the imposed reading of "return the even digits"
      (RV-OUT-1), the digits may be returned in another form, which the trace
      records as outcome 2 without its contents. Contradicts the examples
      (2, 8) => [2, 4, 6, 8] and (8, 2) => [2, 4, 6, 8], treated as
      illustrative.
  - id: RV-OUT-4
    req: R-OUT-4
    expr: 'all(i < len(result) - 1: result[i] <= result[i + 1])'
    note: >-
      Reading imposed by the request for "ascending order" (reading 2, taken
      although strictly increasing seems more natural): non-decreasing, each
      element is at most the next, so a value may repeat. No other rule of the
      prompt forbids repeats, so e.g. [4, 4, 6] for (2, 8) is allowed by this
      set.

unformalized:
  - req: R-IF-1
    reason: >-
      Non-functional: the deliverable is Python code completing the stub. It
      is not a property of any call; the function section of design.yaml binds
      the code to the trace.
  - req: R-EX-1
    covered_by: [RV-OUT-2, RV-OUT-3, RV-OUT-4]
    reason: >-
      Reading imposed by the request for "generate_integers(2, 8) => [2, 4, 6,
      8]" (reading 2, taken although the binding reading seems more natural):
      the example is illustrative only and the statement prevails. With
      "between" read as excluding the ends, the statement gives [4, 6] for
      (2, 8), as RV-OUT-2/RV-OUT-3/RV-OUT-4 already require, so the example
      adds no item of its own; a scenario covering [2, 4, 6, 8] would
      contradict RV-OUT-2.
  - req: R-EX-2
    covered_by: [RV-OUT-2, RV-OUT-3, RV-OUT-4]
    reason: >-
      Reading imposed by the request for "generate_integers(8, 2) => [2, 4, 6,
      8]" (reading 2, taken although the binding reading seems more natural):
      the example is illustrative only and the statement prevails. The reading
      names the conflict with "between" read as from a up to b; this set reads
      "between" as strictly between min(a, b) and max(a, b), under which the
      statement gives [4, 6] for (8, 2), which still differs from the example.
      The statement's answer is required by RV-OUT-2/RV-OUT-3/RV-OUT-4.
  - req: R-EX-3
    covered_by: [RV-OUT-2, RV-OUT-3, RV-IF-2-SOUND, RV-IF-2-COMPLETE]
    reason: >-
      Reading imposed by the request for "generate_integers(10, 14) => []"
      (reading 2, taken although the binding reading seems more natural): the
      example is illustrative only and the statement prevails. Under the
      reading of "even digits" taken here (2, 4, 6, 8) the docstring gives []
      for (10, 14), as RV-OUT-2 requires, while the imposed name reading of
      R-IF-2 (even integers of any size) asks for [12]; together they leave no
      list answer for this call (see RV-IF-2-COMPLETE).
  - req: R-FR-1
    covered_by: [F-EMPTY]
    reason: >-
      Frame rule F-EMPTY of design.yaml (outcome != 0 -> len(result) == 0),
      added to every formalization set by construction; not restated.

decisions:
  - {req: R-IF-2, phrase: generate_integers, reading: 2}
  - {req: R-ENV-1, phrase: positive integers, reading: 2}
  - {req: R-OUT-1, phrase: return the even digits, reading: 2}
  - {req: R-OUT-2, phrase: even digits, reading: 2}
  - {req: R-OUT-2, phrase: between a and b, reading: 2}
  - {req: R-OUT-3, phrase: even digits, reading: 2}
  - {req: R-OUT-3, phrase: between a and b, reading: 2}
  - {req: R-OUT-4, phrase: ascending order, reading: 2}
  - {req: R-EX-1, phrase: 'generate_integers(2, 8) => [2, 4, 6, 8]', reading: 2}
  - {req: R-EX-2, phrase: 'generate_integers(8, 2) => [2, 4, 6, 8]', reading: 2}
  - {req: R-EX-3, phrase: 'generate_integers(10, 14) => []', reading: 2}
