fcp: "0.1"
set: agent_a
origin: {kind: agent, role: formalizer, id: agent_a}

defs:
  pos: "a >= 1 && b >= 1"     # both arguments are positive integers
  lo: "min(a, b)"             # lower end of "between a and b" (either argument order)
  hi: "max(a, b)"             # upper end of "between a and b"

assumptions:
  - id: RA-ENV-1
    req: R-ENV-1
    expr: "a >= 1 && b >= 1"
    note: >-
      "Positive integers" read literally as a >= 1 and b >= 1 (reading 1). A call
      with a == 0 or b == 0 is outside the contract. Positive integers above 255
      cannot be expressed: the frame limits a and b to 0..255.

properties:
  - id: RA-OUT-1
    req: R-OUT-1
    pattern: implies
    args:
      trigger: "pos"
      cond: "outcome == 0"
    note: >-
      "Return the even digits" read as returning a Python list of ints (reading 1):
      the call returns normally with a list that fits the result signal (outcome 0),
      so it does not raise, hang, or return another type. Any list the other
      requirements allow has at most 5 elements, each from 0 to 8, so it always fits.

  - id: RA-OUT-2a
    req: R-OUT-2
    pattern: implies
    args:
      trigger: "pos"
      cond: "all(i < len(result): result[i] <= 9 && result[i] % 2 == 0)"
    note: >-
      Every returned element is an even digit, read literally as an even
      single-digit number 0, 2, 4, 6 or 8 (reading 1). Since a, b >= 1, 0 is never
      between a and b, so readings 1 and 2 (whether 0 counts) give the same result
      under the contract.

  - id: RA-OUT-2b
    req: R-OUT-2
    pattern: implies
    args:
      trigger: "pos"
      cond: "all(i < len(result): lo <= result[i] && result[i] <= hi)"
    note: >-
      Every returned element lies between a and b, read as min(a, b) to max(a, b)
      with both ends included (reading 1). The prose alone does not say whether the
      ends are included or whether a may be larger than b. Only the examples
      (2, 8) => [2, 4, 6, 8] and (8, 2) => [2, 4, 6, 8] settle this.

  - id: RA-OUT-3
    req: R-OUT-3
    pattern: implies
    args:
      trigger: "pos"
      cond: "all(d < 10: d % 2 == 0 && lo <= d && d <= hi -> (d in result))"
    note: >-
      Every even digit d (0, 2, 4, 6, 8; reading 1) with min(a, b) <= d <= max(a, b)
      (reading 1) appears in the returned list. This requirement does not limit
      how often it appears; RA-OUT-4 does.

  - id: RA-OUT-4
    req: R-OUT-4
    pattern: implies
    args:
      trigger: "pos"
      cond: "all(i < len(result) - 1: result[i] < result[i + 1])"
    note: >-
      "Ascending order" read as strictly increasing (reading 1), as the requirement
      text says: each element is smaller than the next, so no digit is repeated.

  - id: RA-EX-1
    req: R-EX-1
    pattern: implies
    args:
      trigger: "a == 2 && b == 8"
      cond: "outcome == 0 && result == [2, 4, 6, 8]"
    note: >-
      The example is taken as binding (reading 1). The function has no state, so
      "calling generate_integers(2, 8) returns [2, 4, 6, 8]" holds for every such
      call. Scenario RA-EX-1-S also requires that the call is possible. This means
      both ends of "between" are included.

  - id: RA-EX-2
    req: R-EX-2
    pattern: implies
    args:
      trigger: "a == 8 && b == 2"
      cond: "outcome == 0 && result == [2, 4, 6, 8]"
    note: >-
      The example is taken as binding (reading 1) and holds for every call (8, 2).
      This means "between a and b" does not depend on which argument is larger.

  - id: RA-EX-3
    req: R-EX-3
    pattern: implies
    args:
      trigger: "a == 10 && b == 14"
      cond: "outcome == 0 && len(result) == 0"
    note: >-
      The example is taken as binding (reading 1): every call (10, 14) returns the
      empty list. This means "even digits" are single-digit numbers, not even
      integers of any size and not digits written inside the numbers. It
      contradicts the reading of the function name generate_integers as "generate
      the even integers".

scenarios:
  - id: RA-EX-1-S
    req: R-EX-1
    cover: "a == 2 && b == 8 && outcome == 0 && result == [2, 4, 6, 8]"
    note: The call (2, 8) returning [2, 4, 6, 8] must be possible under every requirement.

  - id: RA-EX-2-S
    req: R-EX-2
    cover: "a == 8 && b == 2 && outcome == 0 && result == [2, 4, 6, 8]"
    note: The call (8, 2) returning [2, 4, 6, 8] must be possible under every requirement.

  - id: RA-EX-3-S
    req: R-EX-3
    cover: "a == 10 && b == 14 && outcome == 0 && len(result) == 0"
    note: The call (10, 14) returning [] must be possible under every requirement.

unformalized:
  - req: R-IF-1
    reason: >-
      Non-functional. It says the deliverable is a Python implementation that
      completes the stub, which does not constrain the call trace.
  - req: R-IF-2
    reason: >-
      Definition of the interface. The function name and the order of arguments
      (a, b) are fixed by the function section of design.yaml, which maps them to
      the input signals a and b. The name is only a name (reading 1); behaviour
      comes from the docstring.
  - req: R-FR-1
    reason: >-
      Frame rule. The frame item F-EMPTY of design.yaml ('outcome != 0 ->
      len(result) == 0') is added to every formalization set and need not be
      restated (frame.md).
    covered_by: [F-EMPTY]

decisions:
  - {req: R-IF-2, phrase: "generate_integers", reading: 1}
  - {req: R-ENV-1, phrase: "positive integers", reading: 1}
  - {req: R-OUT-1, phrase: "return the even digits", reading: 1}
  - {req: R-OUT-2, phrase: "even digits", reading: 1}
  - {req: R-OUT-2, phrase: "between a and b", reading: 1}
  - {req: R-OUT-3, phrase: "even digits", reading: 1}
  - {req: R-OUT-3, phrase: "between a and b", reading: 1}
  - {req: R-OUT-4, phrase: "ascending order", reading: 1}
  - {req: R-EX-1, phrase: "generate_integers(2, 8) => [2, 4, 6, 8]", reading: 1}
  - {req: R-EX-2, phrase: "generate_integers(8, 2) => [2, 4, 6, 8]", reading: 1}
  - {req: R-EX-3, phrase: "generate_integers(10, 14) => []", reading: 1}
