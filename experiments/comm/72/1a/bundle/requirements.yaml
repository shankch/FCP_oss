requirements:
- id: R-IF-1
  doc: SPEC
  quote: 'def will_it_fly(q,w):'
  text: 'The deliverable is a Python function named will_it_fly that takes two arguments: q (the object, a list) and w (the maximum possible weight).'
  kind: non_functional
  lines:
  - 4
- id: R-RET-1
  doc: SPEC
  quote: returns True if the object q will fly
  text: Whenever q will fly (q is balanced, i.e. a palindromic list, and the sum of its elements meets the weight condition with respect to w), will_it_fly(q, w) returns the bool True.
  kind: guarantee
  depends:
  - R-FLY-1
  lines:
  - 6
- id: R-RET-2
  doc: SPEC
  quote: and False otherwise
  text: Whenever q will not fly (q is not balanced, or the sum of its elements does not meet the weight condition with respect to w), will_it_fly(q, w) returns the bool False.
  kind: guarantee
  depends:
  - R-FLY-1
  lines:
  - 6
- id: R-FLY-1
  doc: SPEC
  quote: The object q will fly if it's balanced (it is a palindromic list) and the sum of its elements is more than or less than or equal the maximum possible weight w.
  text: 'The object q will fly when both of two conditions hold: q is balanced (a palindromic list), and the sum of the elements of q meets the weight condition with respect to the maximum possible weight
    w.'
  kind: definition
  depends:
  - R-FLY-2
  - R-FLY-3
  ambiguity:
  - phrase: will fly if
    readings:
    - q will fly exactly when (if and only if) it is balanced and meets the weight condition; if either condition fails, q does not fly
    - being balanced and meeting the weight condition is only sufficient for flying; the text does not say whether a q that fails a condition flies
  lines:
  - 7
- id: R-FLY-2
  doc: SPEC
  quote: balanced (it is a palindromic list)
  text: 'q is balanced exactly when it is a palindromic list: it has the same elements when read in reverse order, that is q[i] equals q[len(q) - 1 - i] for every position i of q.'
  kind: definition
  ambiguity:
  - phrase: palindromic list
    readings:
    - the empty list [] is palindromic (it equals its own reverse), so [] is balanced
    - the empty list [] is not a palindromic list (there is no object to balance), so [] is not balanced
  lines:
  - 7
- id: R-FLY-3
  doc: SPEC
  quote: the sum of its elements is more than or less than or equal the maximum possible weight w
  text: The weight condition for flying compares the sum of the elements of q (0 for an empty list) with w, the maximum possible weight of the object; as written, it holds when that sum is more than, or
    less than or equal to, w.
  kind: definition
  ambiguity:
  - phrase: more than or less than or equal
    readings:
    - the sum is at most w (sum(q) <= w); 'more than or' is a slip, as 'maximum possible weight' suggests
    - the sum is at least w (sum(q) >= w)
    - taken literally, 'more than, less than or equal' covers every sum, so the weight condition always holds and only balance matters
  - phrase: the sum of its elements is more than
    readings:
    - "contradiction with the example will_it_fly([3, 2, 3], 1) \u279E False: the example governs, so a balanced q whose sum is more than w does not fly (weight condition sum(q) <= w)"
    - "contradiction with the example will_it_fly([3, 2, 3], 1) \u279E False: the rule governs, so a balanced q whose sum is more than w still flies and the example's expected False is wrong"
  lines:
  - 7
