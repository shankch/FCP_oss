requirements:
- id: R-IF-1
  doc: SPEC
  quote: 'def will_it_fly(q,w):'
  text: The implementation is a Python function named will_it_fly that takes two positional parameters, q (the list) and w (the maximum possible weight).
  kind: non_functional
  lines:
  - 4
- id: R-OUT-1
  doc: SPEC
  quote: Write a function that returns True if the object q will fly, and False otherwise.
  text: 'Every call will_it_fly(q, w) returns either True or False: it does not raise an exception, fail to finish, or return a value of any other kind.'
  kind: guarantee
  ambiguity:
  - phrase: returns True if the object q will fly, and False otherwise
    readings:
    - the returned value must be the Python bool True or False
    - any truthy or falsy value (such as 1 or 0, or a non-empty or empty list) is acceptable as the answer
  lines:
  - 6
- id: R-FLY-1
  doc: SPEC
  quote: returns True if the object q will fly
  text: If q is a palindrome (q[i] equals q[len(q)-1-i] for every index i) and the sum of the elements of q is less than or equal to w, then will_it_fly(q, w) returns True.
  kind: guarantee
  depends:
  - R-DEF-1
  - R-DEF-2
  - R-DEF-3
  ambiguity:
  - phrase: less than or equal the maximum possible weight w
    readings:
    - 'sum(q) <= w, as the rule states: a balanced q whose sum equals w flies (True)'
    - 'sum(q) < w, as the example comments phrase it ("is less than the maximum possible weight"): a balanced q whose sum equals w does not fly'
  - phrase: palindromic list
    readings:
    - the empty list is palindromic (it equals its reverse), so will_it_fly([], w) returns True for every w >= 0
    - the empty list is not a balanced object, so will_it_fly([], w) returns False
  lines:
  - 6
- id: R-FLY-2
  doc: SPEC
  quote: and False otherwise
  text: If q is not a palindrome (some index i has q[i] different from q[len(q)-1-i]), then will_it_fly(q, w) returns False, whatever w is.
  kind: guarantee
  depends:
  - R-DEF-1
  - R-DEF-2
  ambiguity:
  - phrase: The object q will fly if
    readings:
    - '''if'' means ''if and only if'': q flies exactly when it is balanced and light enough, so an unbalanced q must return False'
    - '''if'' gives only a sufficient condition: the prompt does not say when q does not fly, so the answer for an unbalanced q is not determined by ''False otherwise'''
  - phrase: palindromic list
    readings:
    - the empty list is palindromic, so it is never covered by this requirement
    - the empty list is not a balanced object, so will_it_fly([], w) returns False
  lines:
  - 6
- id: R-FLY-3
  doc: SPEC
  quote: and False otherwise
  text: If the sum of the elements of q is greater than w, then will_it_fly(q, w) returns False, whether or not q is a palindrome.
  kind: guarantee
  depends:
  - R-DEF-1
  - R-DEF-3
  ambiguity:
  - phrase: The object q will fly if
    readings:
    - '''if'' means ''if and only if'': q flies exactly when it is balanced and light enough, so a q heavier than w must return False'
    - '''if'' gives only a sufficient condition: the prompt does not say when q does not fly, so the answer for a q heavier than w is not determined by ''False otherwise'''
  - phrase: less than or equal the maximum possible weight w
    readings:
    - 'sum(q) <= w flies: False is required only when sum(q) > w'
    - 'sum(q) < w flies, as the example comments phrase it: False is also required when sum(q) == w'
  lines:
  - 6
- id: R-DEF-1
  doc: SPEC
  quote: The object q will fly if it's balanced (it is a palindromic list) and the sum of its elements is less than or equal the maximum possible weight w.
  text: 'The object q "will fly" for weight w when both hold: q is balanced, and the sum of the elements of q is less than or equal to w.'
  kind: definition
  ambiguity:
  - phrase: The object q will fly if
    readings:
    - '''if'' means ''if and only if'': q flies exactly when it is balanced and the sum of its elements is at most w'
    - '''if'' gives only a sufficient condition: q flies at least in that case, and the prompt does not say whether it can fly otherwise'
  lines:
  - 7
- id: R-DEF-2
  doc: SPEC
  quote: it's balanced (it is a palindromic list)
  text: 'q is balanced exactly when q is a palindromic list: it reads the same forwards and backwards, i.e. q[i] equals q[len(q)-1-i] for every index i.'
  kind: definition
  ambiguity:
  - phrase: palindromic list
    readings:
    - the empty list is palindromic (it equals its reverse), hence balanced
    - the empty list is not a balanced object, hence never flies
  lines:
  - 7
- id: R-DEF-3
  doc: SPEC
  quote: the sum of its elements is less than or equal the maximum possible weight w
  text: The weight condition holds when the sum of the elements of q (0 for the empty list) is less than or equal to w.
  kind: definition
  ambiguity:
  - phrase: less than or equal the maximum possible weight w
    readings:
    - 'sum(q) <= w, as the rule states: a sum equal to w meets the condition'
    - 'sum(q) < w, as the example comments phrase it ("is less than the maximum possible weight"): a sum equal to w does not meet the condition'
  lines:
  - 7
