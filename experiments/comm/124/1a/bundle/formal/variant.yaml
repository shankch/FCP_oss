fcp: "0.1"
set: variant
origin: {kind: agent, role: formalizer, id: variant}

# Readings prescribed for this set (each is reading 2 of its phrase, see `decisions`):
#   RET-2   malformed strings: behaviour not specified; only well-formed strings with an
#           out-of-range day or month must return False.
#   VAL-1   the rules are necessary only; the string must also denote a real calendar date.
#   DAY-1/2/3, MON-1   "not less than 1 or higher than N" = (not less than 1) or (higher than N),
#           i.e. only the lower bound 1.
#   DAY-3   29 February only in a leap year.
#   FMT-2   day and month have one or two digits, the year is digits; surrounding
#           whitespace is stripped; the year is at least 1.
#   FMT-3   only mm-dd-yyyy: the first field is the month.
#   EX-2    the example is wrong: valid_date('15-01-2012') returns True.

defs:
  # Stripping (FMT-2 reading): Python str.strip() removes the characters for which
  # str.isspace() holds; over codes 0..255 these are 9-13, 28-32, 133 and 160.
  s_beg: 'count(i < len(date): all(j < i + 1: (date[j] >= 9 && date[j] <= 13) || (date[j] >= 28 && date[j] <= 32) || date[j] == 133 || date[j] == 160))'
  s_end: 'len(date) - count(i < len(date): all(j < i + 1: (date[len(date) - 1 - j] >= 9 && date[len(date) - 1 - j] <= 13) || (date[len(date) - 1 - j] >= 28 && date[len(date) - 1 - j] <= 32) || date[len(date) - 1 - j] == 133 || date[len(date) - 1 - j] == 160))'
  # Hyphens: how many, and the index of the first and of the second one.
  dashes: 'count(i < len(date): date[i] == "-")'
  dash1: 'count(i < len(date): count(j < i + 1: date[j] == "-") == 0)'
  dash2: 'count(i < len(date): count(j < i + 1: date[j] == "-") <= 1)'
  len1: 'dash1 - s_beg'
  len2: 'dash2 - dash1 - 1'
  len3: 's_end - dash2 - 1'
  # The stripped string is D-D-Y: one or two digits, '-', one or two digits, '-', one or more digits.
  shape: 's_beg < s_end && dashes == 2 && all(i < len(date): (i >= s_beg && i < s_end && date[i] != "-") -> isdigit(date[i])) && len1 >= 1 && len1 <= 2 && len2 >= 1 && len2 <= 2 && len3 >= 1'
  fld1: 'len1 == 1 ? date[s_beg] - "0" : 10 * (date[s_beg] - "0") + (date[s_beg + 1] - "0")'
  fld2: 'len2 == 1 ? date[dash1 + 1] - "0" : 10 * (date[dash1 + 1] - "0") + (date[dash1 + 2] - "0")'
  # FMT-3 reading: mm-dd-yyyy only, so the first field is the month and the second the day.
  mon: 'fld1'
  day: 'fld2'
  # The year field is not all zeros (year >= 1).
  year_pos: 'any(i < len(date): i > dash2 && i < s_end && date[i] != "0")'
  # The year modulo 10000 (its last four digits); 10000 is a multiple of 400, so it decides leap years.
  ylow: '(date[s_end - 1] - "0") + 10 * (len3 >= 2 ? date[s_end - 2] - "0" : 0) + 100 * (len3 >= 3 ? date[s_end - 3] - "0" : 0) + 1000 * (len3 >= 4 ? date[s_end - 4] - "0" : 0)'
  leap: '(ylow % 4 == 0 && ylow % 100 != 0) || ylow % 400 == 0'
  m31: 'mon == 1 || mon == 3 || mon == 5 || mon == 7 || mon == 8 || mon == 10 || mon == 12'
  m30: 'mon == 4 || mon == 6 || mon == 9 || mon == 11'
  dim: 'mon == 2 ? (leap ? 29 : 28) : (m30 ? 30 : 31)'
  # Well-formed: rule 4 under the FMT-2 readings (stripped, 1-2 digit fields, digit year >= 1).
  wf: 'shape && year_pos'
  # The four rules, literally, under the prescribed readings.
  rule1: 'len(date) != 0'
  rule2: '(m31 -> (day >= 1 || day > 31)) && (m30 -> (day >= 1 || day > 30)) && (mon == 2 -> (day >= 1 || day > 29)) && ((mon == 2 && day == 29) -> leap)'
  rule3: 'mon >= 1 || mon > 12'
  rule4: 'wf'
  # VAL-1 reading: additionally a real calendar date (month 1..12, day 1..days of that month, year >= 1).
  dm_ok: 'mon >= 1 && mon <= 12 && day >= 1 && day <= dim'
  real_date: 'wf && dm_ok'
  ok: 'rule1 && rule2 && rule3 && rule4 && real_date'

properties:
  - id: RV-RET-1
    req: R-RET-1
    pattern: implies
    args: {trigger: 'ok', cond: 'outcome == 0 && valid'}
    note: >-
      A valid date string makes the call return True. `ok` is validity as defined for this set:
      the four rules plus a real calendar date (R-VAL-1 read as "the listed rules are necessary
      conditions only; the string must additionally denote a real calendar date"). The day and
      month rules are read as (not less than 1) or (higher than N), so they give only the lower
      bound (R-DAY-1, R-DAY-2, R-DAY-3, R-MON-1 readings); the upper bounds come from the calendar
      check. 29 February counts only in a leap year (R-DAY-3 reading). The format follows the
      R-FMT-2 readings: surrounding whitespace is stripped (Python str.strip), day and month have
      one or two digits, the year is one or more digits and at least 1. The R-FMT-3 reading
      applies: only mm-dd-yyyy is accepted (the first field is the month). The prescribed
      readings give no upper limit for "a plausible year", so the only limit is the 16-character
      input.

  - id: RV-RET-2
    req: R-RET-2
    pattern: implies
    args: {trigger: 'wf && !dm_ok', cond: 'outcome == 0 && !valid'}
    note: >-
      R-RET-2 reading for "otherwise False": only well-formed strings whose day or month is out of
      range must return False. For malformed strings the outcome is left open (see RV-RET-2-DC);
      they are only kept from returning True (RV-EMP-1, RV-FMT-1, RV-FMT-2, RV-FMT-2-YEAR,
      RV-VAL-1). "Well-formed" (`wf`) uses the R-FMT-2 readings: stripped, one- or two-digit day
      and month, a digit year of at least 1. Under the R-DAY-x and R-MON-1 readings the rules give
      only lower bounds, so "out of range" here is the real-calendar range from the R-VAL-1
      reading: month 1..12 and day 1..days of that month, where 29 February needs a leap year
      (R-DAY-3 reading). The R-FMT-3 reading makes the first field the month.

  - id: RV-VAL-1
    req: R-VAL-1
    pattern: implies
    args: {trigger: '!ok', cond: '!valid'}
    note: >-
      R-VAL-1 reading: the listed rules are necessary conditions only, and the string must also
      denote a real calendar date (month 1..12, day within that month's length with leap years,
      year at least 1, read as mm-dd-yyyy per the R-FMT-3 reading). A string that fails any rule
      or the calendar check is never accepted. RV-RET-1 gives the other direction: rules plus a
      real date are sufficient, since the reading names no further condition. Only "not True" is
      required here because under the R-RET-2 reading a malformed string may also raise; RV-RET-2
      requires an actual False for well-formed strings. "A plausible year" is read as year >= 1
      (the R-FMT-2 "yyyy" reading); the readings give no upper bound. The rules use the readings
      for R-DAY-1/2/3 and R-MON-1 (lower bound only), R-DAY-3 (leap years) and R-FMT-2
      (stripping, 1-2 digit fields, digit year).

  - id: RV-EMP-1
    req: R-EMP-1
    pattern: implies
    args: {trigger: 'len(date) == 0', cond: '!valid'}
    note: >-
      Rule 1: the empty string is not valid, so it is never accepted. The requirement text says
      valid_date('') returns False. But the empty string is malformed, and under the R-RET-2
      reading ("for malformed strings the behaviour (e.g. raising ValueError) is not specified")
      only acceptance is excluded: returning False and raising are both allowed (outcome is a
      don't-care, RV-RET-2-DC). A string of whitespace only is not empty under rule 1. Stripping
      it leaves nothing, so it fails the format (RV-FMT-2, R-FMT-2 stripping reading).

  - id: RV-DAY-1
    req: R-DAY-1
    pattern: implies
    args: {trigger: 'wf && m31 && !(day >= 1 || day > 31)', cond: 'outcome == 0 && !valid'}
    note: >-
      R-DAY-1 reading: "is not less than 1 or higher than 31 days" is taken literally as
      (not less than 1) or (higher than 31), so the rule only rejects day < 1 (no upper bound).
      Days above 31 are still rejected, but by the real-calendar check of the R-VAL-1 reading
      (RV-VAL-1, RV-RET-2), not by this rule. The string is well-formed (R-FMT-2 readings), so
      under the R-RET-2 reading the call must actually return False. The month is the first field
      (R-FMT-3 reading: mm-dd-yyyy only).

  - id: RV-DAY-2
    req: R-DAY-2
    pattern: implies
    args: {trigger: 'wf && m30 && !(day >= 1 || day > 30)', cond: 'outcome == 0 && !valid'}
    note: >-
      R-DAY-2 reading: "is not less than 1 or higher than 30 days" is taken literally as
      (not less than 1) or (higher than 30), so the rule only rejects day < 1 (no upper bound).
      Day 31 of April, June, September and November is still rejected, but by the real-calendar
      check of the R-VAL-1 reading (RV-VAL-1, RV-RET-2). The string is well-formed (R-FMT-2
      readings), so under the R-RET-2 reading the call must return False. The month is the first
      field (R-FMT-3 reading).

  - id: RV-DAY-3
    req: R-DAY-3
    pattern: implies
    args: {trigger: 'wf && mon == 2 && !(day >= 1 || day > 29)', cond: 'outcome == 0 && !valid'}
    note: >-
      R-DAY-3 reading for "is not less than 1 or higher than 29": taken literally as
      (not less than 1) or (higher than 29), so the rule only rejects day < 1 in February (no
      upper bound). February 30 and 31 are still rejected, but by the real-calendar check of the
      R-VAL-1 reading (RV-VAL-1, RV-RET-2). The string is well-formed (R-FMT-2 readings), so under
      the R-RET-2 reading the call must return False. The month is the first field (R-FMT-3
      reading).

  - id: RV-DAY-3-LEAP
    req: R-DAY-3
    pattern: implies
    args: {trigger: 'wf && mon == 2 && day == 29 && !leap', cond: 'outcome == 0 && !valid'}
    note: >-
      R-DAY-3 reading for "higher than 29 for the month 2": day 29 of February is accepted only
      in a leap year (Gregorian: divisible by 4 and not by 100, or divisible by 400). The year
      field may have any number of digits (R-FMT-2 reading), and only its last four digits are
      used: 10000 is a multiple of 400, so they decide the leap year. The string is well-formed,
      so under the R-RET-2 reading the call returns False. The month is the first field (R-FMT-3
      reading).

  - id: RV-MON-1
    req: R-MON-1
    pattern: implies
    args: {trigger: 'wf && !(mon >= 1 || mon > 12)', cond: 'outcome == 0 && !valid'}
    note: >-
      R-MON-1 reading: "should not be less than 1 or higher than 12" is taken literally as
      (should not be less than 1) or (higher than 12), so the rule only rejects month < 1 (no
      upper bound). Months above 12 are still rejected, but by the real-calendar check of the
      R-VAL-1 reading and by RV-FMT-3. The month is the first field (R-FMT-3 reading). The string
      is well-formed (R-FMT-2 readings), so under the R-RET-2 reading the call returns False.

  - id: RV-FMT-1
    req: R-FMT-1
    pattern: implies
    args: {trigger: 'dashes != 2', cond: '!valid'}
    note: >-
      Three fields separated by '-' means exactly two hyphens. A string with another separator
      (such as '/') or another number of fields is never accepted. Under the R-RET-2 reading such
      a string is malformed, so only acceptance is excluded: returning False and raising are both
      allowed (RV-RET-2-DC). Whitespace stripping (R-FMT-2 reading) does not change the number of
      hyphens.

  - id: RV-FMT-2
    req: R-FMT-2
    pattern: implies
    args: {trigger: '!shape', cond: '!valid'}
    note: >-
      R-FMT-2 readings. For "The date should be in the format", surrounding whitespace is ignored:
      the string is stripped as by Python str.strip() before the check. For "dd-mm-yyyy or
      mm-dd-yyyy", dd and mm are one or two digits ('4-1-2040' is acceptable) and yyyy is the year
      as digits, read literally as one or more digits with no fixed count. A string whose stripped
      form is not D-D-Y in this sense is never accepted. Under the R-RET-2 reading it is
      malformed, so only acceptance is excluded: returning False and raising are both allowed
      (RV-RET-2-DC).

  - id: RV-FMT-2-YEAR
    req: R-FMT-2
    pattern: implies
    args: {trigger: 'shape && !year_pos', cond: '!valid'}
    note: >-
      R-FMT-2 reading for "yyyy": the year must be a real year, at least 1, so an all-zero year
      such as '0000' is invalid and never accepted. Such a string is not well-formed, so under the
      R-RET-2 reading only acceptance is excluded (RV-RET-2-DC).

  - id: RV-FMT-3
    req: R-FMT-3
    pattern: implies
    args: {trigger: 'wf && mon > 12', cond: 'outcome == 0 && !valid'}
    note: >-
      R-FMT-3 reading: only mm-dd-yyyy is accepted (the first field is the month). The
      dd-mm-yyyy alternative in the prompt is taken as an error. A string whose first field is
      above 12, which could only be read as dd-mm-yyyy, is rejected. Every other item uses
      month = first field and day = second field (defs `mon`, `day`), so a string that is a real
      date only as dd-mm-yyyy is never accepted. The string is well-formed, so under the R-RET-2
      reading the call returns False. CONFLICT: this reading makes valid_date('15-01-2012') return
      False, but the prescribed R-EX-2 reading says the example is wrong and the call returns True
      (RV-EX-2). The two prescribed readings contradict each other, and both are kept as given.

  - id: RV-EX-1
    req: R-EX-1
    pattern: implies
    args: {trigger: 'date == "03-11-2000"', cond: 'outcome == 0 && valid'}
    note: >-
      The function keeps no state between calls (frame.md), so an example is a guarantee for its
      input. Under the readings of this set (mm-dd-yyyy per R-FMT-3, calendar check per R-VAL-1)
      this is 11 March 2000, which is valid.

  - id: RV-EX-2
    req: R-EX-2
    pattern: implies
    args: {trigger: 'date == "15-01-2012"', cond: 'outcome == 0 && valid'}
    note: >-
      R-EX-2 reading: the example is wrong. Rule 4 accepts dd-mm-yyyy, '15-01-2012' is 15 January
      2012 and satisfies every rule, so the call should return True; that is what is formalized,
      not the printed "=> False". CONFLICT: the prescribed R-FMT-3 reading (only mm-dd-yyyy) makes
      the first field the month, so the string has month 15. RV-FMT-3, RV-RET-2 and RV-VAL-1 (with
      the R-VAL-1 calendar reading) then require False. The prescribed readings contradict each
      other, so no behaviour on this input meets the set. This is kept on purpose, not repaired.

  - id: RV-EX-3
    req: R-EX-3
    pattern: implies
    args: {trigger: 'date == "04-0-2040"', cond: 'outcome == 0 && !valid'}
    note: >-
      Literal example. Under the R-FMT-2 reading (one- or two-digit fields) '04-0-2040' is
      well-formed, with month 4 and day 0 (R-FMT-3 reading). Day 0 breaks the day rule under the
      R-DAY-2 reading, and under the R-RET-2 reading a well-formed string with an out-of-range day
      must return False. So the example agrees with the other items.

  - id: RV-EX-4
    req: R-EX-4
    pattern: implies
    args: {trigger: 'date == "06-04-2020"', cond: 'outcome == 0 && valid'}
    note: >-
      Literal example. Under the R-FMT-3 reading this is 4 June 2020 (mm-dd-yyyy), a valid date,
      in agreement with RV-RET-1.

  - id: RV-EX-5
    req: R-EX-5
    pattern: implies
    args: {trigger: 'date == "06/04/2020"', cond: 'outcome == 0 && !valid'}
    note: >-
      Literal example: the call returns False, not just "not True". The string has no hyphens, so
      it is malformed. The R-RET-2 reading leaves malformed strings unspecified ("Only well-formed
      strings ... must yield False"), but this example pins this one input explicitly. It is
      therefore excluded from the outcome don't-care RV-RET-2-DC. The reading's word "Only" is in
      tension with this example.

scenarios:
  - id: RV-FMT-2-S1
    req: R-FMT-2
    cover: 'date == "4-1-2040" && outcome == 0 && valid'
    note: >-
      R-FMT-2 reading for "dd-mm-yyyy or mm-dd-yyyy": one-digit fields are acceptable, and the
      reading names '4-1-2040'. Under the R-FMT-3 reading this is 1 April 2040.

  - id: RV-FMT-2-S2
    req: R-FMT-2
    cover: 'date == " 06-04-2020 " && outcome == 0 && valid'
    note: >-
      R-FMT-2 reading for "The date should be in the format": surrounding whitespace is ignored
      (the string is stripped), so a valid date padded with spaces is accepted.

  - id: RV-DAY-3-S1
    req: R-DAY-3
    cover: 'date == "02-29-2024" && outcome == 0 && valid'
    note: >-
      R-DAY-3 readings: 29 February is accepted in a leap year (2024). There is no upper bound from
      the rule itself, and the calendar check of the R-VAL-1 reading allows 29 here. The month is
      the first field (R-FMT-3 reading).

dont_cares:
  - id: RV-RET-2-DC
    req: R-RET-2
    signal: outcome
    when: '!wf && date != "06/04/2020"'
    note: >-
      R-RET-2 reading for "otherwise False": for malformed strings the behaviour (e.g. raising
      ValueError) is not specified. How such a call ends is free. Only returning True is excluded,
      by RV-EMP-1, RV-FMT-1, RV-FMT-2, RV-FMT-2-YEAR and RV-VAL-1. "Malformed" is the negation of
      `wf` under the R-FMT-2 readings (stripping, 1-2 digit fields, digit year >= 1). The example
      '06/04/2020' is excluded because R-EX-5 pins its result to False (RV-EX-5).

unformalized:
  - req: R-API-1
    reason: >-
      Non-functional. The name and the single parameter of the function are fixed by the adapter
      (design.yaml `function`), which calls valid_date(date) in every cycle. Neither is observable
      as a signal of the trace.
  - req: R-IN-1
    reason: >-
      Holds by construction of the interface. frame.md says calls whose argument is not a string
      (or is longer than 16 characters) are not part of the trace, so `date` is always a string
      and there is nothing left to assume.
  - req: R-FR-1
    reason: >-
      Frame rule of the adapter (frame.md, "need not be restated"). It is the frame item F-ZERO
      of design.yaml, which is added to every formalization set.
    covered_by: [F-ZERO]

decisions:
  - {req: R-RET-2, phrase: "otherwise False", reading: 2}
  - {req: R-VAL-1, phrase: "The date is valid if all of the following rules are satisfied", reading: 2}
  - {req: R-DAY-1, phrase: "is not less than 1 or higher than 31 days", reading: 2}
  - {req: R-DAY-2, phrase: "is not less than 1 or higher than 30 days", reading: 2}
  - {req: R-DAY-3, phrase: "is not less than 1 or higher than 29", reading: 2}
  - {req: R-DAY-3, phrase: "higher than 29 for the month 2", reading: 2}
  - {req: R-MON-1, phrase: "should not be less than 1 or higher than 12", reading: 2}
  - {req: R-FMT-2, phrase: "dd-mm-yyyy or mm-dd-yyyy", reading: 2}
  - {req: R-FMT-2, phrase: "The date should be in the format", reading: 2}
  - {req: R-FMT-2, phrase: "yyyy", reading: 2}
  - {req: R-FMT-3, phrase: "dd-mm-yyyy or mm-dd-yyyy", reading: 2}
  - {req: R-EX-2, phrase: "valid_date('15-01-2012') => False", reading: 2}
