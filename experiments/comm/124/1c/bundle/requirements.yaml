- id: R-EX-5
  doc: SPEC
  quote: valid_date('06/04/2020') => True
  text: valid_date('06/04/2020') returns True.
  kind: scenario
  ambiguity:
  - phrase: valid_date('06/04/2020') => True
    readings:
    - 'Example authoritative: the call returns True, contradicting R-FMT-1 (separators must be ''-'') and R-RET-2.'
    - 'Rules authoritative: ''06/04/2020'' is not in the format mm-dd-yyyy, so the call returns False; the example''s expected value is wrong.'
  lines:
