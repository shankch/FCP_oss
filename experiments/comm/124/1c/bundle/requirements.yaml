requirements:
- id: R-IF-1
  doc: SPEC
  quote: 'def valid_date(date):'
  text: The implementation is a Python function named valid_date that takes exactly one argument, date.
  kind: non_functional
  lines:
  - 4
- id: R-IN-1
  doc: SPEC
  quote: You have to write a function which validates a given date string
  text: The argument date passed to valid_date is a string.
  kind: assumption
  lines:
  - 5
- id: R-RET-1
  doc: SPEC
  quote: returns True if the date is valid
  text: If the date string is valid (as defined by R-VAL-1), valid_date(date) returns True.
  kind: guarantee
  depends:
  - R-VAL-1
  ambiguity:
  - phrase: returns True if the date is valid
    readings:
    - 'Contradiction with R-EX-1 and R-EX-4, rules authoritative: ''03-11-2000'' and ''06-04-2020'' meet every listed rule, so valid_date returns True for them and the examples'' expected False is wrong.'
    - 'Contradiction with R-EX-1 and R-EX-4, examples authoritative: valid_date returns False for ''03-11-2000'' and ''06-04-2020'', so a date meeting every rule does not always yield True (validity or
      the return polarity means something other than stated).'
  lines:
  - 6
- id: R-RET-2
  doc: SPEC
  quote: otherwise False
  text: If the date string is not valid (as defined by R-VAL-1), valid_date(date) returns False.
  kind: guarantee
  depends:
  - R-VAL-1
  ambiguity:
  - phrase: otherwise False
    readings:
    - 'Contradiction with R-EX-2, R-EX-3 and R-EX-5, rules authoritative: ''15-01-2012'' (month 15), ''04-0-2040'' (day 0, one-digit day) and ''06/04/2020'' (''/'' separators) each break a rule, so valid_date
      returns False for them and the examples'' expected True is wrong.'
    - 'Contradiction with R-EX-2, R-EX-3 and R-EX-5, examples authoritative: valid_date returns True for ''15-01-2012'', ''04-0-2040'' and ''06/04/2020'' even though each breaks a listed rule.'
  lines:
  - 6
- id: R-RET-3
  doc: SPEC
  quote: returns True if the date is valid otherwise False
  text: For every string argument, valid_date(date) finishes and returns a bool (True or False); it does not raise an exception or return a value of another type.
  kind: guarantee
  ambiguity:
  - phrase: otherwise False
    readings:
    - Every string that is not a valid date, including malformed ones such as '--', '1-2' or 'ab-cd-efgh', yields False and never an exception.
    - Only strings that look like dates are covered; for malformed strings (e.g. non-numeric fields) the function may raise an exception instead of returning False.
  lines:
  - 6
- id: R-VAL-1
  doc: SPEC
  quote: 'The date is valid if all of the following rules are satisfied:'
  text: 'A date string is valid exactly when it satisfies all four listed rules: it is not empty (R-EMP-1), its day is in range for its month (R-DAY-1, R-DAY-2, R-DAY-3), its month is in 1..12 (R-MON-1),
    and it has the format mm-dd-yyyy (R-FMT-1, R-FMT-2, R-FMT-3).'
  kind: definition
  ambiguity:
  - phrase: The date is valid if
    readings:
    - 'If and only if: a date string is valid exactly when every listed rule holds; breaking any rule makes it invalid.'
    - 'Only a sufficient condition: meeting every rule makes the date valid, but a string that breaks a rule is not thereby stated to be invalid.'
  - phrase: all of the following rules are satisfied
    readings:
    - 'Contradiction with R-EX-1 and R-EX-4, rules authoritative: ''03-11-2000'' and ''06-04-2020'' satisfy every rule and are therefore valid.'
    - 'Contradiction with R-EX-1 and R-EX-4, examples authoritative: ''03-11-2000'' and ''06-04-2020'' are invalid although they satisfy every listed rule, so satisfying the rules is not enough for validity.'
  lines:
  - 7
- id: R-EMP-1
  doc: SPEC
  quote: The date string is not empty.
  text: If the date string is empty (length 0), valid_date(date) returns False.
  kind: guarantee
  lines:
  - 8
- id: R-DAY-1
  doc: SPEC
  quote: The number of days is not less than 1 or higher than 31 days for months 1,3,5,7,8,10,12.
  text: If the month of the date is 1, 3, 5, 7, 8, 10 or 12 and its day number is less than 1 or greater than 31, valid_date(date) returns False.
  kind: guarantee
  depends:
  - R-FMT-3
  ambiguity:
  - phrase: is not less than 1 or higher than 31
    readings:
    - The day is neither less than 1 nor higher than 31, i.e. 1 <= day <= 31.
    - 'Literal operator scoping: the day is not less than 1, or it is higher than 31, i.e. only day >= 1 is required.'
  lines:
  - 9
- id: R-DAY-2
  doc: SPEC
  quote: And the number of days is not less than 1 or higher than 30 days for months 4,6,9,11.
  text: If the month of the date is 4, 6, 9 or 11 and its day number is less than 1 or greater than 30, valid_date(date) returns False.
  kind: guarantee
  depends:
  - R-FMT-3
  ambiguity:
  - phrase: is not less than 1 or higher than 30
    readings:
    - The day is neither less than 1 nor higher than 30, i.e. 1 <= day <= 30.
    - 'Literal operator scoping: the day is not less than 1, or it is higher than 30, i.e. only day >= 1 is required.'
  - phrase: not less than 1
    readings:
    - 'Contradiction with R-EX-3, rule authoritative: ''04-0-2040'' has month 4 and day 0, which is less than 1, so it is invalid and valid_date returns False.'
    - 'Contradiction with R-EX-3, example authoritative: valid_date(''04-0-2040'') returns True, so day 0 in month 4 is accepted.'
  lines:
  - 9
- id: R-DAY-3
  doc: SPEC
  quote: And, the number of days is not less than 1 or higher than 29 for the month 2.
  text: If the month of the date is 2 and its day number is less than 1 or greater than 29, valid_date(date) returns False.
  kind: guarantee
  depends:
  - R-FMT-3
  ambiguity:
  - phrase: is not less than 1 or higher than 29
    readings:
    - The day is neither less than 1 nor higher than 29, i.e. 1 <= day <= 29.
    - 'Literal operator scoping: the day is not less than 1, or it is higher than 29, i.e. only day >= 1 is required.'
  - phrase: higher than 29 for the month 2
    readings:
    - Day 29 of February is allowed in every year, as the rule states (e.g. '02-29-2001' is valid).
    - Day 29 of February is allowed only in leap years, since a real calendar date is meant (e.g. '02-29-2001' is invalid).
  lines:
  - 9
- id: R-MON-1
  doc: SPEC
  quote: The months should not be less than 1 or higher than 12.
  text: If the month number of the date is less than 1 or greater than 12, valid_date(date) returns False.
  kind: guarantee
  depends:
  - R-FMT-3
  ambiguity:
  - phrase: should not be less than 1 or higher than 12
    readings:
    - The month is neither less than 1 nor higher than 12, i.e. 1 <= month <= 12.
    - 'Literal operator scoping: the month is not less than 1, or it is higher than 12, i.e. only month >= 1 is required.'
  - phrase: higher than 12
    readings:
    - 'Contradiction with R-EX-2, rule authoritative: ''15-01-2012'' has month 15, which is higher than 12, so it is invalid and valid_date returns False.'
    - 'Contradiction with R-EX-2, example authoritative: valid_date(''15-01-2012'') returns True, so month 15 is accepted (or the first field is not the month).'
  lines:
  - 10
- id: R-FMT-1
  doc: SPEC
  quote: 'The date should be in the format: mm-dd-yyyy'
  text: If the month, day and year fields of the date string are not separated by '-' characters (for instance, if '/' is used as separator), valid_date(date) returns False.
  kind: guarantee
  ambiguity:
  - phrase: mm-dd-yyyy
    readings:
    - 'Contradiction with R-EX-5, rule authoritative: the separator must be ''-'', so ''06/04/2020'' is invalid and valid_date returns False.'
    - 'Contradiction with R-EX-5, example authoritative: ''/'' (or any separator) is also accepted, so valid_date(''06/04/2020'') returns True.'
  lines:
  - 11
- id: R-FMT-2
  doc: SPEC
  quote: 'The date should be in the format: mm-dd-yyyy'
  text: If the date string is not exactly two digits (mm), '-', two digits (dd), '-', four digits (yyyy), with no other characters (10 characters in total), valid_date(date) returns False.
  kind: guarantee
  ambiguity:
  - phrase: mm-dd-yyyy
    readings:
    - 'Exact field widths: mm and dd are exactly two digits and yyyy exactly four, so ''04-0-2040'' (one-digit day) is malformed and invalid; this contradicts R-EX-3.'
    - mm and dd may have one or two digits (yyyy four), as R-EX-3 '04-0-2040' => True suggests; this contradicts the exact two-digit reading of the format.
  - phrase: in the format
    readings:
    - The whole string must match mm-dd-yyyy; any leading or trailing characters, including whitespace, make it invalid.
    - Leading and trailing whitespace is ignored (stripped) before the format is checked.
  - phrase: yyyy
    readings:
    - Any four digits form an acceptable year, including '0000'.
    - The year must be a real calendar year (e.g. at least 0001), so '0000' is invalid.
  lines:
  - 11
- id: R-FMT-3
  doc: SPEC
  quote: 'The date should be in the format: mm-dd-yyyy'
  text: In a date string of the form mm-dd-yyyy, the first field (mm) is the month, the second field (dd) is the day and the third field (yyyy) is the year; the month and day numbers used by R-DAY-1, R-DAY-2,
    R-DAY-3 and R-MON-1 are the numeric values of these fields.
  kind: definition
  ambiguity:
  - phrase: mm-dd-yyyy
    readings:
    - 'Contradiction with R-EX-2, format authoritative: the first field is the month, so ''15-01-2012'' has month 15 and is invalid.'
    - 'Contradiction with R-EX-2, example authoritative: the first field is read as the day (dd-mm-yyyy), so ''15-01-2012'' is 15 January 2012 and valid.'
  lines:
  - 11
- id: R-EX-1
  doc: SPEC
  quote: valid_date('03-11-2000') => False
  text: valid_date('03-11-2000') returns False.
  kind: scenario
  ambiguity:
  - phrase: valid_date('03-11-2000') => False
    readings:
    - 'Example authoritative: the call returns False, contradicting R-VAL-1 and R-RET-1, since ''03-11-2000'' (month 3, day 11, format mm-dd-yyyy) satisfies every listed rule.'
    - 'Rules authoritative: ''03-11-2000'' is valid and the call returns True; the example''s expected value is wrong.'
  lines:
  - 14
- id: R-EX-2
  doc: SPEC
  quote: valid_date('15-01-2012') => True
  text: valid_date('15-01-2012') returns True.
  kind: scenario
  ambiguity:
  - phrase: valid_date('15-01-2012') => True
    readings:
    - 'Example authoritative with month 15 accepted: the call returns True, contradicting R-MON-1 (month 15 is higher than 12) and R-RET-2.'
    - 'Example authoritative with fields read as dd-mm-yyyy: ''15-01-2012'' is 15 January 2012 and valid, contradicting R-FMT-3 (first field is the month).'
    - 'Rules authoritative: month 15 is out of range, so the call returns False; the example''s expected value is wrong.'
  lines:
  - 16
- id: R-EX-3
  doc: SPEC
  quote: valid_date('04-0-2040') => True
  text: valid_date('04-0-2040') returns True.
  kind: scenario
  ambiguity:
  - phrase: valid_date('04-0-2040') => True
    readings:
    - 'Example authoritative: the call returns True, contradicting R-DAY-2 (day 0 is less than 1 in month 4), R-FMT-2 (dd is a single digit) and R-RET-2.'
    - 'Rules authoritative: ''04-0-2040'' has day 0 and a one-digit day field, so the call returns False; the example''s expected value is wrong.'
  lines:
  - 18
- id: R-EX-4
  doc: SPEC
  quote: valid_date('06-04-2020') => False
  text: valid_date('06-04-2020') returns False.
  kind: scenario
  ambiguity:
  - phrase: valid_date('06-04-2020') => False
    readings:
    - 'Example authoritative: the call returns False, contradicting R-VAL-1 and R-RET-1, since ''06-04-2020'' (month 6, day 4, format mm-dd-yyyy) satisfies every listed rule.'
    - 'Rules authoritative: ''06-04-2020'' is valid and the call returns True; the example''s expected value is wrong.'
  lines:
