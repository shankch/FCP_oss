  ambiguity:
  - phrase: 0 <= number <= 1000
    readings:
    - 'a precondition on the caller: for number outside 0..1000 (e.g. 1001 to 1023 in the trace) any behaviour is acceptable'
    - 'a check the function must make: it must reject number outside 0..1000, e.g. by raising an exception'
  lines:
