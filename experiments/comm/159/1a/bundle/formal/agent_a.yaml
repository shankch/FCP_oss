fcp: "0.1"
set: agent_a
origin: {kind: agent, role: formalizer, id: agent_a}

defs:
  # Docstring variables, mapped to the signature's parameters in docstring order
  # (R-SIG-1, R-VAR-1..3, reading 1: the only order that fits eat(5, 6, 10) -> [11, 4]).
  number: "x"
  need: "y"
  remaining: "z"

assumptions:
  - id: RA-CON-1
    req: R-CON-1
    expr: "number <= 1000"
    note: >-
      Read as a precondition on the caller (reading 1): calls with number above
      1000 are outside the contract and any behaviour is acceptable for them.
      number >= 0 holds by construction (x is an unsigned 10-bit signal; negative
      arguments are not part of the trace).
  - id: RA-CON-2
    req: R-CON-2
    expr: "need <= 1000"
    note: >-
      Precondition on the caller (reading 1). need >= 0 holds by construction.
  - id: RA-CON-3
    req: R-CON-3
    expr: "remaining <= 1000"
    note: >-
      Precondition on the caller (reading 1). remaining >= 0 holds by construction.

properties:
  - id: RA-RET-1
    req: R-RET-1
    expr: "outcome == 0 && len(result) == 2"
    note: >-
      "an array" read as a Python list (reading 1): outcome 0 is exactly "returned
      a list of integers from 0 to 2,047", so the elements are non-negative
      integers by the encoding; a tuple or other type would be outcome 2.

  - id: RA-RET-2
    req: R-RET-2
    expr: "result[0] == number + min(need, remaining)"
    note: >-
      "total number of needed or eaten carrots before or after your meals" is read
      as the total eaten after the meal, including the carrots eaten before it
      (readings 1/1/1): the only reading consistent with all four examples.
      The literal "needed" (number + need) contradicts eat(2, 11, 5) -> [7, 0].

  - id: RA-RET-3
    req: R-RET-3
    expr: "result[1] == max(remaining - need, 0)"
    note: >-
      "the number of carrots needed or eaten left after your meals" is garbled; read
      as the carrots left in stock (reading 1), the only reading consistent with
      all four examples.

  - id: RA-MEAL-1-TOTAL
    req: R-MEAL-1
    pattern: implies
    args:
      trigger: "need <= remaining"
      cond: "result[0] == number + need"
    note: >-
      "no or more carrots" read as "zero or more" (reading 1): need may be 0 and,
      when the stock suffices, the rabbit eats exactly need carrots, not more.

  - id: RA-MEAL-1-LEFT
    req: R-MEAL-1
    pattern: implies
    args:
      trigger: "need <= remaining"
      cond: "result[1] == remaining - need"
    note: >-
      When the stock suffices, exactly need carrots leave the stock (reading 1 of
      "no or more carrots").

  - id: RA-HUN-1
    req: R-HUN-1
    pattern: implies
    args:
      trigger: "remaining < need"
      cond: "result[0] == number + remaining"
    note: >-
      "not enough remaining carrots" read as remaining < need (reading 1). At
      remaining == need, RA-MEAL-1-TOTAL gives the same value.

  - id: RA-HUN-2
    req: R-HUN-2
    pattern: implies
    args:
      trigger: "remaining < need"
      cond: "result[1] == 0"
    note: >-
      Eating all remaining carrots leaves none in stock: the second element is 0.

  - id: RA-HUN-3
    req: R-HUN-3
    pattern: implies
    args:
      trigger: "remaining < need"
      cond: "number + need - result[0] == need - remaining"
    note: >-
      "will still be hungry" read as narrative (reading 1): the list does not report
      the shortfall as a separate value; the shortfall shows only as the total
      eaten falling need - remaining short of number + need (which implies
      result[0] < number + need). The second element stays the stock left, 0
      (RA-HUN-2, RA-RET-3).

  - id: RA-EX-1
    req: R-EX-1
    pattern: implies
    args:
      trigger: "x == 5 && y == 6 && z == 10"
      cond: "outcome == 0 && result == [11, 4]"
    note: >-
      The example states what this call returns, so it is also a guarantee for
      every call eat(5, 6, 10); second element read as the stock left (reading 1).

  - id: RA-EX-2
    req: R-EX-2
    pattern: implies
    args:
      trigger: "x == 4 && y == 8 && z == 9"
      cond: "outcome == 0 && result == [12, 1]"
    note: >-
      Guarantee for every call eat(4, 8, 9); second element read as the stock left
      (reading 1).

  - id: RA-EX-3
    req: R-EX-3
    pattern: implies
    args:
      trigger: "x == 1 && y == 10 && z == 10"
      cond: "outcome == 0 && result == [11, 0]"
    note: >-
      Guarantee for every call eat(1, 10, 10).

  - id: RA-EX-4
    req: R-EX-4
    pattern: implies
    args:
      trigger: "x == 2 && y == 11 && z == 5"
      cond: "outcome == 0 && result == [7, 0]"
    note: >-
      Guarantee for every call eat(2, 11, 5): [total actually eaten, stock left]
      (reading 1).

scenarios:
  - id: RA-EX-1-COVER
    req: R-EX-1
    cover: "x == 5 && y == 6 && z == 10 && outcome == 0 && result == [11, 4]"
  - id: RA-EX-2-COVER
    req: R-EX-2
    cover: "x == 4 && y == 8 && z == 9 && outcome == 0 && result == [12, 1]"
  - id: RA-EX-3-COVER
    req: R-EX-3
    cover: "x == 1 && y == 10 && z == 10 && outcome == 0 && result == [11, 0]"
  - id: RA-EX-4-COVER
    req: R-EX-4
    cover: "x == 2 && y == 11 && z == 5 && outcome == 0 && result == [7, 0]"
  - id: RA-MEAL-1-ZERO
    req: R-MEAL-1
    cover: "need == 0 && outcome == 0"
    note: >-
      "no or more carrots" (reading 1): a call that needs zero carrots is a
      legitimate call that returns normally.

unformalized:
  - req: R-SIG-1
    reason: >-
      Definition of the function's name and parameter order; the order x, y, z is
      fixed by the interface. The mapping x = number, y = need, z = remaining
      (reading 1) is realized by the defs number, need and remaining used below.
    covered_by: [RA-RET-2, RA-RET-3, RA-CON-1, RA-CON-2, RA-CON-3]
  - req: R-CTX-1
    reason: >-
      Narrative definition; that the carrots already eaten count toward the total is
      realized by the total-eaten properties.
    covered_by: [RA-RET-2, RA-MEAL-1-TOTAL, RA-HUN-1]
  - req: R-VAR-1
    reason: Definition of number; realized by the def number = x (reading 1).
    covered_by: [RA-RET-2, RA-CON-1]
  - req: R-VAR-2
    reason: Definition of need; realized by the def need = y (reading 1).
    covered_by: [RA-RET-2, RA-RET-3, RA-CON-2]
  - req: R-VAR-3
    reason: Definition of remaining; realized by the def remaining = z (reading 1).
    covered_by: [RA-RET-2, RA-RET-3, RA-CON-3]
  - req: R-FR-1
    reason: >-
      Encoding rule of the function adapter; it is the frame item F-EMPTY of
      design.yaml, which is part of every formalization set and need not be
      restated (frame.md).
    covered_by: [F-EMPTY]

decisions:
  - {req: R-SIG-1, phrase: "x, y, z", reading: 1}
  - {req: R-MEAL-1, phrase: "no or more carrots", reading: 1}
  - {req: R-RET-1, phrase: "an array", reading: 1}
  - {req: R-RET-2, phrase: "needed or eaten", reading: 1}
  - {req: R-RET-2, phrase: "before or after your meals", reading: 1}
  - {req: R-RET-2, phrase: "total number", reading: 1}
  - {req: R-RET-3, phrase: "needed or eaten left", reading: 1}
  - {req: R-HUN-1, phrase: "not enough remaining carrots", reading: 1}
  - {req: R-HUN-3, phrase: "will still be hungry", reading: 1}
  - {req: R-EX-1, phrase: "[11, 4]", reading: 1}
  - {req: R-EX-2, phrase: "[12, 1]", reading: 1}
  - {req: R-EX-4, phrase: "[7, 0]", reading: 1}
  - {req: R-VAR-1, phrase: "@number", reading: 1}
  - {req: R-VAR-2, phrase: "@need", reading: 1}
  - {req: R-VAR-3, phrase: "@remaining", reading: 1}
  - {req: R-CON-1, phrase: "0 <= number <= 1000", reading: 1}
  - {req: R-CON-2, phrase: "0 <= need <= 1000", reading: 1}
  - {req: R-CON-3, phrase: "0 <= remaining <= 1000", reading: 1}
