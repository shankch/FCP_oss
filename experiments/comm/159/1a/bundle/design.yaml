fcp: '0.1'
design: code_eat
summary: A Python function treated as a chip without memory. Each cycle is one call of eat(x, y, z); the three integer arguments are inputs, the returned list (a sequence of at most 3 numbers) and the way the call ended are outputs. The prompt is the specification, and code written by AI models is checked by running it.
docs:
- {id: SPEC, path: spec.md, title: 'Prompt: eat(x, y, z), the hungry rabbit'}
- {id: FRAME, path: frame.md, title: 'FCP function adapter, version 0.2'}
interface:
  clock: clk
  reset: {name: rst_n, active_low: true, synchronous: true}
  signals:
  - {name: clk, dir: in, width: 1}
  - {name: rst_n, dir: in, width: 1}
  - {name: x, dir: in, width: 10, desc: 'x argument: the first argument of eat, 0 to 1,023'}
  - {name: y, dir: in, width: 10, desc: 'y argument: the second argument of eat, 0 to 1,023'}
  - {name: z, dir: in, width: 10, desc: 'z argument: the third argument of eat, 0 to 1,023'}
  - {name: outcome, dir: out, width: 2, desc: 'how the call ended: 0 returned a list that fits, 1 raised an exception or no answer, 2 returned anything else'}
  - {name: result, dir: out, width: 11, length: 3, desc: 'the returned list (outcome 0): at most 3 numbers, 0 to 2,047'}
environment: {initial_reset: true, reset_anytime: false, bmc_depth: 3, cover_depth: 3}
frame:
- {id: F-EMPTY, req: R-FR-1, expr: 'outcome != 0 -> len(result) == 0'}
function:
  name: eat
  args:
  - {name: x, signal: x, type: int}
  - {name: y, signal: y, type: int}
  - {name: z, signal: z, type: int}
  returns: {signal: result, type: list}
  outcome: {signal: outcome, raises: []}
  scope:
    x: {dense: [0, 12], values: [999, 1000, 1001], random: 20}
    y: {dense: [0, 12], values: [999, 1000, 1001], random: 20}
    z: {dense: [0, 12], values: [999, 1000, 1001], random: 20}
