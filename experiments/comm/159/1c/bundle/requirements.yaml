fcp: '0.1'
design: review
origin:
  kind: agent
  role: decomposer
  id: decomposer
requirements:
- id: R-API-1
  doc: SPEC
  quote: 'Complete this function:'
  text: The deliverable is a Python implementation of the function eat(number, need, remaining) with the given signature.
  kind: non_functional
  lines:
  - 1
- id: R-CTX-1
  doc: SPEC
  quote: You're a hungry rabbit, and you already have eaten a certain number of carrots, but now you need to eat more carrots to complete the day's meals.
  text: The rabbit has already eaten some carrots before this call and must eat further carrots during the meals of this call to complete the day's meals.
  kind: definition
  ambiguity:
  - phrase: you need to eat more carrots
    readings:
    - When enough carrots are in stock, the rabbit eats exactly `need` further carrots.
    - The rabbit eats at least `need` further carrots and may eat more when stock allows.
  lines:
  - 6
  - 7
- id: R-DEF-1
  doc: SPEC
  quote: '@number : integer the number of carrots that you have eaten.'
  text: 'The argument number is an integer: the number of carrots the rabbit has already eaten before the meals of this call.'
  kind: definition
  lines:
  - 19
  - 20
- id: R-DEF-2
  doc: SPEC
  quote: '@need : integer the number of carrots that you need to eat.'
  text: 'The argument need is an integer: the number of further carrots the rabbit needs to eat in the meals of this call.'
  kind: definition
  ambiguity:
  - phrase: the number of carrots that you need to eat
    readings:
    - need is the number of additional carrots to eat on top of the number already eaten (the examples, e.g. eat(5, 6, 10) -> [11, 10], follow this reading).
    - need is the day's total requirement including the carrots already eaten, so only max(0, need - number) more carrots are needed.
  lines:
  - 21
  - 22
- id: R-DEF-3
  doc: SPEC
  quote: '@remaining : integer the number of remaining carrots thet exist in stock'
  text: 'The argument remaining is an integer: the number of carrots in stock before the meals of this call.'
  kind: definition
  lines:
  - 23
  - 24
- id: R-RET-1
  doc: SPEC
  quote: you should return an array of [ total number of eaten carrots after your meals, the number of carrots left after your meals ]
  text: 'The function returns a list of exactly two integers: first the total number of carrots eaten after the meals, then the number of carrots left after the meals.'
  kind: guarantee
  ambiguity:
  - phrase: an array
    readings:
    - A Python list (the adapter records only a list as outcome 0).
    - Any two-element sequence, such as a tuple, would do.
  lines:
  - 8
  - 9
- id: R-TOT-1
  doc: SPEC
  quote: total number of eaten carrots after your meals
  text: When remaining >= need, the first element of the returned list equals number + need.
  kind: guarantee
  depends:
  - R-RET-1
  - R-DEF-2
  ambiguity:
  - phrase: total number of eaten carrots
    readings:
    - 'The carrots eaten before the call (number) plus the carrots eaten in these meals: number + need (the examples follow this reading).'
    - 'Only the carrots eaten in these meals: need.'
  - phrase: the number of carrots that you need to eat
    readings:
    - need is additional to number, so the first element is number + need.
    - need is the day's total, so the first element is max(number, need).
  lines:
  - 8
- id: R-TOT-2
  doc: SPEC
  quote: if there are not enough remaining carrots, you will eat all remaining carrots
  text: When remaining < need, the rabbit eats all remaining carrots, so the first element of the returned list equals number + remaining.
  kind: guarantee
  depends:
  - R-RET-1
  ambiguity:
  - phrase: total number of eaten carrots
    readings:
    - 'The carrots eaten before the call plus those eaten in these meals: number + remaining (eat(2, 11, 5) -> [7, 5] follows this reading).'
    - 'Only the carrots eaten in these meals: remaining.'
  lines:
  - 10
- id: R-LEFT-1
  doc: SPEC
  quote: the number of carrots left after your meals
  text: When remaining >= need, the second element of the returned list equals remaining - need, the carrots left in stock after the meals.
  kind: guarantee
  depends:
  - R-RET-1
  ambiguity:
  - phrase: the number of carrots left after your meals
    readings:
    - 'The stock after eating: remaining - need. Under this reading the examples eat(5, 6, 10) -> [11, 10], eat(4, 8, 9) -> [12, 9] and eat(1, 10, 10) -> [11, 10] are wrong; they would be [11, 4], [12,
      1] and [11, 0] (contradiction with R-EX-1, R-EX-2, R-EX-3).'
    - The remaining argument unchanged, as all three of those examples show, so the second element is remaining (contradicting the literal prose 'left after your meals').
  lines:
  - 9
- id: R-LEFT-2
  doc: SPEC
  quote: you will eat all remaining carrots
  text: When remaining < need, all remaining carrots are eaten, so the second element of the returned list equals 0.
  kind: guarantee
  depends:
  - R-RET-1
  - R-TOT-2
  ambiguity:
  - phrase: you will eat all remaining carrots
    readings:
    - No carrots are left after the meals, so the second element is 0. Under this reading the example eat(2, 11, 5) -> [7, 5] is wrong; it would be [7, 0] (contradiction with R-EX-4).
    - The second element is the remaining argument unchanged, as eat(2, 11, 5) -> [7, 5] shows, even though all of it is eaten.
  lines:
  - 10
- id: R-HUN-1
  doc: SPEC
  quote: but will still be hungry
  text: 'When remaining < need, the rabbit''s need is not fully met after eating all remaining carrots: it is still hungry.'
  kind: definition
  depends:
  - R-TOT-2
  ambiguity:
  - phrase: will still be hungry
    readings:
    - 'Narrative only: it imposes no obligation on the returned list beyond the two elements.'
    - The returned value must somehow report the unmet need (e.g. an extra element or flag), which would conflict with the two-element list of R-RET-1.
  lines:
  - 10
- id: R-EX-1
  doc: SPEC
  quote: eat(5, 6, 10) -> [11, 10]
  text: A call eat(5, 6, 10) returns [11, 10].
  kind: scenario
  ambiguity:
  - phrase: eat(5, 6, 10) -> [11, 10]
    readings:
    - 'Binding as written: the second element is 10, the stock before the meals (contradicts R-LEFT-1, which gives 10 - 6 = 4).'
    - The second element is an error; following R-LEFT-1 the intended result is [11, 4].
  lines:
  - 13
- id: R-EX-2
  doc: SPEC
  quote: eat(4, 8, 9) -> [12, 9]
  text: A call eat(4, 8, 9) returns [12, 9].
  kind: scenario
  ambiguity:
  - phrase: eat(4, 8, 9) -> [12, 9]
    readings:
    - 'Binding as written: the second element is 9, the stock before the meals (contradicts R-LEFT-1, which gives 9 - 8 = 1).'
    - The second element is an error; following R-LEFT-1 the intended result is [12, 1].
  lines:
  - 14
- id: R-EX-3
  doc: SPEC
  quote: eat(1, 10, 10) -> [11, 10]
  text: A call eat(1, 10, 10) returns [11, 10].
  kind: scenario
  ambiguity:
  - phrase: eat(1, 10, 10) -> [11, 10]
    readings:
    - 'Binding as written: the second element is 10, the stock before the meals (contradicts R-LEFT-1, which gives 10 - 10 = 0).'
    - The second element is an error; following R-LEFT-1 the intended result is [11, 0].
  lines:
  - 15
- id: R-EX-4
  doc: SPEC
  quote: eat(2, 11, 5) -> [7, 5]
  text: A call eat(2, 11, 5) returns [7, 5].
  kind: scenario
  ambiguity:
  - phrase: eat(2, 11, 5) -> [7, 5]
    readings:
    - 'Binding as written: the second element is 5, the stock before the meals (contradicts R-LEFT-2, which gives 0 because all remaining carrots are eaten).'
    - The second element is an error; following R-LEFT-2 the intended result is [7, 0].
  lines:
  - 16
- id: R-ENV-1
  doc: SPEC
  quote: 0 <= number <= 1000
  text: The argument number is between 0 and 1000 inclusive.
  kind: assumption
  ambiguity:
  - phrase: 0 <= number <= 1000
    readings:
    - 'A precondition on callers: the behaviour for number outside 0..1000 is unspecified.'
    - 'A rule the function enforces: it must reject (e.g. raise on) number outside 0..1000.'
  lines:
  - 27
- id: R-ENV-2
  doc: SPEC
  quote: 0 <= need <= 1000
  text: The argument need is between 0 and 1000 inclusive.
  kind: assumption
  ambiguity:
  - phrase: 0 <= need <= 1000
    readings:
    - 'A precondition on callers: the behaviour for need outside 0..1000 is unspecified.'
    - 'A rule the function enforces: it must reject (e.g. raise on) need outside 0..1000.'
  lines:
  - 28
- id: R-ENV-3
  doc: SPEC
  quote: 0 <= remaining <= 1000
  text: The argument remaining is between 0 and 1000 inclusive.
  kind: assumption
  ambiguity:
  - phrase: 0 <= remaining <= 1000
    readings:
    - 'A precondition on callers: the behaviour for remaining outside 0..1000 is unspecified.'
    - 'A rule the function enforces: it must reject (e.g. raise on) remaining outside 0..1000.'
  lines:
  - 29
- id: R-FR-1
  doc: FRAME
  quote: 'F-EMPTY: `result` is the empty list unless `outcome` is 0.'
  text: Whenever outcome is not 0, result is the empty list.
  kind: guarantee
  lines:
  - 46
