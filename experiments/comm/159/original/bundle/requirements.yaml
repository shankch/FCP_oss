  kind: non_functional
  lines:
  - 4
- id: R-DEF-1
  doc: SPEC
  quote: '@number : integer the number of carrots that you have eaten.'
  text: 'The argument number is an integer: the number of carrots the rabbit has already eaten before this call.'
  kind: definition
  lines:
  - 19
  - 20
- id: R-DEF-2
  doc: SPEC
  quote: '@need : integer the number of carrots that you need to eat.'
  text: 'The argument need is an integer: the number of carrots the rabbit still needs to eat in this call.'
  kind: definition
  ambiguity:
  - phrase: the number of carrots that you need to eat
    readings:
    - need is the number of additional carrots to eat on top of the number already eaten (the examples, e.g. eat(5, 6, 10) -> [11, 4], follow this reading)
    - need is the day's total requirement including the carrots already eaten, so only max(need - number, 0) more are needed (this contradicts eat(5, 6, 10) -> [11, 4], which would become [6, 9])
  lines:
  - 21
  - 22
- id: R-DEF-3
  doc: SPEC
  quote: '@remaining : integer the number of remaining carrots thet exist in stock'
  text: 'The argument remaining is an integer: the number of carrots in stock that are available to eat.'
  kind: definition
  lines:
  - 23
  - 24
- id: R-RET-1
  doc: SPEC
  quote: you should return an array of
  text: The function returns a list of exactly two integers.
  kind: guarantee
  ambiguity:
  - phrase: array
    readings:
    - a Python list
    - a list or a tuple
    - any array-like sequence, such as array.array or a numpy array
  - phrase: return an array of [ total number of eaten carrots after your meals, the number of carrots left after your meals ]
    readings:
    - exactly these two elements are returned and nothing else; that the rabbit is still hungry (R-EAT-5) is not reported separately
    - the result must also report that the rabbit is still hungry (R-EAT-5), which contradicts returning exactly two elements
  lines:
  - 8
- id: R-RET-2
  doc: SPEC
  quote: total number of eaten carrots after your meals
  text: 'The first element of the returned list is the total number of carrots the rabbit has eaten after this call''s meal: the carrots eaten before the call (number) plus the carrots eaten in this call.'
  kind: definition
  depends:
  - R-RET-1
  - R-DEF-1
  ambiguity:
  - phrase: total number of eaten carrots
    readings:
    - number plus the carrots eaten in this call (the examples follow this reading)
    - only the carrots eaten in this call, without number
  lines:
  - 8
- id: R-RET-3
  doc: SPEC
  quote: the number of carrots left after your meals
  text: 'The second element of the returned list is the number of carrots left in stock after this call''s meal: remaining minus the carrots eaten in this call.'
  kind: definition
  depends:
  - R-RET-1
  - R-DEF-3
  ambiguity:
  - phrase: the number of carrots left
    readings:
    - 'the carrots left in stock: remaining minus the carrots eaten in this call (the examples follow this reading)'
    - 'the carrots the rabbit still has left to eat: need minus the carrots eaten in this call'
  lines:
  - 9
- id: R-EAT-1
  doc: SPEC
  quote: but now you need to eat more carrots to complete the day's meals.
  text: If need <= remaining, the first element of the returned list is number + need.
  kind: guarantee
  depends:
  - R-RET-2
  - R-DEF-2
  ambiguity:
  - phrase: you need to eat more carrots
    readings:
    - when there are enough carrots the rabbit eats exactly need carrots, no more (the examples follow this reading)
    - the rabbit eats at least need carrots and may eat more, e.g. all remaining carrots
  lines:
  - 7
