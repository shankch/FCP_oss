fcp: "0.1"
set: agent_b
origin: {kind: agent, role: formalizer, id: agent_b}

# Specification model. frame.md: every cycle is one independent call of
# modp(n, p) and the function keeps no state, so the reference model is a
# combinational function of the current arguments (no ghost registers).
# FCP-PL only allows `%` with a constant divisor, so "2^n modulo p" is written
# as a case split over the constant moduli 1..127 (the whole range of p for
# p >= 1); exactly one term is selected, and each term is the exact integer
# 2**n % (k + 1).
defs:
  in_domain: "p >= 1"                                   # "modulo p" is defined
  want: "sum(k < 127: p == k + 1 ? (1 << n) % (k + 1) : 0)"   # 2^n modulo p, for p >= 1

properties:
  - id: RB-RET-1-OUT
    req: R-RET-1
    pattern: implies
    args: {trigger: in_domain, cond: "outcome == 0"}
    note: >-
      "Return 2^n modulo p": for every p >= 1 the call returns an integer
      (outcome 0). 2^n modulo p is below p <= 127, so it always fits the
      0..255 range of outcome 0; raising, not finishing, or returning another
      type (e.g. a float) violates this. Reading taken for "Return 2^n modulo
      p": the formula governs (reading 1, the most literal). This contradicts
      every docstring example (R-EX-1..5), which are kept literally as
      scenarios RB-EX-1..5 and are therefore unreachable together with
      RB-RET-1-VAL; the specification is contradictory and is not repaired here.

  - id: RB-RET-1-VAL
    req: R-RET-1
    pattern: implies
    args: {trigger: in_domain, cond: "result == want"}
    note: >-
      For every p >= 1 the returned integer equals (2 ** n) % p exactly, i.e.
      the remainder in 0..p-1 (for p = 1 it is 0). "2^n" is read as 2 raised
      to the power n (reading 1), not Python's bitwise XOR 2 ^ n. The formula
      governs over the docstring examples (reading 1): e.g. on n = 3, p = 5 this
      requires result 3, whereas the example R-EX-1 shows 5. That conflict is
      in the specification and is deliberately left visible.

dont_cares:
  - id: RB-RET-1-P0-OUT
    req: R-RET-1
    signal: outcome
    when: "p == 0"
    note: >-
      "modulo p" for p = 0 is undefined and the text says nothing about it.
      Reading 1, the most literal: p = 0 is outside the domain the text
      defines, so how the call ends is unconstrained (it may raise, as Python's
      2 ** n % 0 does, or return something). No environment assumption is made,
      because the text places no obligation on the caller and frame.md
      includes p = 0 in the trace.

  - id: RB-RET-1-P0-RES
    req: R-RET-1
    signal: result
    when: "p == 0"
    note: >-
      For p = 0 the returned value is unconstrained (reading 1 of "modulo p");
      the frame rule F-ZERO still forces result 0 whenever outcome is not 0.

scenarios:
  - id: RB-EX-1
    req: R-EX-1
    cover: "n == 3 && p == 5 && outcome == 0 && result == 5"
    note: >-
      Doctest ">>> modp(3, 5)" / "5", read literally (reading 1): the call
      modp(3, 5) returns 5. CONTRADICTS R-RET-1: 2^3 modulo 5 is 3, so this
      scenario is unreachable under RB-RET-1-VAL. Kept literal to expose the
      contradiction rather than to repair it.

  - id: RB-EX-2
    req: R-EX-2
    cover: "n == 1101 && p == 101 && outcome == 0 && result == 101"
    note: >-
      Doctest ">>> modp(1101, 101)" / "101", read literally (reading 1): the
      call returns 101. CONTRADICTS R-RET-1: 2^1101 modulo 101 is 2; and 101 is
      not below p at all, so no remainder modulo 101 can equal it. Unreachable
      under RB-RET-1-VAL.

  - id: RB-EX-3
    req: R-EX-3
    cover: "n == 0 && p == 101 && outcome == 0 && result == 101"
    note: >-
      Doctest ">>> modp(0, 101)" / "101", read literally (reading 1): the call
      returns 101. CONTRADICTS R-RET-1: 2^0 modulo 101 is 1. Unreachable under
      RB-RET-1-VAL.

  - id: RB-EX-4
    req: R-EX-4
    cover: "n == 3 && p == 11 && outcome == 0 && result == 11"
    note: >-
      Doctest ">>> modp(3, 11)" / "11", read literally (reading 1): the call
      returns 11. CONTRADICTS R-RET-1: 2^3 modulo 11 is 8. Unreachable under
      RB-RET-1-VAL.

  - id: RB-EX-5
    req: R-EX-5
    cover: "n == 100 && p == 101 && outcome == 0 && result == 101"
    note: >-
      Doctest ">>> modp(100, 101)" / "101", read literally (reading 1): the
      call returns 101. CONTRADICTS R-RET-1: 2^100 modulo 101 is 1.
      Unreachable under RB-RET-1-VAL.

unformalized:
  - req: R-IF-1
    reason: >-
      Definition of the interface (name modp, parameters n then p, both int).
      It has no trace obligation: it is realized by the adapter's function
      section, which drives argument n from signal n and argument p from
      signal p.

  - req: R-IF-2
    reason: >-
      Non-functional instruction to complete the given function, keeping its
      name and parameters. Not a property of the call trace; the adapter can
      only call modp(n, p) if the signature is kept.

  - req: R-NUM-1
    reason: >-
      "(be aware of numerics)" is read as a general caution (reading 3) that
      adds no checkable obligation beyond R-RET-1. Its only observable
      consequence, an exact integer result with no float rounding or
      fixed-width overflow, is already required by RB-RET-1-OUT (a float or
      out-of-range return is outcome 2) and RB-RET-1-VAL (exact equality with
      2**n % p). The efficiency sense (modular exponentiation) is not
      observable in the trace, except as "did not finish" (outcome 1), which
      RB-RET-1-OUT already forbids for p >= 1.
    covered_by: [RB-RET-1-OUT, RB-RET-1-VAL]

  - req: R-FR-1
    reason: >-
      Frame rule of the adapter (frame.md): it holds by construction and is
      added to every formalization set as F-ZERO, so it is not restated here.
    covered_by: [F-ZERO]

decisions:
  - {req: R-RET-1, phrase: "2^n", reading: 1}
  - {req: R-RET-1, phrase: "modulo p", reading: 1}
  - {req: R-RET-1, phrase: "Return 2^n modulo p", reading: 1}
  - {req: R-NUM-1, phrase: "be aware of numerics", reading: 3}
  - {req: R-EX-1, phrase: ">>> modp(3, 5) 5", reading: 1}
  - {req: R-EX-2, phrase: ">>> modp(1101, 101) 101", reading: 1}
  - {req: R-EX-3, phrase: ">>> modp(0, 101) 101", reading: 1}
  - {req: R-EX-4, phrase: ">>> modp(3, 11) 11", reading: 1}
  - {req: R-EX-5, phrase: ">>> modp(100, 101) 101", reading: 1}
