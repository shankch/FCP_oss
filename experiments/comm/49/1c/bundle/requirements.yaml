- id: R-IF-2
  doc: SPEC
  quote: 'Complete this function:'
  text: The code supplies a body for the given modp function and keeps its name and parameters unchanged.
  kind: non_functional
  lines:
  - 1
- id: R-RET-1
  doc: SPEC
  quote: Return 2^n modulo p
  text: For every call, modp(n, p) returns the integer (2 to the power n) modulo p, which for p >= 1 is the remainder in 0 to p - 1.
  kind: guarantee
  ambiguity:
  - phrase: 2^n
    readings:
    - 2 raised to the power n (Python 2 ** n)
    - the Python expression 2 ^ n, i.e. bitwise XOR of 2 and n
  - phrase: modulo p
    readings:
    - p = 0 is outside the intended domain; the result for p = 0 is unconstrained (don't care)
    - for p = 0 the call fails with an exception, as Python's 2 ** n % 0 raises ZeroDivisionError
    - for p = 0 the call returns some integer (for example 2 ** n unreduced, or 0)
  - phrase: Return 2^n modulo p
    readings:
    - 'the formula governs: the result is (2 ** n) % p, which is always below p and therefore contradicts every docstring example (each shows the result p)'
    - 'the docstring examples govern: modp(3, 5) is 5, modp(1101, 101) is 101, modp(0, 101) is 101, modp(3, 11) is 11 and modp(100, 101) is 101, so the formula does not describe the intended result (at
      least on those calls)'
  lines:
  - 5
- id: R-NUM-1
  doc: SPEC
  quote: (be aware of numerics)
  text: 'The implementation takes care with numerics when computing 2^n modulo p for large n: the returned value is exact (no floating-point rounding or fixed-width overflow) and the computation stays practical
    for large n.'
  kind: non_functional
  ambiguity:
  - phrase: be aware of numerics
    readings:
    - 'exactness: the result must be the exact integer, not a float or a value damaged by floating-point rounding or overflow (observable in the returned value)'
    - 'efficiency: avoid building the full 2^n for large n (e.g. use modular exponentiation); a performance hint with no effect on the returned value'
    - a general caution only, adding no checkable obligation beyond R-RET-1
  lines:
  - 5
