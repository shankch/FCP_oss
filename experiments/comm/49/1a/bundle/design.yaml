fcp: '0.1'
design: code_modp
summary: A Python function on integers treated as a chip without memory. Each cycle is one call of candidate(x, y); the two arguments are inputs, the returned integer and the way the call ended are outputs. The prompt is the specification, and code written by AI models is checked by running it.
docs:
- {id: SPEC, path: spec.md, title: 'Prompt: complete candidate(x, y), 2^n modulo p'}
- {id: FRAME, path: frame.md, title: 'FCP function adapter, version 0.1'}
interface:
  clock: clk
  reset: {name: rst_n, active_low: true, synchronous: true}
  signals:
  - {name: clk, dir: in, width: 1}
  - {name: rst_n, dir: in, width: 1}
  - {name: x, dir: in, width: 11, desc: 'x argument, 0 to 2047'}
  - {name: y, dir: in, width: 7, desc: 'y argument, 0 to 127'}
  - {name: outcome, dir: out, width: 2, desc: 'how the call ended: 0 returned an integer that fits, 1 any exception or no answer, 2 returned anything else'}
  - {name: result, dir: out, width: 7, desc: 'the returned integer (outcome 0), 0 to 127'}
environment: {initial_reset: true, reset_anytime: false, bmc_depth: 3, cover_depth: 3}
frame:
- {id: F-ZERO, req: R-FR-1, expr: 'outcome != 0 -> result == 0'}
function:
  name: candidate
  args:
  - {name: x, signal: x, type: int}
  - {name: y, signal: y, type: int}
  returns: {signal: result, type: int}
  outcome: {signal: outcome, raises: []}
  scope:
    x: {dense: [0, 200], random: 300, values: [0, 1, 3, 100, 1101]}
    y: {dense: [0, 127], values: [5, 11, 101]}
