- id: R-SIG-1
  doc: SPEC
  quote: 'Complete this function:'
  text: The deliverable is a complete Python implementation of the function candidate, keeping the given signature and docstring.
  kind: non_functional
  lines:
  - 1
- id: R-SIG-2
  doc: SPEC
  quote: 'def candidate(x: int, y: int):'
  text: candidate takes two integer parameters, x first and y second, and is called as candidate(x, y).
  kind: definition
  ambiguity:
  - phrase: 'x: int, y: int'
    readings:
    - x is the exponent the docstring calls n, and y is the modulus it calls p (all five examples agree with this)
    - x is the modulus the docstring calls p, and y is the exponent it calls n
  lines:
  - 4
- id: R-MOD-1
  doc: SPEC
  quote: Return 2^n modulo p
  text: Every call candidate(x, y) returns the integer 2^x modulo y, that is, the remainder in 0..y-1 when 2 raised to the power x is divided by y. The prompt does not say what happens when y is 0.
  kind: guarantee
  ambiguity:
  - phrase: 2^n modulo p
    readings:
    - n is the first argument x and p is the second argument y (all five examples agree with this)
    - n is the second argument y and p is the first argument x
  - phrase: 2^n
    readings:
    - 2 raised to the power n
    - 2 XOR n, which is what the operator ^ means in Python
  - phrase: modulo p
    readings:
    - the least non-negative residue, a value in 0..p-1; for example candidate(0, 1) returns 0
    - any integer congruent to 2^n modulo p; for example candidate(0, 1) may return 1 instead of 0
  - phrase: modulo p, when p is 0
    readings:
    - modulo 0 is undefined, so for y = 0 the call may end in any way
    - for y = 0 the call must raise an exception, as division by zero does in Python
    - for y = 0 the call returns 2^n unreduced, by the convention that a modulo 0 is a
  - phrase: p
    readings:
    - p is any positive integer modulus
    - p denotes a prime (every example uses one of the primes 5, 11, 101), so calls with a non-prime y are outside the contract
  - phrase: Return
    readings:
    - the returned value must be a Python int (the examples print 3, not 3.0)
    - any value numerically equal to the residue is acceptable, for example the float 3.0
  lines:
  - 5
- id: R-NUM-1
  doc: SPEC
  quote: be aware of numerics
  text: The implementation must deal correctly with numerical issues of large powers of 2, so that every call in range returns the exact residue.
  kind: non_functional
  ambiguity:
  - phrase: be aware of numerics
    readings:
    - 'the result must be exact: no floating-point arithmetic (such as math.pow) that loses precision for large n'
    - the computation must be efficient for large n, for example by modular exponentiation rather than forming 2^n in full
    - only a hint to the implementer, adding no obligation beyond the returned value
  lines:
  - 5
