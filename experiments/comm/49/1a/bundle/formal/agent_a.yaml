properties:
  - id: RA-MOD-1
    req: R-MOD-1
    pattern: implies
    args: {trigger: "y != 0", cond: "outcome == 0"}
    note: >-
      "Return" read as returning a Python int (reading 1), so for every
      positive modulus the call ends normally with an integer that fits
      `result` (outcome 0). "p" read as any positive integer (reading 1),
      not only primes, so every y in 1..127 is covered. y = 0 is left free
      (RA-MOD-Z1, RA-MOD-Z2).
  - id: RA-MOD-2
    req: R-MOD-1
    pattern: implies
    args: {trigger: "y != 0", cond: "result == want"}
    note: >-
      For y in 1..127 the returned integer is 2^x mod y in 0..y-1: x is n,
      y is p (reading 1), ^ is exponentiation (reading 1; the XOR reading
      contradicts the examples, e.g. 2 XOR 3 = 1 but candidate(3, 5) is 3),
      and "modulo p" is the least non-negative residue (reading 1), so
      candidate(x, 1) returns 0. The residue is exact for every x up to
      2047, which is also what R-NUM-1 asks.
  - id: RA-EX-1
    req: R-EX-1
    pattern: implies
    args: {trigger: "x == 3 && y == 5", cond: "outcome == 0 && result == 3"}
    note: >-
      The docstring example states what the call returns, not only that it
      may return it, so it is also stated as a property (implied by
      RA-MOD-1 and RA-MOD-2). The scenario RA-EX-1C states that the call
      is possible.
  - id: RA-EX-2
    req: R-EX-2
    pattern: implies
    args: {trigger: "x == 1101 && y == 101", cond: "outcome == 0 && result == 2"}
    note: Docstring example stated as a property; RA-EX-2C is its scenario.
  - id: RA-EX-3
    req: R-EX-3
    pattern: implies
    args: {trigger: "x == 0 && y == 101", cond: "outcome == 0 && result == 1"}
    note: Docstring example stated as a property; RA-EX-3C is its scenario.
  - id: RA-EX-4
    req: R-EX-4
    pattern: implies
    args: {trigger: "x == 3 && y == 11", cond: "outcome == 0 && result == 8"}
    note: Docstring example stated as a property; RA-EX-4C is its scenario.
  - id: RA-EX-5
    req: R-EX-5
    pattern: implies
    args: {trigger: "x == 100 && y == 101", cond: "outcome == 0 && result == 1"}
    note: Docstring example stated as a property; RA-EX-5C is its scenario.

scenarios:
  - {id: RA-EX-1C, req: R-EX-1, cover: "x == 3 && y == 5 && outcome == 0 && result == 3"}
  - {id: RA-EX-2C, req: R-EX-2, cover: "x == 1101 && y == 101 && outcome == 0 && result == 2"}
  - {id: RA-EX-3C, req: R-EX-3, cover: "x == 0 && y == 101 && outcome == 0 && result == 1"}
  - {id: RA-EX-4C, req: R-EX-4, cover: "x == 3 && y == 11 && outcome == 0 && result == 8"}
  - {id: RA-EX-5C, req: R-EX-5, cover: "x == 100 && y == 101 && outcome == 0 && result == 1"}

dont_cares:
  - id: RA-MOD-Z1
    req: R-MOD-1
    signal: outcome
    when: "y == 0"
    note: >-
      The prompt does not say what modulo 0 means. Most literal reading
      (reading 1 of "modulo p, when p is 0"): it is undefined, so the call
      may end in any way, including raising an exception.
  - id: RA-MOD-Z2
    req: R-MOD-1
    signal: result
    when: "y == 0"
    note: >-
      With y = 0 the returned value is unconstrained (beyond the frame rule
      F-ZERO), as for RA-MOD-Z1.

unformalized:
  - req: R-SIG-1
    reason: >-
      Concerns the form of the deliverable (a complete implementation that
      keeps the given signature and docstring), which is not observable in a
      call. That every call with y != 0 returns an integer is required by
      RA-MOD-1.
  - req: R-SIG-2
    reason: >-
      A definition: it fixes that the inputs x and y are the first and second
      arguments, which the frame already encodes. Its reading (x is n, y is p)
      is used by the items that realize R-MOD-1 and the examples.
    covered_by: [RA-MOD-1, RA-MOD-2]
  - req: R-NUM-1
    reason: >-
      A hint to the implementer. Its observable content (reading 1: the result
      is exact, with no loss of precision for large exponents) is that every
      call in range returns the exact residue, which RA-MOD-2 states for all
      x up to 2047. How the residue is computed (floating point or not,
      modular exponentiation or not) cannot be seen in a call.
    covered_by: [RA-MOD-2]
  - req: R-FR-1
    reason: Frame rule of the adapter, included in every set as F-ZERO.
    covered_by: [F-ZERO]

decisions:
  - {req: R-SIG-2, phrase: "x: int, y: int", reading: 1}
  - {req: R-MOD-1, phrase: "2^n modulo p", reading: 1}
  - {req: R-MOD-1, phrase: "2^n", reading: 1}
  - {req: R-MOD-1, phrase: "modulo p", reading: 1}
  - {req: R-MOD-1, phrase: "modulo p, when p is 0", reading: 1}
  - {req: R-MOD-1, phrase: "p", reading: 1}
  - {req: R-MOD-1, phrase: "Return", reading: 1}
  - {req: R-NUM-1, phrase: "be aware of numerics", reading: 1}
