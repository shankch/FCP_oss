# Reading taken throughout (see decisions): the docstring's n is the first
# argument x and its p is the second argument y, as the five examples show.
defs:
  # 2^x as an exact integer (FCP-PL arithmetic is exact, no overflow).
  p2: "1 << x"
  # 2^x modulo y, the least non-negative residue, for y = 1 .. 127. FCP-PL's %
  # only takes a constant divisor, so the residue is tabulated per value of y.
  # The final 0 is never used: every item reading `want` requires y != 0.
