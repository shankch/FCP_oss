fcp: '0.1'
design: code_modp
summary: A Python function on integers treated as a chip without memory. Each cycle is one call of modp(n, p); the arguments are inputs, the returned value and the way the call ended are outputs. The request is the specification, and code written by AI models is checked by running it.
docs:
- {id: SPEC, path: spec.md, title: 'Request: complete modp(n, p)'}
- {id: FRAME, path: frame.md, title: 'FCP function adapter, version 0.1'}
interface:
  clock: clk
  reset: {name: rst_n, active_low: true, synchronous: true}
  signals:
  - {name: clk, dir: in, width: 1}
  - {name: rst_n, dir: in, width: 1}
  - {name: n, dir: in, width: 10, desc: 'n argument, 0 to 1,023'}
  - {name: p, dir: in, width: 10, desc: 'p argument, 0 to 1,023'}
  - {name: outcome, dir: out, width: 2, desc: 'how the call ended: 0 returned an integer that fits, 1 any exception or no answer, 2 returned anything else'}
  - {name: result, dir: out, width: 10, desc: 'the returned value (outcome 0)'}
environment: {initial_reset: true, reset_anytime: false, bmc_depth: 3, cover_depth: 3}
frame:
- {id: F-ZERO, req: R-FR-1, expr: 'outcome != 0 -> result == 0'}
function:
  name: modp
  args:
  - {name: n, signal: n, type: int}
  - {name: p, signal: p, type: int}
  returns: {signal: result, type: int}
  outcome: {signal: outcome, raises: []}
  scope:
    n: {dense: [0, 100], random: 200}
    p: {dense: [0, 100], random: 200}
