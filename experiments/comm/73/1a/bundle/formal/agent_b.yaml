fcp: "0.1"
set: agent_b
origin: {kind: agent, role: formalizer, id: agent_b}

# Specification model. The function keeps no state between calls (frame.md),
# so the model is combinational: defs computed from the argument of the
# current call, against which every output is checked.
defs:
  # mirrored index pairs (i, len(arr)-1-i) with i < len(arr)-1-i whose two
  # elements differ; the middle element of an odd-length array has no mirror
  mism: "count(i < len(arr): i < len(arr) - 1 - i && arr[i] != arr[len(arr) - 1 - i])"
  # arr reads the same backwards and forwards, element by element
  pal: "all(i < len(arr): arr[i] == arr[len(arr) - 1 - i])"

properties:
  - id: RB-CH-1
    req: R-CH-1
    expr: "outcome == 0 && changes == mism"
    note: >-
      Every call returns an integer equal to the model count mism. "The number
      of elements that need to be changed" is read as the minimum number of
      single-element changes (ambiguity reading 1): one change alters one
      element and so repairs at most one differing mirrored pair, and setting
      one element of each differing pair to its mirror's value repairs it, so
      the minimum is the number of differing pairs. "To make the array
      palindromic" is read as computing the count only (reading 1); whether arr
      is mutated is in any case not observable on the trace, where arr is an
      input.

  - id: RB-CH-2
    req: R-CH-2
    expr: "outcome == 0"
    note: >-
      Every call returns an integer that fits the changes signal: no exception,
      no hang, no value of another type, no negative number. "Find the number"
      is read as returning it (reading 1), as the docstring examples compare
      the call's result with ==. The adapter's cap of 15 adds nothing: for at
      most 10 elements the count is at most 5.

  - id: RB-DEF-1
    req: R-DEF-1
    expr: "outcome == 0 -> (changes == 0 <-> pal)"
    note: >-
      Zero changes are needed exactly when arr is already palindromic.
      "Read the same backwards and forwards" is read element-wise (reading 1):
      arr[i] == arr[len(arr)-1-i] for every i, so [12, 21] is not palindromic.
      The empty array and every one-element array satisfy pal.

  - id: RB-IN-1
    req: R-IN-1
    expr: "len(arr) == 0 -> (outcome == 0 && changes == 0)"
    note: >-
      "An array arr of integers" is read as admitting the empty array
      (reading 1): an empty list is a list of integers, it reads the same
      backwards and forwards, and the answer for it is 0. This is implied by
      RB-CH-1 and states the reading explicitly. No environment assumption is
      needed: the interface encoding already restricts arr to lists of
      integers (0 to 255, at most 10 elements), which is the whole of the
      obligation R-IN-1 places on the caller.

  - id: RB-EX-1
    req: R-EX-1
    expr: "arr == [1, 2, 3, 5, 4, 7, 9, 6] -> (outcome == 0 && changes == 4)"
    note: >-
      The docstring example. Consistent with RB-CH-1 under the minimum reading
      (reading 1): the four pairs (1,6), (2,9), (3,7), (5,4) all differ.

  - id: RB-EX-2
    req: R-EX-2
    expr: "arr == [1, 2, 3, 4, 3, 2, 2] -> (outcome == 0 && changes == 1)"
    note: >-
      The docstring example. Consistent with RB-CH-1 under the minimum reading
      (reading 1): only the pair (1,2) differs; the middle 4 has no mirror.

  - id: RB-EX-3
    req: R-EX-3
    expr: "arr == [1, 2, 3, 2, 1] -> (outcome == 0 && changes == 0)"
    note: The docstring example; the array is already palindromic.

scenarios:
  - id: RB-IN-1-S
    req: R-IN-1
    cover: "len(arr) == 0 && outcome == 0 && changes == 0"
    note: The empty array is a legitimate call, answered with 0 (reading 1 of R-IN-1).

  - id: RB-EX-1-S
    req: R-EX-1
    cover: "arr == [1, 2, 3, 5, 4, 7, 9, 6] && outcome == 0 && changes == 4"

  - id: RB-EX-2-S
    req: R-EX-2
    cover: "arr == [1, 2, 3, 4, 3, 2, 2] && outcome == 0 && changes == 1"

  - id: RB-EX-3-S
    req: R-EX-3
    cover: "arr == [1, 2, 3, 2, 1] && outcome == 0 && changes == 0"

unformalized:
  - req: R-FN-1
    reason: >-
      Non-functional: it asks for the deliverable (a complete implementation
      with the given signature and docstring), not for a behaviour of a call.
      The behaviour of the completed function is realized by RB-CH-1 and
      RB-CH-2 (an incomplete body such as `pass` returns None, outcome 2, and
      breaks RB-CH-2); the presence of the docstring is not observable on the
      trace.
    covered_by: [RB-CH-1, RB-CH-2]
  - req: R-FN-2
    reason: >-
      Non-functional: the adapter fixes the name candidate and the single
      argument arr. A function with another name or arity makes every call
      raise (outcome 1), which RB-CH-2 forbids.
    covered_by: [RB-CH-2]
  - req: R-DEF-2
    reason: >-
      A definition: it fixes what one change is (the value of one element is
      replaced, the length is unchanged, no insertion, deletion or swap). It
      determines that the minimum number of changes is the number of differing
      mirrored pairs, the model count mism checked by RB-CH-1. Both flagged
      phrases leave that minimum unchanged, so no formula depends on them.
      "Any other element" is taken literally as the value of another element
      of the array (reading 2), since the docstring uses "element" only for
      array members; a differing pair is still repaired in one change by
      copying the mirror element's value. "Change" is read as giving the
      element a different value (reading 1); a minimal solution never makes a
      no-op replacement, so this too leaves the count unchanged.
    covered_by: [RB-CH-1, RB-DEF-1]
  - req: R-FR-1
    reason: >-
      Frame rule of the function adapter; it is added to every formalization
      set from design.yaml (F-ZERO, `outcome != 0 -> changes == 0`) and need
      not be restated (frame.md).
    covered_by: [F-ZERO]

decisions:
  - {req: R-IN-1, phrase: "an array arr of integers", reading: 1}
  - {req: R-CH-1, phrase: "the number of elements that need to be changed", reading: 1}
  - {req: R-CH-1, phrase: "to make the array palindromic", reading: 1}
  - {req: R-CH-2, phrase: "find the number", reading: 1}
  - {req: R-DEF-1, phrase: "read the same backwards and forwards", reading: 1}
  - {req: R-DEF-2, phrase: "any other element", reading: 2}
  - {req: R-DEF-2, phrase: "In one change, you can change one element", reading: 1}
  - {req: R-EX-1, phrase: "== 4", reading: 1}
  - {req: R-EX-2, phrase: "== 1", reading: 1}
