fcp: '0.1'
design: code_palindrome_changes
summary: A Python function on a list of integers treated as a chip without memory. Each cycle is one call of candidate(arr); the argument is an input list of at most 8 integers, the returned integer and the way the call ended are outputs. The prompt is the specification, and code written by AI models is checked by running it.
docs:
- {id: SPEC, path: spec.md, title: 'Prompt: number of changes to make an array palindromic'}
- {id: FRAME, path: frame.md, title: 'FCP function adapter, version 0.2'}
interface:
  clock: clk
  reset: {name: rst_n, active_low: true, synchronous: true}
  signals:
  - {name: clk, dir: in, width: 1}
  - {name: rst_n, dir: in, width: 1}
  - {name: arr, dir: in, width: 8, length: 8, desc: 'the arr argument: a list of at most 8 integers, 0 to 255'}
  - {name: outcome, dir: out, width: 2, desc: 'how the call ended: 0 returned an integer that fits, 1 exception or no answer, 2 returned anything else'}
  - {name: changes, dir: out, width: 4, desc: 'the returned integer (outcome 0), 0 to 15'}
environment: {initial_reset: true, reset_anytime: false, bmc_depth: 3, cover_depth: 3}
frame:
- {id: F-ZERO, req: R-FR-1, expr: 'outcome != 0 -> changes == 0'}
function:
  name: candidate
  args:
  - {name: arr, signal: arr, type: list}
  returns: {signal: changes, type: int}
  outcome: {signal: outcome, raises: []}
  scope:
    arr: {elements: [0, 1, 2, 3, 254, 255], random: 3000, values: [[], [1], [1, 2], [1, 2, 1], [1, 2, 3, 4, 3, 2, 2]]}
