fcp: "0.1"
set: agent_b
origin: {kind: agent, role: formalizer, id: agent_b}

# Specification model. The function keeps no state between calls (frame.md),
# so the model is a combinational function of the argument: the defs below
# compute the expected answer of every call, and every output is checked
# against it.
defs:
  # the final character of txt, even if it is a space (0 when txt is empty)
  last: 'txt[len(txt) - 1]'
  # the character just before the final one (0 when txt has fewer than 2 characters)
  before: 'txt[len(txt) - 2]'
  is_empty: 'len(txt) == 0'
  # the final character is one of the 52 ASCII letters
  last_alpha: 'len(txt) >= 1 && isalpha(last)'
  # the final character belongs to a word: a run of at least two non-space
  # characters, delimited by the space character (code 32) or the ends of txt
  last_in_word: 'len(txt) >= 2 && last != " " && before != " "'
  # expected return value of the call
  want_true: 'last_alpha && !last_in_word'
  # the call returned the bool True / the bool False
  ret_true: 'outcome == 0 && result'
  ret_false: 'outcome == 0 && !result'

properties:
  - id: RB-RET-1
    req: R-RET-1
    pattern: invariant
    args: {cond: 'outcome == 0'}
    note: >-
      Every call, including the empty string, ends by returning True or False
      (outcome 0): no exception, no non-termination, no value of another type.
      Reading taken for "returns True": the Python bool values exactly, so a
      truthy/falsy value of another type (outcome 2) violates this.

  - id: RB-LAST1-1
    req: R-LAST-1
    pattern: implies
    args: {trigger: 'want_true', cond: 'ret_true'}
    note: >-
      If the final character of txt (even a space) is an ASCII letter and the
      space-separated group it ends is that single character (txt has length
      1, or the character before it is a space), the call returns True.
      Readings: "the last character" = the final character, even if a space;
      "an alphabetical character" = the 52 ASCII letters only (so a final
      Latin-1 letter such as \xE9 or \xDF is not alphabetical); "is not a part
      of a word" = the last space-separated group is exactly that one
      character, so the one-character string "e" gives True. The literal Note
      (any group, even of one character, is a word) would make the result
      never True and contradicts the example "apple pi e" -> True; the
      example-consistent reading that a word has at least two characters is
      taken (see R-WORD-1 decisions).

  - id: RB-LAST2-1
    req: R-LAST-2
    pattern: implies
    args: {trigger: 'is_empty', cond: 'ret_false'}
    note: >-
      Empty txt returns False. Reading taken for "otherwise": it covers every
      string that does not meet the True condition, including the empty
      string, which has no last character.

  - id: RB-LAST2-2
    req: R-LAST-2
    pattern: implies
    args: {trigger: 'len(txt) >= 1 && !isalpha(last)', cond: 'ret_false'}
    note: >-
      A non-empty txt whose final character is not an ASCII letter returns
      False. This includes a trailing space, digits, punctuation, control
      characters and Latin-1 letters (codes 128-255), per the ASCII-only
      reading of "alphabetical character".

  - id: RB-LAST2-3
    req: R-LAST-2
    pattern: implies
    args: {trigger: 'last_in_word', cond: 'ret_false'}
    note: >-
      If the final character is part of a word, i.e. it and the character
      before it are both not the space character (code 32), the call returns
      False. Only the space character separates words (a tab does not), and
      any non-space character (letter, digit, punctuation) belongs to a word,
      so "1e" and "x.e" return False.

  - id: RB-EX1-P
    req: R-EX-1
    pattern: implies
    args: {trigger: 'txt == "apple pie"', cond: 'ret_false'}
    note: The example is a statement about every call with this argument, so it is also stated as a property.

  - id: RB-EX2-P
    req: R-EX-2
    pattern: implies
    args: {trigger: 'txt == "apple pi e"', cond: 'ret_true'}
    note: >-
      Reading taken: the example is correct, a lone letter between spaces is
      not part of a word (a word needs at least two characters), overriding
      the most literal reading of the Note.

  - id: RB-EX3-P
    req: R-EX-3
    pattern: implies
    args: {trigger: 'txt == "apple pi e "', cond: 'ret_false'}
    note: With a trailing space the final character is the space, which is not alphabetical.

  - id: RB-EX4-P
    req: R-EX-4
    pattern: implies
    args: {trigger: 'len(txt) == 0', cond: 'ret_false'}

scenarios:
  - id: RB-EX1-S
    req: R-EX-1
    cover: 'txt == "apple pie" && ret_false'
  - id: RB-EX2-S
    req: R-EX-2
    cover: 'txt == "apple pi e" && ret_true'
  - id: RB-EX3-S
    req: R-EX-3
    cover: 'txt == "apple pi e " && ret_false'
  - id: RB-EX4-S
    req: R-EX-4
    cover: 'len(txt) == 0 && ret_false'

unformalized:
  - req: R-API-1
    reason: >-
      The name and parameter list of the Python function are fixed by the
      adapter (design.yaml `function` section), which only calls
      check_if_last_char_is_a_letter(txt); they are not a property of the
      trace and cannot be stated in FCP-PL.
  - req: R-IN-1
    reason: >-
      Holds by construction of the interface encoding: txt is a sequence
      signal, so every call in the trace passes a string (at most 32
      characters, codes 0-255), and calls with arguments of another type are
      not part of the trace (frame.md). No environment constraint is left to
      state; an assumption would be a tautology.
  - req: R-WORD-1
    reason: >-
      Definition. Realized by the def `last_in_word` (a word is a run of at
      least two non-space characters delimited by the space character or the
      ends of txt) used in the properties below.
    covered_by: [RB-LAST1-1, RB-LAST2-3, RB-EX2-P]
  - req: R-FR-1
    reason: >-
      Frame rule F-ZERO of design.yaml (outcome != 0 -> !result) is added to
      every formalization set by the adapter and need not be restated
      (frame.md).
    covered_by: [F-ZERO]

decisions:
  - {req: R-RET-1, phrase: "returns True", reading: 1}
  - {req: R-LAST-1, phrase: "an alphabetical character", reading: 1}
  - {req: R-LAST-1, phrase: "is not a part of a word", reading: 1}
  - {req: R-LAST-1, phrase: "the last character", reading: 1}
  - {req: R-LAST-2, phrase: "otherwise", reading: 1}
  - {req: R-WORD-1, phrase: "a group of characters", reading: 2}
  - {req: R-WORD-1, phrase: "separated by space", reading: 1}
  - {req: R-WORD-1, phrase: "group of characters", reading: 1}
  - {req: R-EX-2, phrase: "(\"apple pi e\") ➞ True", reading: 1}
