    - "The last non-space character of txt; the example candidate(\"apple pi e \") \u279E False contradicts this reading, since the last non-space 'e' stands alone."
    - 'A position supplied by the caller; the signature def candidate(txt): has no parameter for it, so this contradicts the signature and the position is unspecified.'
  - phrase: an alphabetical character
    readings:
    - 'An ASCII letter only: A to Z or a to z.'
    - "Any character for which Python's str.isalpha() is true, which in Latin-1 also includes letters such as '\xE9' (233), '\xDF' (223), '\xAA' (170) and '\xB5' (181)."
  - phrase: is not a part of a word
    readings:
    - 'The character stands alone: every neighbouring character that exists (before and after it) is a space, i.e. it forms a one-character group; for the last character this means txt has length 1 or the
      character before it is a space.'
    - 'The character is preceded by a space: a character at the very start of txt (e.g. txt == ''e'') does not qualify, because there is no space before it.'
    - "Literally, the character belongs to no space-separated group of characters; since every non-space character belongs to some group (by the definition of 'word'), the condition can never hold and the\
      \ function always returns False, contradicting the example candidate(\"apple pi e\") \u279E True."
  lines:
