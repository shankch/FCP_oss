- id: R-EX-2
  doc: SPEC
  quote: "candidate(\"apple pi e\") \u279E True"
  text: candidate("apple pi e") returns True.
  kind: scenario
  ambiguity:
  - phrase: "candidate(\"apple pi e\") \u279E True"
    readings:
    - 'The example is authoritative: a lone letter separated by spaces (here the final ''e'') is not part of a word, so a one-character group does not count as a word.'
    - 'The definition of ''word'' (a group of characters separated by space) is authoritative: the final ''e'' is a one-character word, so it is part of a word and the expected value would be False; the
      example contradicts the definition.'
