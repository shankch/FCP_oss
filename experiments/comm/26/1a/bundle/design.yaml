fcp: '0.1'
design: review
summary: A Python function on lists treated as a chip without memory. Each cycle is one call of candidate(numbers); the argument is an input list of at most 8 integers, the returned list and the way the call ended are outputs. The prompt is the specification, and code written by AI models is checked by running it.
docs:
- {id: SPEC, path: spec.md, title: 'Prompt: candidate(numbers) on a list of integers'}
- {id: FRAME, path: frame.md, title: 'FCP function adapter for lists, version 0.1'}
interface:
  clock: clk
  reset: {name: rst_n, active_low: true, synchronous: true}
  signals:
  - {name: clk, dir: in, width: 1}
  - {name: rst_n, dir: in, width: 1}
  - {name: numbers, dir: in, width: 8, length: 8, desc: 'the numbers argument: a list of at most 8 integers, 0 to 255'}
  - {name: outcome, dir: out, width: 2, desc: 'how the call ended: 0 returned a list that fits, 1 any exception or no answer, 2 returned anything else'}
  - {name: result, dir: out, width: 8, length: 8, desc: 'the returned list (outcome 0), at most 8 integers, 0 to 255'}
environment: {initial_reset: true, reset_anytime: false, bmc_depth: 3, cover_depth: 3}
frame:
- {id: F-EMPTY, req: R-FR-1, expr: 'outcome != 0 -> len(result) == 0'}
function:
  name: candidate
  args:
  - {name: numbers, signal: numbers, type: list}
  returns: {signal: result, type: list}
  outcome: {signal: outcome, raises: []}
  scope:
    numbers: {elements: [0, 1, 2, 3, 4, 5], random: 3000, values: [[1, 2, 3, 2, 4]]}
