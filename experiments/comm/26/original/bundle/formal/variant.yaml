fcp: '0.1'
set: variant
origin: {kind: agent, role: formalizer, id: variant}

properties:
- id: RV-SIG-1
  req: R-SIG-1
  expr: >-
    outcome == 0 ->
    len(result) == count(i < len(numbers): !any(j < i: numbers[j] == numbers[i])) &&
    all(i < len(numbers): !any(j < i: numbers[j] == numbers[i]) ->
      result[count(j < i: !any(k < j: numbers[k] == numbers[j]))] == numbers[i])
  note: >-
    Reading imposed for "remove_duplicates" (decision reading 2): the name states the behaviour,
    duplicates are removed so that each value is kept once, as its first occurrence, so the returned
    list is exactly the first occurrences of numbers in their order ([1, 2, 3, 2, 4] gives
    [1, 2, 3, 4]). This contradicts the docstring sentence of R-RM-1 and the example of R-EX-1; it is
    stated as given, not repaired. The signature itself (name remove_duplicates, one argument numbers)
    is fixed by the function section of design.yaml and is not a trace property. Guarded by
    outcome == 0 because of the reading imposed for "-> List[int]" (R-SIG-2, reading 2): raising is
    not excluded, so the behaviour constrains only a returned list. Together with RV-ORD-1 (positions
    kept, imposed reading of R-ORD-1) a returned list is possible only when every repeated occurrence
    comes after all first occurrences; on other inputs, including [1, 2, 3, 2, 4], the set leaves only
    a raised exception (outcome 1).
- id: RV-SIG-2
  req: R-SIG-2
  expr: outcome != 2
  note: >-
    Reading imposed for "-> List[int]" (decision reading 2): the annotation only describes the type of
    the value when the function returns; raising an exception (or not finishing, outcome 1) on some
    inputs is not excluded. Formalized as: the call never returns something other than a list of
    integers (outcome 2). Outcome 2 also covers a returned list of integers longer than 8 or with
    elements outside 0..255, which the annotation alone does not exclude; for arguments of at most 8
    elements in 0..255 such a list could not come from removing elements (R-RM-3), so this is not a
    further restriction in intent, but it is slightly stronger than the annotation read in isolation.
- id: RV-RM-1
  req: R-RM-1
  expr: >-
    outcome == 0 ->
    all(i < len(numbers): count(j < len(numbers): numbers[j] == numbers[i]) > 1 ->
      count(k < len(result): result[k] == numbers[i]) == 1)
  note: >-
    Reading imposed for "remove all elements that occur more than once" (decision reading 2): only the
    repeated (extra) occurrences are removed, so each value that occurs more than once in numbers is
    kept exactly once in the returned list (the reading suggested by the name remove_duplicates,
    R-SIG-1 reading 2). This contradicts the literal docstring sentence, the requirement text written
    for R-RM-1 ("No value that occurs more than once ... occurs in the returned list") and the example
    of R-EX-1. Reading imposed for "From a list of integers, remove" (decision reading 2): the elements
    are deleted from the given list in place and that list is returned; the trace records the argument
    as passed and the contents of the returned list only, so the mutation of the argument and the
    identity of the returned object are not observable and add no constraint here; what remains
    observable (the result is numbers with elements deleted) is stated by RV-RM-3 and RV-ORD-1.
    Guarded by outcome == 0 (R-SIG-2 reading 2: raising is not excluded).
- id: RV-RM-2
  req: R-RM-2
  expr: >-
    outcome == 0 ->
    all(i < len(numbers): count(j < len(numbers): numbers[j] == numbers[i]) == 1 -> numbers[i] in result)
  note: >-
    Only elements that occur more than once are removed, so every value that occurs exactly once in
    numbers is in the returned list. Guarded by outcome == 0 because of the reading imposed for
    "-> List[int]" (R-SIG-2, reading 2): raising is not excluded, so the requirement constrains only a
    returned list.
- id: RV-RM-3
  req: R-RM-3
  expr: >-
    outcome == 0 ->
    all(k < len(result): count(j < len(result): result[j] == result[k]) <=
      count(j < len(numbers): numbers[j] == result[k]))
  note: >-
    The returned list is obtained from numbers only by removing elements: no value occurs in it more
    often than in numbers (so no value absent from numbers occurs in it). The quote "From a list of
    integers, remove" is the phrase flagged under R-RM-1; under its imposed reading (reading 2, in-place
    deletion from the given list, which is then returned) the in-place aspect is not observable in the
    trace, and the observable content is this multiset bound. Guarded by outcome == 0 (R-SIG-2
    reading 2: raising is not excluded).
- id: RV-ORD-1
  req: R-ORD-1
  expr: >-
    outcome == 0 ->
    all(i < len(numbers): !any(j < i: numbers[j] == numbers[i]) ->
      i < len(result) && result[i] == numbers[i])
  note: >-
    Reading imposed for "Keep order of elements left the same as in the input" (decision reading 2):
    the remaining elements keep their original positions (indices) in the list, not merely their
    relative order. Reading imposed for "elements left" (decision reading 2): under the deduplicating
    reading of R-RM-1 and R-SIG-1, the element kept for a value is its first occurrence in numbers.
    Formalized literally: for each first occurrence at index i of numbers, the returned list has an
    element at index i and it equals numbers[i]. Since removing (in place, R-RM-1 reading 2) an element
    shifts every later element down, this can hold for a returned list only when no removed element
    precedes a kept one; with RV-SIG-1, RV-RM-1 and RV-RM-3 it rules out a returned list on inputs such
    as [1, 1, 2] or [1, 2, 3, 2, 4] and contradicts the [1, 2, 3, 4] of RV-EX-1. This conflict comes from
    the imposed readings and is stated, not repaired. Guarded by outcome == 0 (R-SIG-2 reading 2:
    raising is not excluded).

scenarios:
- id: RV-EX-1
  req: R-EX-1
  cover: 'numbers == [1, 2, 3, 2, 4] && outcome == 0 && result == [1, 2, 3, 4]'
  note: >-
    Reading imposed for "[1, 3, 4]" (decision reading 2): the example contradicts the function name
    remove_duplicates of R-SIG-1, under which the call returns [1, 2, 3, 4]; the scenario therefore
    covers the call remove_duplicates([1, 2, 3, 2, 4]) returning [1, 2, 3, 4], not the [1, 3, 4] printed
    in the docstring. Under the imposed reading of R-ORD-1 (original positions kept, RV-ORD-1) a
    returned list on this call would need 4 at index 4, so this scenario is unreachable together with
    RV-ORD-1; the contradiction is in the imposed readings and is left visible.

unformalized:
- req: R-TASK-1
  reason: >-
    Non-functional: the deliverable is the body of the given function with its signature kept. The
    signature is fixed by the function section of design.yaml; the behaviour is stated by the
    guarantees of the other requirements.
  covered_by: [RV-SIG-1, RV-SIG-2, RV-RM-1, RV-RM-2, RV-RM-3, RV-ORD-1, RV-EX-1]
- req: R-IN-1
  reason: >-
    Holds by construction of the interface: the signal numbers is a list of at most 8 integers from 0
    to 255 and calls with other arguments are not part of the trace (frame.md, Inputs), so the
    environment obligation needs no assumption.
- req: R-FR-1
  reason: >-
    Frame rule F-EMPTY of design.yaml (outcome != 0 -> len(result) == 0); frame items are part of every
    formalization set by construction and need not be restated (frame.md, Frame rules).

decisions:
- {req: R-SIG-1, phrase: remove_duplicates, reading: 2}
- {req: R-SIG-2, phrase: '-> List[int]', reading: 2}
- {req: R-RM-1, phrase: remove all elements that occur more than once, reading: 2}
- {req: R-RM-1, phrase: 'From a list of integers, remove', reading: 2}
- {req: R-ORD-1, phrase: Keep order of elements left the same as in the input, reading: 2}
- {req: R-ORD-1, phrase: elements left, reading: 2}
- {req: R-EX-1, phrase: '[1, 3, 4]', reading: 2}
