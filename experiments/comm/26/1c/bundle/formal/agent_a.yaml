fcp: "0.1"
set: agent_a
origin: {kind: agent, role: formalizer, id: agent_a}

defs:
  # the call returned a list that fits the result signal
  returned: "outcome == 0"
  # some value occurs at two or more positions of numbers (R-DEF-1, reading 1)
  has_repeated: "any(i < len(numbers): count(j < len(numbers): numbers[j] == numbers[i]) >= 2)"
  # some value occurs at exactly one position of numbers
  has_single: "any(i < len(numbers): count(j < len(numbers): numbers[j] == numbers[i]) == 1)"

properties:
  - id: RA-IF-3
    req: R-IF-3
    expr: "outcome == 0"
    note: >-
      Reading 1 of '-> List[int]': every call on a valid argument returns
      normally with a list of integers, so it never raises, hangs or returns
      another type. The trace cannot tell 'another type' apart from 'a list of
      integers that does not fit' (longer than 8, negative, above 255); both
      are outcome 2. A list that does not fit would break R-RM-3, because its
      values must come from numbers and it can be no longer than numbers. So
      requiring outcome 0 rules out nothing that the specification permits.

  - id: RA-RM-1
    req: R-RM-1
    pattern: implies
    args:
      trigger: "returned && has_repeated"
      cond: "all(i < len(numbers): count(j < len(numbers): numbers[j] == numbers[i]) >= 2 -> !(numbers[i] in result))"
    note: >-
      Most literal reading (reading 1) of 'remove all elements that occur more
      than once': every element whose value occurs two or more times in
      numbers is removed, so no such value appears in the returned list. This
      CONTRADICTS the docstring example R-EX-1 (formalized as written in
      RA-EX-1): for [1, 2, 3, 2, 4] this reading requires [1, 3, 4]. The
      contradiction is left in the set on purpose, not repaired. 'Occur more
      than once' is counted over all positions, adjacent or not (R-DEF-1,
      reading 1). Like the other items about the result, this one speaks only
      of calls that returned a list; whether the function must return is
      RA-IF-3.

  - id: RA-RM-2
    req: R-RM-2
    pattern: implies
    args:
      trigger: "returned && has_single"
      cond: "all(i < len(numbers): count(j < len(numbers): numbers[j] == numbers[i]) == 1 -> count(k < len(result): result[k] == numbers[i]) == 1)"
    note: >-
      Only elements that occur more than once are removed, so every value that
      occurs exactly once in numbers occurs exactly once in the returned list.

  - id: RA-RM-3-VAL
    req: R-RM-3
    pattern: implies
    args:
      trigger: "returned"
      cond: "all(k < len(result): result[k] in numbers)"
    note: >-
      Elements are only removed, never introduced: every element of the
      returned list equals some element of numbers. On the phrase 'From a list
      of integers, remove', reading 2 (remove from the given list in place and
      return it) is taken as the more literal wording. The trace cannot tell
      it from reading 1 (build a new list), because numbers is the argument as
      passed. Both readings give the same constraint on result.

  - id: RA-RM-3-LEN
    req: R-RM-3
    pattern: implies
    args:
      trigger: "returned"
      cond: "len(result) <= len(numbers)"
    note: "Removing elements cannot make the list longer: the returned list is never longer than numbers."

  - id: RA-ORD-1
    req: R-ORD-1
    pattern: implies
    args:
      trigger: "returned && len(result) >= 2"
      cond: "all(a < len(result): all(b < len(result): a < b && count(i < len(numbers): numbers[i] == result[a]) == 1 && count(i < len(numbers): numbers[i] == result[b]) == 1 -> any(i < len(numbers): numbers[i] == result[a] && any(j < len(numbers): i < j && numbers[j] == result[b]))))"
    note: >-
      Reading 3 of 'Keep order of elements left the same as in the input':
      order is fixed only for elements whose value occurs exactly once in
      numbers, since each such value has one input position. Any two of them
      appear in the returned list in the same relative order as in numbers.
      The text names no position for a value kept from several occurrences,
      so none is imposed (no first-occurrence rule is borrowed from the
      disputed example). Under the literal R-RM-1 (RA-RM-1) no repeated value
      is kept, so this reading fixes the order of every element left.

scenarios:
  - id: RA-EX-1
    req: R-EX-1
    cover: "numbers == [1, 2, 3, 2, 4] && outcome == 0 && result == [1, 2, 3, 4]"
    note: >-
      The docstring example, formalized exactly as written. Decision reading 2:
      the example contradicts R-RM-1 read literally (RA-RM-1), under which this
      call must return [1, 3, 4]. The example is not dropped or rewritten, and
      R-RM-1 is not weakened to fit it. This scenario is therefore expected to
      be unreachable together with RA-RM-1, and the consistency check should
      report {RA-RM-1, RA-EX-1} as a conflicting set, which is a genuine
      contradiction in the specification.

unformalized:
  - req: R-FR-1
    reason: >-
      Frame rule of the function adapter. design.yaml carries it as frame item
      F-EMPTY, which is added to every formalization set; frame.md says it
      need not be restated.
    covered_by: [F-EMPTY]
  - req: R-IF-1
    reason: >-
      Non-functional: 'Complete this function' describes the deliverable, not
      a behaviour of a call. Its observable consequence, a function that
      returns a list on every call (not a stub that raises or returns None),
      is RA-IF-3.
    covered_by: [RA-IF-3]
  - req: R-IF-2
    reason: >-
      Interface definition (name remove_duplicates, one argument numbers that
      is a list of integers). It is fixed by the function and interface
      sections of design.yaml and is not a property of the trace. A function
      with another name or signature cannot be called by the adapter, so every
      call ends with outcome 1, which RA-IF-3 forbids.
    covered_by: [RA-IF-3]
  - req: R-IN-1
    reason: >-
      Environment obligation already enforced by the interface encoding:
      numbers is a sequence signal of integers (at most 8, each 0 to 255), and
      frame.md excludes any other argument from the trace. No assumption beyond
      the encoding is needed, and one would be a tautology.
  - req: R-DEF-1
    reason: >-
      Definition with no behaviour of its own. Reading 1 ('occurs more than
      once' = equal to the elements at two or more positions of numbers,
      adjacent or not) is written inline as count(j < len(numbers):
      numbers[j] == numbers[i]) >= 2 (and == 1 for 'exactly once') in the
      items that use it, and in the defs has_repeated and has_single.
    covered_by: [RA-RM-1, RA-RM-2, RA-ORD-1]

decisions:
  - {req: R-IF-3, phrase: "-> List[int]", reading: 1}
  - {req: R-DEF-1, phrase: "occur more than once", reading: 1}
  - {req: R-RM-1, phrase: "remove all elements that occur more than once", reading: 1}
  - {req: R-RM-3, phrase: "From a list of integers, remove", reading: 2}
  - {req: R-ORD-1, phrase: "Keep order of elements left the same as in the input", reading: 3}
  - {req: R-EX-1, phrase: "[1, 2, 3, 4]", reading: 2}
