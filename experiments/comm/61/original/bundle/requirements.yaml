- id: R-EX-4
  doc: SPEC
  quote: '>>> correct_bracketing(")(()") False'
  text: Calling correct_bracketing(")(()") returns False.
  kind: scenario
  depends:
  - R-RES-1
  - R-RES-2
  ambiguity:
  - phrase: correct_bracketing(")(()") False
    readings:
    - 'Consistent with R-RES-1 under order-sensitive matching: the ")" at position 0 closes nothing and the "(" at position 1 is never closed, so the string is not correctly bracketed.'
    - 'CONTRADICTION with R-RES-1 under order-insensitive matching ("corresponding closing bracket" = any ")" anywhere): both "(" can be paired with the two ")", so R-RES-1 would require True, while this
      example requires False.'
