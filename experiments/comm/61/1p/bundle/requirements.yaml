- id: R-DEF-1
  doc: SPEC
  quote: 'def correct_bracketing(brackets: str):'
  text: 'A string of ''('' and '')'' is correctly bracketed when every ''('' is matched by a later '')'' and every '')'' by an earlier ''('': scanning left to right, the number of '')'' never exceeds the
    number of ''('' seen so far, and both numbers are equal at the end.'
  kind: definition
  ambiguity:
  - phrase: correct_bracketing
    readings:
    - 'properly nested: no prefix has more '')'' than ''('' and the totals are equal (")(" is not correct)'
    - equal numbers of '(' and ')' only, regardless of order (")(" is correct)
    - every '(' has a matching later ')', while unmatched ')' are allowed ("())" is correct)
  - phrase: 'correct_bracketing(brackets: str)'
    readings:
    - the empty string is correctly bracketed (no unmatched bracket)
    - the empty string is not correctly bracketed (there are no brackets to match)
    - the empty string is outside the input contract (see R-IN-1)
  lines:
  - 4
