properties:
  - id: RA-RET-1
    req: R-RET-1
    pattern: implies
    args: {trigger: "n_valid", cond: "outcome == 0"}
    note: >-
      For every call with n > 1 and n not a prime, the call returns an integer that fits
      factor (outcome 0): no exception, no hang, no other kind of result. Calls outside
      that domain are unconstrained (R-ENV-1, R-ENV-2). Any prime factor of n is at most
      n <= 65535, so a correct answer always fits.

  - id: RA-FAC-1
    req: R-FAC-1
    pattern: implies
    args: {trigger: "n_valid && outcome == 0", cond: "f_divides"}
    note: >-
      The returned integer divides n exactly. The trigger includes outcome == 0 because
      "the integer returned" presupposes a return, which R-RET-1 requires separately; a
      call that raises is charged to R-RET-1 only. n % factor is not allowed in FCP-PL
      (variable divisor), so divisibility is stated as n == q * factor with q <= 255, or
      factor <= 255 and bit factor of n_divs set.

  - id: RA-FAC-2
    req: R-FAC-2
    pattern: implies
    args: {trigger: "n_valid && outcome == 0", cond: "f_prime"}
    note: >-
      The returned integer is a prime: greater than 1 and not divisible by any prime
      below it; testing the primes up to 251 is enough below 65536. Same trigger as
      RA-FAC-1.

  - id: RA-FAC-3
    req: R-FAC-3
    pattern: implies
    args: {trigger: "n_valid && outcome == 0", cond: "f_smallest || f_largest"}
    note: >-
      Reading 1 of "the smallest or largest prime factor": on every call independently
      the returned integer is the smallest or the largest prime factor of n; a prime
      factor strictly between them is not allowed. No convention linking calls is
      required (the function keeps no state and the text names none), and neither option
      is excluded by this item. The example candidate(13195) -> 29 is formalized
      separately as a required output (RA-EX-1), so in this set the "smallest" option is
      overridden at n = 13195 only; that is the reading taken for the contradiction
      phrase (reading 2). For a prime power both options coincide.

  - id: RA-EX-1
    req: R-EX-1
    pattern: implies
    args: {trigger: "n == 13195", cond: "outcome == 0 && factor == 29"}
    note: >-
      Most literal reading of the doctest ">>> candidate(13195)" followed by "29": it
      states the value of that call, so it is a required output, not only a possible one
      (reading 2). 13195 = 5 * 7 * 13 * 29, so this rules out 5, the smallest prime
      factor, although "smallest or largest" allows it. Only n = 13195 is pinned; it is
      not extended to a "largest" convention for other n, since R-FAC-3 is read without
      a convention. 29 itself is allowed by R-FAC-3 (it is the largest prime factor).

  - id: RA-EX-2
    req: R-EX-2
    pattern: implies
    args: {trigger: "n == 2048", cond: "outcome == 0 && factor == 2"}
    note: >-
      Doctest read as a required output, like RA-EX-1. 2048 = 2^11, so 2 is both its
      smallest and its largest prime factor and RA-FAC-3 already forces this answer.

scenarios:
  - id: RA-EX-1-S
    req: R-EX-1
    cover: "n == 13195 && outcome == 0 && factor == 29"
    note: >-
      The example as a behaviour that must be possible: candidate(13195) returns 29. With
      RA-EX-1 it is also the only allowed behaviour for that call.

  - id: RA-EX-2-S
    req: R-EX-2
    cover: "n == 2048 && outcome == 0 && factor == 2"
    note: "The example as a behaviour that must be possible: candidate(2048) returns 2."

dont_cares:
  - id: RA-ENV-1-OUT
    req: R-ENV-1
    signal: outcome
    when: "n <= 1"
    note: >-
      Reading 1 of "Assume n > 1": for n <= 1 (n = 0 or 1 in the trace) nothing is
      required; an exception, no answer or any value is acceptable. The guarantees
      exclude these calls through the n > 1 conjunct of n_valid in their triggers.
      This is not an `assumptions` entry because frame.md lets the checker call with
      any n from 0 to 65,535 in any order, and an assumption that fails once would (IR
      section 6) also void the guarantees on every later call, whereas the requirement
      only limits the guarantees to the calls with n > 1.

  - id: RA-ENV-1-FAC
    req: R-ENV-1
    signal: factor
    when: "n <= 1"
    note: "For n <= 1 the returned value is free too (reading 1), subject only to the frame rule F-ZERO."

  - id: RA-ENV-2-OUT
    req: R-ENV-2
    signal: outcome
    when: "n_prime"
    note: >-
      Reading 1 of "is not a prime": for a prime n nothing is required; in particular the
      function need not return n, although n would be its smallest and largest prime
      factor. Same encoding as R-ENV-1: the guarantees exclude prime n through the
      !n_prime conjunct of n_valid, and the outputs are declared free here.

  - id: RA-ENV-2-FAC
    req: R-ENV-2
    signal: factor
    when: "n_prime"
    note: "For a prime n the returned value is free too (reading 1), subject only to the frame rule F-ZERO."

unformalized:
  - req: R-GEN-1
    reason: >-
      Non-functional: it states the deliverable (complete the body of candidate, keeping
      its name and signature). It is not a property of a trace of calls; the adapter
      (design.yaml, function section) fixes the function name and its single argument.
  - req: R-ARG-1
    reason: >-
      Definition of the interface: the single integer argument n is the input signal n
      (design.yaml; frame.md restricts the trace to 0 <= n <= 65535). It constrains no
      behaviour by itself.
  - req: R-FR-1
    reason: >-
      Frame rule of the function adapter; it is added to every formalization set by
      construction (frame item F-ZERO) and is not restated here.
    covered_by: [F-ZERO]

decisions:
  - {req: R-ENV-1, phrase: "Assume n > 1", reading: 1}
  - {req: R-ENV-2, phrase: "is not a prime", reading: 1}
  - {req: R-FAC-3, phrase: "the smallest or largest prime factor", reading: 1}
  - {req: R-FAC-3, phrase: "smallest or largest (contradiction with the example candidate(13195) -> 29)", reading: 2}
  - {req: R-EX-1, phrase: ">>> candidate(13195) 29", reading: 2}
  - {req: R-EX-1, phrase: "candidate(13195) returns 29 (contradiction with 'the smallest or largest prime factor')", reading: 1}
