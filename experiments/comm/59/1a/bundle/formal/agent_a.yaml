  # n is a prime: n > 1 and no d with 2 <= d < n divides n (a composite n <= 65535
  # has such a divisor d <= 255)
  n_prime: "n > 1 && !any(d < 256: d >= 2 && d < n && n_divs[d])"
  # the calls the guarantees are about: "Assume n > 1 and is not a prime"
  n_valid: "n > 1 && !n_prime"
  # factor is a prime number: greater than 1 and no prime p < factor divides it
  # (a composite factor <= 65535 has a prime divisor p <= 251)
  f_prime: >-
