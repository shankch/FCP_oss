  lines:
  - 9
- id: R-COL-1
  doc: SPEC
  quote: Two cars are said to collide when a car that's moving left to right hits a car that's moving right to left.
  text: A collision is an event in which a car moving left to right meets (hits) a car moving right to left; meetings of two cars moving in the same direction are not collisions.
  kind: definition
  ambiguity:
  - phrase: Two cars are said to collide when a car that's moving left to right hits a car that's moving right to left
    readings:
    - every meeting of a left-to-right car with a right-to-left car counts as a collision, even though neither car is affected by it
    - 'seemingly contradicted by ''as if they did not collide'' (R-COL-2): if the cars pass through each other unaffected, a meeting may not count as a collision at all'
  - phrase: collide
    readings:
    - each pair of one left-to-right car and one right-to-left car collides at most once
    - a collision is counted per meeting event, and the same pair could be counted more than once
  lines:
  - 9
  - 10
- id: R-COL-2
  doc: SPEC
  quote: However, the cars are infinitely sturdy and strong; as a result, they continue moving in their trajectory as if they did not collide.
  text: 'Collisions do not stop, destroy or deflect any car: after a collision both cars continue along their original trajectories at their original speed and direction.'
  kind: definition
  ambiguity:
  - phrase: as if they did not collide
    readings:
    - the cars pass through each other unchanged, and the meeting is still counted as a collision (R-COL-1)
    - 'seemingly contradicts ''Two cars are said to collide'' (R-COL-1): the cars behave as if no collision happened, which could be read as the meeting not being a collision'
  lines:
  - 11
  - 12
