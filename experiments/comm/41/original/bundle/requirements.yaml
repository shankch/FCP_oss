- id: R-CARS-3
  doc: SPEC
  quote: The two sets of cars start out being very far from each other.
  text: Initially the left-to-right set and the right-to-left set are far apart, so that no collision has happened yet at the start.
  kind: definition
  ambiguity:
  - phrase: start out being very far from each other
    readings:
    - every left-to-right car starts to the left of every right-to-left car, so the two sets approach each other and every left-to-right car eventually meets every right-to-left car
    - the sets are only said to be far apart; their relative order is not stated, so they may be moving away from each other and never meet
  - phrase: very far
    readings:
    - far enough that no collision has happened before the start, but at a finite distance, so all meetings happen in finite time
    - infinitely far apart, so that meetings may never actually happen
  lines:
