fcp: '0.1'
design: review
summary: A Python function on integers treated as a chip without memory. Each cycle is one call of fib4(n); the argument is an input, the returned integer and the way the call ended are outputs. The prompt is the specification, and code written by AI models is checked by running it.
docs:
- {id: SPEC, path: spec.md, title: 'Prompt: the fib4 number sequence'}
- {id: FRAME, path: frame.md, title: 'FCP function adapter, version 0.1'}
interface:
  clock: clk
  reset: {name: rst_n, active_low: true, synchronous: true}
  signals:
  - {name: clk, dir: in, width: 1}
  - {name: rst_n, dir: in, width: 1}
  - {name: n, dir: in, width: 6, desc: 'n argument, 0 to 63'}
  - {name: outcome, dir: out, width: 2, desc: 'how the call ended: 0 returned an integer that fits, 1 any exception or no answer, 2 returned anything else'}
  - {name: result, dir: out, width: 57, desc: 'the returned integer (outcome 0)'}
environment: {initial_reset: true, reset_anytime: false, bmc_depth: 6, cover_depth: 6}
frame:
- {id: F-ZERO, req: R-FR-1, expr: 'outcome != 0 -> result == 0'}
function:
  name: fib4
  args:
  - {name: n, signal: n, type: int}
  returns: {signal: result, type: int}
  outcome: {signal: outcome, raises: []}
  scope:
    n: {dense: [0, 63], values: [0, 1, 2, 3, 4, 5, 6, 7]}
