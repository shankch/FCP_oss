    readings:
    - 'fib4(3) is a starting value of the sequence: fib4(3) returns 0, and the Fibonacci-like rule of R-SEQ-1 does not apply to it'
    - the Fibonacci rule of R-SEQ-1 applies from fib4(2) on (each element the sum of the two before it), so fib4(3) would be fib4(2) + fib4(1) = 2, which contradicts the listed value 0
  lines:
  - 9
- id: R-NTH-1
  doc: SPEC
  quote: compute the n-th element of the fib4 number sequence
  text: For every argument n, the call fib4(n) returns the n-th element of the Fib4 number sequence.
  kind: guarantee
  depends:
  - R-SEQ-1
  - R-BASE-1
  - R-BASE-2
  - R-BASE-3
  - R-BASE-4
  ambiguity:
  - phrase: n-th element
    readings:
    - 'elements are counted from 0, as in the list: fib4(n) returns the element the list writes as fib4(n), so fib4(0) is the 0th element'
    - 'elements are counted from 1: the first element is the one written fib4(0), so fib4(n) returns the element written fib4(n-1) and fib4(0) has no element; this conflicts with the listed values read
      as calls (fib4(2) would return 0, not 2)'
  - phrase: the fib4 number sequence
    readings:
    - the sequence extends to every n through the Fibonacci-like rule of R-SEQ-1, so the n-th element exists and must be returned for every n
    - the sequence is only what R-SEQ-1 lists, fib4(0) to fib4(3), so for n >= 4 there is no n-th element and the result is unconstrained; this contradicts the request to compute the n-th element for every
      n
  - phrase: compute
    readings:
    - fib4 returns the element as a Python int (the declared return type is left out, but the elements are integers)
    - fib4 may return any number equal to the element, so a float such as 2.0 also meets the requirement
  lines:
  - 10
- id: R-NF-1
  doc: SPEC
  quote: Please write a function to efficiently compute
  text: fib4 must compute the n-th element efficiently, with a running time that stays small as n grows (not the exponential cost of the naive definition).
  kind: non_functional
  depends:
  - R-NTH-1
  ambiguity:
  - phrase: efficiently
    readings:
    - in time linear in n, e.g. one loop that keeps only the last four elements (O(n) additions, O(1) memory)
    - in time below linear, e.g. matrix exponentiation (O(log n) arithmetic operations)
    - 'no complexity bound is meant: any method is acceptable that finishes promptly for the arguments that are checked'
  lines:
  - 10
- id: R-NF-2
  doc: SPEC
  quote: Do not use recursion.
  text: The implementation of fib4 must not use recursion.
  kind: non_functional
  ambiguity:
  - phrase: recursion
    readings:
    - no function of the implementation may call itself, directly or indirectly; this covers fib4, any helper and memoized recursion (e.g. functools.lru_cache)
    - only fib4 itself must not call itself, directly or indirectly; a recursive helper function is allowed
  lines:
  - 10
- id: R-FR-1
