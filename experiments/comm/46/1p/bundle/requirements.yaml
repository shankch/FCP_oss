- id: R-IF-1
  doc: SPEC
  quote: 'def fib4(n: int):'
  text: The function to implement is a Python function named fib4 that takes one integer argument n; each call fib4(n) is checked on its own.
  kind: definition
  ambiguity:
  - phrase: 'n: int'
    readings:
    - n may be any integer, negative ones included; the prompt defines no element for a negative n, so what fib4 does for n < 0 is left open
    - n is an index into the sequence, so only non-negative integers are valid arguments
  lines:
  - 4
- id: R-IF-2
  doc: SPEC
  quote: 'Complete this function:'
  text: The answer must be a complete, working implementation of the given fib4 stub, keeping its name and its single parameter n.
  kind: non_functional
  lines:
  - 1
- id: R-SEQ-1
  doc: SPEC
  quote: 'The Fib4 number sequence is a sequence similar to the Fibbonacci sequnece that''s defined as follows:'
  text: The Fib4 number sequence is an integer sequence fib4(0), fib4(1), fib4(2), ... that is similar to the Fibonacci sequence and is defined by the values listed after this sentence; the prompt lists
    only fib4(0) to fib4(3) and states no rule for later elements.
  kind: definition
  ambiguity:
  - phrase: similar to the Fibbonacci sequnece
    readings:
    - fib4(0) to fib4(3) are the starting values and every later element is the sum of the four elements before it, fib4(n) = fib4(n-1) + fib4(n-2) + fib4(n-3) + fib4(n-4) for n >= 4 (as the name Fib4 suggests),
      giving 0, 0, 2, 0, 2, 4, 8, 14, 28, 54, 104, ...
    - fib4(0) to fib4(3) are the starting values and every later element is the sum of the two elements before it, as in the Fibonacci sequence, fib4(n) = fib4(n-1) + fib4(n-2) for n >= 4, giving 0, 0,
      2, 0, 2, 2, 4, 6, 10, ...
    - the Fibonacci rule (each element the sum of the two before it) applies from fib4(2) on, as in the Fibonacci sequence; this contradicts the listed values fib4(2) -> 2 (fib4(1) + fib4(0) = 0) and fib4(3)
      -> 0 (fib4(2) + fib4(1) = 2), see R-BASE-3 and R-BASE-4
    - 'only a resemblance is claimed and no rule is given: the four listed values are the whole definition, the elements after fib4(3) are not defined and fib4(n) for n >= 4 is unconstrained; this contradicts
      R-NTH-1, which asks for the n-th element for every n'
  lines:
  - 5
