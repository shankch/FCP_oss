- id: R-DEF-1
  doc: SPEC
  quote: 'The Fib4 number sequence is a sequence similar to the Fibbonacci sequnece that''s defined as follows:'
  text: The Fib4 number sequence is an integer sequence, described as similar to the Fibonacci sequence, that is defined by the four base values and the recurrence listed after this sentence.
  kind: definition
  lines:
  - 5
