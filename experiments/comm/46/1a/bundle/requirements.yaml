  ambiguity:
  - phrase: '>>> fib4(5)'
    readings:
    - 'Contradiction with the recurrence and base values: fib4(5) must return 2 as the example shows, although the base values and the recurrence give -4, 0 or 4 under every choice of signs (4 with all
      ''+'').'
    - 'Contradiction with the recurrence and base values: the example is wrong, and fib4(5) returns the value the base values and the recurrence give, not 2.'
  lines:
  - 12
  - 13
- id: R-EX-2
  doc: SPEC
  quote: '>>> fib4(6) 4'
  text: 'Example: fib4(6) returns 4.'
  kind: scenario
  depends:
  - R-FUN-1
  ambiguity:
  - phrase: '>>> fib4(6)'
    readings:
    - 'Contradiction with the recurrence and base values: fib4(6) must return 4 as the example shows, although the recurrence gives 8 with all ''+'' and 0 with alternating signs, and no fixed choice of
      signs gives both fib4(6) = 4 and fib4(7) = 6.'
    - 'Contradiction with the recurrence and base values: the example is wrong, and fib4(6) returns the value the base values and the recurrence give.'
  lines:
  - 14
  - 15
- id: R-EX-3
  doc: SPEC
  quote: '>>> fib4(7) 6'
  text: 'Example: fib4(7) returns 6.'
  kind: scenario
  depends:
  - R-FUN-1
  ambiguity:
  - phrase: '>>> fib4(7)'
    readings:
    - 'Contradiction with the recurrence and base values: fib4(7) must return 6 as the example shows, although the recurrence gives 14 with all ''+'' and -2 with alternating signs; the only fixed signs
      that give 6 (fib4(n-1) - fib4(n-2) - fib4(n-3) + fib4(n-4)) give fib4(5) = -4 and fib4(6) = 0.'
    - 'Contradiction with the recurrence and base values: the example is wrong, and fib4(7) returns the value the base values and the recurrence give.'
  lines:
  - 16
  - 17
- id: R-FR-1
  doc: FRAME
