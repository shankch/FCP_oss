- id: R-REC-1
  doc: SPEC
  quote: fib4(n) -> fib4(n-1) +/- fib4(n-2) +/- fib4(n-3) +/- fib4(n-4).
  text: For every n >= 4 (every index without a base value; the prompt states no range), fib4(n) equals fib4(n-1), with fib4(n-2), fib4(n-3) and fib4(n-4) each added or subtracted according to the '+/-'
    signs.
  kind: guarantee
  depends:
  - R-DEF-1
  - R-BASE-1
  - R-BASE-2
  - R-BASE-3
  - R-BASE-4
  ambiguity:
  - phrase: +/-
    readings:
    - 'Every ''+/-'' is ''+'': fib4(n) = fib4(n-1) + fib4(n-2) + fib4(n-3) + fib4(n-4), as ''similar to the Fibonacci sequence'' suggests (0, 0, 2, 0, 2, 4, 8, 14, ...).'
    - 'The signs alternate: fib4(n) = fib4(n-1) - fib4(n-2) + fib4(n-3) - fib4(n-4) (0, 0, 2, 0, -2, 0, 0, -2, ...; some elements are negative).'
    - Each '+/-' is a fixed sign, + or -, that the prompt leaves to the implementation; any one fixed combination of the three signs is acceptable.
    - Each '+/-' may be + or - independently for every n; any value obtained by some choice of signs is acceptable.
  - phrase: fib4(n) -> fib4(n-1) +/- fib4(n-2) +/- fib4(n-3) +/- fib4(n-4)
    readings:
    - 'Contradiction with the examples fib4(5) = 2, fib4(6) = 4, fib4(7) = 6: the base values and this recurrence define the sequence and the examples are wrong. From the base values the recurrence gives
      fib4(4) = 2 or -2 and fib4(5) = -4, 0 or 4 under every choice of signs, never 2; with all ''+'' it gives fib4(5) = 4, fib4(6) = 8, fib4(7) = 14.'
    - 'Contradiction with the examples fib4(5) = 2, fib4(6) = 4, fib4(7) = 6: the examples are right and the definition is wrong as stated. The examples fit the all-''+'' recurrence only if fib4(4) = 0,
      which no choice of signs gives from the base values.'
  lines:
  - 10
- id: R-FUN-1
  doc: SPEC
  quote: compute the n-th element of the fib4 number sequence
  text: For a valid argument n, fib4(n) returns the n-th element of the Fib4 number sequence, as an integer.
  kind: guarantee
  depends:
  - R-DEF-1
  - R-BASE-1
  - R-BASE-2
  - R-BASE-3
  - R-BASE-4
  - R-REC-1
  ambiguity:
  - phrase: n-th element
    readings:
    - 'The element with index n, counting fib4(0) as element 0: fib4(n) returns the value the definition gives for fib4(n).'
    - 'The n-th element counting from 1: fib4(n) returns the value the definition gives for index n-1 (with all ''+'' this matches fib4(5) = 2 and fib4(6) = 4 but not fib4(7) = 6, and leaves fib4(0) undefined).'
  lines:
  - 11
- id: R-NF-1
  doc: SPEC
  quote: efficiently compute
  text: The implementation computes the n-th element efficiently.
  kind: non_functional
  ambiguity:
  - phrase: efficiently
    readings:
    - In time linear in n with constant extra memory (an iterative loop that keeps the last four elements).
    - In time linear in n, with any memory (for example a list of every element up to n).
    - In time logarithmic in n (for example by matrix exponentiation).
    - No particular bound; only exponential-time computation (naive recursion) is excluded.
  lines:
  - 11
- id: R-NF-2
  doc: SPEC
  quote: Do not use recursion.
  text: The implementation does not use recursion.
  kind: non_functional
  ambiguity:
  - phrase: recursion
    readings:
    - fib4 must not call itself, directly or through other functions; a recursive helper that does not call fib4 is allowed.
    - No function of the implementation may be recursive, including helpers and memoized (for example lru_cache) recursion.
  lines:
  - 11
