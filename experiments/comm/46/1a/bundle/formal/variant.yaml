assumptions:
  - id: RV-IF-1
    req: R-IF-1
    expr: 'n >= 0'
    note: >-
      Read as instructed (reading 2 of 'n: int'): n is a non-negative index
      into the sequence, which starts at fib4(0), and a negative n is never
      passed. The adapter encodes n as an unsigned 7-bit signal, so this holds
      on every trace; the single int argument is fixed by the interface.

properties:
  - id: RV-BASE-1
    req: R-BASE-1
    expr: 'n == 0 -> outcome == 0 && result == 0'
    note: >-
      Literal: the call fib4(0) returns the integer 0. Affected by the
      instructed reading 2 of 'n-th element' (R-FUN-1): RV-FUN-1 leaves
      fib4(0) undefined, so this is the only item that constrains n = 0.
  - id: RV-BASE-2
    req: R-BASE-2
    expr: 'n == 1 -> outcome == 0 && result == 0'
    note: >-
      Literal: the call fib4(1) returns 0. Under the instructed reading 2 of
      'n-th element', RV-FUN-1 also gives 0 here (the definition's element
      with index 0), so the two items agree.
  - id: RV-BASE-3
    req: R-BASE-3
    expr: 'n == 2 -> outcome == 0 && result == 2'
    note: >-
      Literal: the call fib4(2) returns 2. Affected by the instructed reading
      2 of 'n-th element' (R-FUN-1): RV-FUN-1 requires fib4(2) to return the
      definition's element with index 1, which is 0, so RV-BASE-3 and
      RV-FUN-1 contradict each other at n = 2. Left as stated, not repaired.
  - id: RV-BASE-4
    req: R-BASE-4
    expr: 'n == 3 -> outcome == 0 && result == 0'
    note: >-
      Literal: the call fib4(3) returns 0. Affected by the instructed reading
      2 of 'n-th element' (R-FUN-1): RV-FUN-1 requires fib4(3) to return the
      definition's element with index 2, which is 2, so RV-BASE-4 and
      RV-FUN-1 contradict each other at n = 3. Left as stated, not repaired.
  - id: RV-REC-1
    req: R-REC-1
    expr: 'n >= 5 -> outcome == 0 && result == seq_ex[n]'
    note: >-
      Read as instructed: every '+/-' is '+' (reading 1 of '+/-'), and in the
      contradiction with the examples, the examples are right and the
      definition is wrong as stated (reading 2 of the recurrence phrase). The
      all-'+' recurrence is kept from n = 5 on, where it agrees with the
      examples. Calls are independent, so the recurrence is written in closed
      form: seq_ex is the sequence with base values 0, 0, 2, 0, fib4(4) = 0
      (see RV-REC-2), and fib4(k) = fib4(k-1) + fib4(k-2) + fib4(k-3) +
      fib4(k-4) for k >= 5. That gives 2, 4, 6, 12, 24, ... for n = 5, 6, 7, 8, 9.
      Every value up to n = 127 fits result (below 2^118), so the call must
      return it with outcome 0. Contradicts RV-FUN-1 for every n >= 7 (for
      example fib4(7) = 6 here, 8 there).
  - id: RV-REC-2
    req: R-REC-1
    expr: 'n == 4 -> outcome == 0 && result == 0'
    note: >-
      Read as instructed (reading 2 of the recurrence phrase): the examples
      are right and the definition is wrong as stated. The stated recurrence
      with all '+' would give fib4(4) = 0 + 2 + 0 + 0 = 2. The examples fit
      the all-'+' recurrence only if fib4(4) = 0, so under this reading the
      stated recurrence does not hold at n = 4, and fib4(4) is 0. Agrees with
      RV-FUN-1 at n = 4 (the definition's element with index 3 is 0).
  - id: RV-FUN-1
    req: R-FUN-1
    expr: 'n >= 1 -> outcome == 0 && result == seq_def[n - 1]'
    note: >-
      Read as instructed (reading 2 of 'n-th element'): elements are counted
      from 1, so fib4(n) returns the value the definition gives for index
      n-1, as an integer (outcome 0; every such value fits result). As that
      reading's own wording says ("with all '+' this matches fib4(5) = 2 and
      fib4(6) = 4 but not fib4(7) = 6"), 'the definition' is the one stated:
      base values 0, 0, 2, 0 and the all-'+' recurrence from index 4 (seq_def
      = 0, 0, 2, 0, 2, 4, 8, 14, ...), not the corrected sequence of
      RV-REC-1. n = 0 is left unconstrained here ("leaves fib4(0)
      undefined"). Under this reading the item contradicts RV-BASE-3 (n = 2),
      RV-BASE-4 (n = 3), RV-EX-3 (n = 7) and RV-REC-1 (every n >= 7).
  - id: RV-EX-1
    req: R-EX-1
    expr: 'n == 5 -> outcome == 0 && result == 2'
    note: >-
      Reading 1 of '>>> fib4(5)': the example is right, and fib4(5) must
      return 2. This matches the instructed reading 2 of R-REC-1's recurrence
      phrase (the examples are right). The function is deterministic, so the
      doctest is a guarantee for that call; scenario RV-EX-1-S states that the
      call is possible. Agrees with RV-REC-1 and RV-FUN-1.
  - id: RV-EX-2
    req: R-EX-2
    expr: 'n == 6 -> outcome == 0 && result == 4'
    note: >-
      Reading 1 of '>>> fib4(6)': the example is right, and fib4(6) must
      return 4. This matches the instructed reading 2 of R-REC-1's recurrence
      phrase. A guarantee for that call; scenario RV-EX-2-S states that it is
      possible. Agrees with RV-REC-1 and RV-FUN-1.
  - id: RV-EX-3
    req: R-EX-3
    expr: 'n == 7 -> outcome == 0 && result == 6'
    note: >-
      Reading 1 of '>>> fib4(7)': the example is right, and fib4(7) must
      return 6. This matches the instructed reading 2 of R-REC-1's recurrence
      phrase. A guarantee for that call; scenario RV-EX-3-S states that it is
      possible. Agrees with RV-REC-1 but contradicts RV-FUN-1 under the
      instructed reading 2 of 'n-th element', which gives fib4(7) = 8.

scenarios:
  - id: RV-EX-1-S
    req: R-EX-1
    cover: 'n == 5 && outcome == 0 && result == 2'
    note: >-
      The doctest call fib4(5) returning 2 must be possible (reading 1 of
      '>>> fib4(5)'; see RV-EX-1).
  - id: RV-EX-2-S
    req: R-EX-2
    cover: 'n == 6 && outcome == 0 && result == 4'
    note: >-
      The doctest call fib4(6) returning 4 must be possible (reading 1 of
      '>>> fib4(6)'; see RV-EX-2).
  - id: RV-EX-3-S
    req: R-EX-3
    cover: 'n == 7 && outcome == 0 && result == 6'
    note: >-
      The doctest call fib4(7) returning 6 must be possible (reading 1 of
      '>>> fib4(7)'; see RV-EX-3). Unreachable together with RV-FUN-1 under
      the instructed reading 2 of 'n-th element'.

unformalized:
  - req: R-TASK-1
    reason: >-
      Says what to deliver (complete the body of the given function), not
      how a call behaves. The signature it fixes (one int argument, an
      integer returned) is the adapter's interface encoding.
  - req: R-DEF-1
    reason: >-
      A definition with no behaviour of its own. Its base values and
      recurrence are formalized by the items listed here; seq_def (the
      sequence as stated) and seq_ex (the sequence the examples fit) are its
      closed forms under the instructed readings of R-REC-1.
    covered_by: [RV-BASE-1, RV-BASE-2, RV-BASE-3, RV-BASE-4, RV-REC-1, RV-REC-2]
  - req: R-NF-1
    reason: >-
      Read as instructed (reading 1 of 'efficiently'): time linear in n and
      constant extra memory (an iterative loop that keeps the last four
      elements). Running time and memory are not part of the trace, which
      records only n, result and outcome. The one observable effect, a call
      that never finishes (outcome 1), is already ruled out by the items that
      require outcome 0 (RV-BASE-1 for n = 0, RV-FUN-1 for n >= 1).
  - req: R-NF-2
    reason: >-
      Read as instructed (reading 1 of 'recursion'): fib4 must not call
      itself, directly or through other functions; a recursive helper that
      does not call fib4 is allowed. Which functions the code calls is not
      part of the trace, which records only n, result and outcome.

decisions:
  - {req: R-IF-1, phrase: 'n: int', reading: 2}
  - {req: R-REC-1, phrase: '+/-', reading: 1}
  - {req: R-REC-1, phrase: 'fib4(n) -> fib4(n-1) +/- fib4(n-2) +/- fib4(n-3) +/- fib4(n-4)', reading: 2}
  - {req: R-FUN-1, phrase: 'n-th element', reading: 2}
  - {req: R-NF-1, phrase: 'efficiently', reading: 1}
  - {req: R-NF-2, phrase: 'recursion', reading: 1}
  - {req: R-EX-1, phrase: '>>> fib4(5)', reading: 1}
  - {req: R-EX-2, phrase: '>>> fib4(6)', reading: 1}
  - {req: R-EX-3, phrase: '>>> fib4(7)', reading: 1}
