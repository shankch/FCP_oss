# Specification model.
#
# '+/-' is read literally (reading 4): each sign may be + or - independently
# for every n, so fib4(n) is defined relative to the function's own values at
# n-1 .. n-4. Calls are independent (frame.md), so the model remembers, for
# every index k >= 4, the value the last call fib4(k) returned: ghost fk, or -1
# when there was no such call or its value could not be carried by `result`
# (outcome 2). Indices 0 .. 3 take the base values 0, 0, 2, 0.
# f_n1 .. f_n4 select the model value of fib4(n-1) .. fib4(n-4) for the
# current call (-1 = unknown). c_xyz is fib4(n-1) x fib4(n-2) y fib4(n-3)
# z fib4(n-4) for the signs x, y, z (p = +, m = -); ok_xyz says the call
# returned that value: outcome 0 and result equal to it when it is in
# 0 .. 2^118-1, outcome 2 (a negative or too large integer) otherwise.

