properties:
  - id: RB-BASE-1
    req: R-BASE-1
    pattern: implies
    args: {trigger: "n == 0", cond: "outcome == 0 && result == 0"}
    note: "'fib4(0) -> 0' read as: the call fib4(0) returns the int 0 (outcome 0, result 0)."
  - id: RB-BASE-2
    req: R-BASE-2
    pattern: implies
    args: {trigger: "n == 1", cond: "outcome == 0 && result == 0"}
    note: "'fib4(1) -> 0': the call fib4(1) returns the int 0."
  - id: RB-BASE-3
    req: R-BASE-3
    pattern: implies
    args: {trigger: "n == 2", cond: "outcome == 0 && result == 2"}
    note: "'fib4(2) -> 2': the call fib4(2) returns the int 2."
  - id: RB-BASE-4
    req: R-BASE-4
    pattern: implies
    args: {trigger: "n == 3", cond: "outcome == 0 && result == 0"}
    note: "'fib4(3) -> 0': the call fib4(3) returns the int 0."
  - id: RB-REC-1
    req: R-REC-1
    pattern: implies
    args: {trigger: known, cond: rec_ok}
    note: >-
      Reading 4 of '+/-' (each sign may be + or - independently for every n), taken as the
      most literal: '+/-' says 'plus or minus', and nothing in the text fixes the signs across
      n or picks one (all '+' and alternating signs are particular cases). The recurrence then
      relates fib4(n) to the function's own values at n-1 .. n-4. Calls are independent, so
      those values are taken from the specification model: the base values for indices 0 .. 3
      and, for k >= 4, the value the last earlier call fib4(k) returned (ghost fk). Whenever
      n >= 4 and all four are known, the call must return one of the 8 sign combinations:
      outcome 0 with that value if it is in 0 .. 2^118-1, outcome 2 (a negative or too large
      integer, which `result` cannot carry) otherwise. At n = 4 the predecessors are the base
      values, so every call fib4(4) is checked (2, or -2 shown as outcome 2). A predecessor that
      was not called earlier, or whose value could not be carried (outcome 2), is unknown and
      the check does not fire; the relation is only checked from predecessors to n, not when a
      predecessor is called after n. Second flagged phrase, reading 1: the base values and this
      recurrence define the sequence, as written. The examples are not dropped to make this
      consistent: R-EX-1..3 are formalized literally (RB-EX-1..3), so the conflict stays
      visible (RB-EX-1 cannot be reached together with RB-REC-5).
  - id: RB-REC-5
    req: R-REC-1
    pattern: implies
    args: {trigger: "n == 5", cond: "(outcome == 0 && (result == 0 || result == 4)) || outcome == 2"}
    note: >-
      Consequence of R-BASE-1..4 and R-REC-1 under reading 4 of '+/-', by enumerating every
      choice of signs: fib4(4) = 0 +/- 2 +/- 0 +/- 0 is 2 or -2, and fib4(5) = fib4(4) +/- 0
      +/- 2 +/- 0 is -4, 0 or 4. Unlike RB-REC-1 it needs no earlier call, so a single call
      fib4(5) is checked. -4 cannot be carried by `result` (outcome 2).
  - id: RB-REC-6
    req: R-REC-1
    pattern: implies
    args: {trigger: "n == 6", cond: "(outcome == 0 && (result == 0 || result == 4 || result == 8)) || outcome == 2"}
    note: >-
      Consequence of R-BASE-1..4 and R-REC-1 under reading 4 of '+/-', by enumerating every
      choice of signs: fib4(6) = fib4(5) +/- fib4(4) +/- 0 +/- 2 is one of -8, -4, 0, 4, 8
      (8 with all '+', 0 with alternating signs). Checked on a single call; negative values
      are outcome 2.
  - id: RB-REC-7
    req: R-REC-1
    pattern: implies
    args: {trigger: "n == 7", cond: "(outcome == 0 && (result == 2 || result == 6 || result == 10 || result == 14)) || outcome == 2"}
    note: >-
      Consequence of R-BASE-1..4 and R-REC-1 under reading 4 of '+/-', by enumerating every
      choice of signs: fib4(7) = fib4(6) +/- fib4(5) +/- fib4(4) +/- 0 is one of -14, -10, -6,
      -2, 2, 6, 10, 14 (14 with all '+', -2 with alternating signs). Checked on a single call;
      negative values are outcome 2.
  - id: RB-FUN-1
    req: R-FUN-1
    pattern: invariant
    args: {cond: "outcome != 1"}
    note: >-
      Reading 1 of 'n-th element': the element with index n, counting fib4(0) as element 0,
      the indexing RB-BASE-1..4 and RB-REC-* use; the value part of this requirement is
      realized by those items. Every n of the trace (0 .. 127) is a valid argument, so this item
      adds that every call returns a value: no exception and no call that does not finish
      (outcome 1). 'as an integer': a returned element that `result` cannot carry (negative or
      at least 2^118) is outcome 2, which RB-REC-* allow only where the model allows such an
      element; a non-integer return also shows as outcome 2 and cannot be told apart.
  - id: RB-NF-1
    req: R-NF-1
    pattern: invariant
    args: {cond: "outcome != 1"}
    note: >-
      Reading 4 of 'efficiently': no particular bound, only exponential-time computation is
      excluded. Running time is not observable in the trace, except that a call which does not
      finish is recorded as outcome 1, and an exponential-time implementation (for example
      naive recursion) does not finish for large n. Partial formalization: the bound itself,
      and the distinctions between readings 1 .. 3, are not observable. Also fails on an
      exception, which RB-FUN-1 forbids as well.

scenarios:
  - id: RB-EX-1
    req: R-EX-1
    cover: "n == 5 && outcome == 0 && result == 2"
    note: >-
      Reading 1 (literal): fib4(5) returns 2. This contradicts R-BASE-1..4 with R-REC-1 under
      every reading of '+/-': fib4(5) is -4, 0 or 4 (RB-REC-5), so the scenario cannot be
      reached. Kept as written so that the contradiction in the prompt is reported, not
      repaired.
  - id: RB-EX-2
    req: R-EX-2
    cover: "n == 6 && outcome == 0 && result == 4"
    note: >-
      Reading 1 (literal): fib4(6) returns 4. Under the reading of '+/-' taken (4) it is
      reachable: 0, 0, 2, 0, 2, 4, 4 with fib4(6) = fib4(5) + fib4(4) - fib4(3) - fib4(2).
      It would contradict the recurrence with all '+' (8) or with alternating signs (0).
  - id: RB-EX-3
    req: R-EX-3
    cover: "n == 7 && outcome == 0 && result == 6"
    note: >-
      Reading 1 (literal): fib4(7) returns 6. Under reading 4 of '+/-' it is reachable:
      0, 0, 2, 0, 2, 4, 4, 6 with fib4(7) = fib4(6) + fib4(5) - fib4(4) + fib4(3), the same
      sequence that meets RB-EX-2. It would contradict the recurrence with all '+' (14) or with
      alternating signs (-2), and with any fixed signs together with RB-EX-2.

unformalized:
  - req: R-TASK-1
    reason: >-
      Concerns the form of the deliverable (the body of fib4 completed under the given
      signature and docstring), not the behaviour of a call, so it is not observable in the
      trace. Its observable content is what the other requirements state.
  - req: R-IF-1
    reason: >-
      Met by the interface encoding: every cycle is one call of fib4 with its single int
      argument n (a 7-bit unsigned input, 0 .. 127). Reading 1 of 'n: int' taken (n may be any
      int, nothing is said for a negative n); negative n and n above 127 are not part of the
      trace (frame.md), so no assumption is needed and none is made.
  - req: R-DEF-1
    reason: >-
      A definition: it introduces the sequence that R-BASE-1..4 and R-REC-1 pin down. It is
      realized by the specification model (ghosts f4 .. f126, defs f_n1 .. f_n4) and the items
      that check outputs against it. 'similar to the Fibonacci sequence' adds no checkable
      constraint.
    covered_by: [RB-BASE-1, RB-BASE-2, RB-BASE-3, RB-BASE-4, RB-REC-1, RB-REC-5, RB-REC-6, RB-REC-7]
  - req: R-NF-2
    reason: >-
      A property of the source code, not of the calls: a recursive and an iterative
      implementation can produce identical traces. Reading 2 of 'recursion' taken (no function
      of the implementation may be recursive, helpers and memoized recursion included); it
      needs a code inspection, not a trace property.
  - req: R-FR-1
    reason: >-
      Frame rule of the function adapter, already part of every formalization set as F-ZERO
      (design.yaml); not restated.
    covered_by: [F-ZERO]

decisions:
  - {req: R-IF-1, phrase: "n: int", reading: 1}
  - {req: R-REC-1, phrase: "+/-", reading: 4}
  - {req: R-REC-1, phrase: "fib4(n) -> fib4(n-1) +/- fib4(n-2) +/- fib4(n-3) +/- fib4(n-4)", reading: 1}
  - {req: R-FUN-1, phrase: "n-th element", reading: 1}
  - {req: R-NF-1, phrase: "efficiently", reading: 4}
  - {req: R-NF-2, phrase: "recursion", reading: 2}
  - {req: R-EX-1, phrase: ">>> fib4(5)", reading: 1}
  - {req: R-EX-2, phrase: ">>> fib4(6)", reading: 1}
  - {req: R-EX-3, phrase: ">>> fib4(7)", reading: 1}
