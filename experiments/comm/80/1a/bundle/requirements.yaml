- id: R-HAP-1
  doc: SPEC
  quote: A string is happy if its length is at least 3
  text: 'A string whose length is less than 3 (including the empty string) is not happy: is_happy returns False for it.'
  kind: guarantee
  ambiguity:
  - phrase: A string is happy if
    readings:
    - '''if'' means ''if and only if'': a length of at least 3 is necessary, so every string shorter than 3 is not happy'
    - '''if'' gives only a sufficient condition: the sentence says nothing about strings shorter than 3 (only the examples a and aa say they are not happy)'
  - phrase: its length
    readings:
    - the number of characters of s
    - the number of letters of s (non-letter characters not counted)
  lines:
  - 7
- id: R-HAP-2
  doc: SPEC
  quote: roughly substrings of letters are distinct
  text: 'A string whose substrings of letters are not distinct is not happy, whatever its length: is_happy returns False for it.'
  kind: guarantee
  ambiguity:
  - phrase: A string is happy if
    readings:
    - '''if'' means ''if and only if'': distinct substrings of letters are necessary, so a string without them is not happy'
    - '''if'' gives only a sufficient condition: the sentence says nothing about strings without distinct substrings (only the examples aabb and xyy say they are not happy)'
  - phrase: substrings of letters are distinct
    readings:
    - every substring of 3 consecutive characters consists of 3 pairwise different characters (s[i], s[i+1], s[i+2] all differ)
    - every two adjacent characters differ (no substring of 2 equal letters)
    - all characters of the string are pairwise different (equivalently, no substring occurs twice)
    - the substrings of some fixed length (2 or 3) are all different from one another (no repeated pair or triple); this makes aabb and xyy happy, contradicting the examples
  - phrase: roughly
    readings:
    - 'a hedge or filler word: the distinctness condition is strict and a single repeat makes the string unhappy'
    - 'approximately: most substrings must be distinct and a small number of repeats is tolerated'
    - the exact condition is left unspecified and is to be inferred from the examples
  - phrase: roughly substrings of letters are distinct
    readings:
    - 'contradiction resolved by the examples: aabb and xyy (each with a single repeated adjacent letter) are not happy, so the condition is strict'
    - 'contradiction resolved by the definition: under a tolerant reading of ''roughly'' (or the reading that substrings differ from one another) xyy and aabb would be happy, so the examples is_happy(aabb)
      => False and is_happy(xyy) => False are overruled'
  - phrase: letters
    readings:
    - every character of s counts, whatever its kind
    - 'only alphabetic characters count: non-letters are skipped (or removed) before checking distinctness'
    - s is assumed to contain only letters; strings with non-letters are a don't care
  - phrase: distinct
    readings:
    - 'case-sensitive: ''A'' and ''a'' are different letters'
    - 'case-insensitive: ''A'' and ''a'' are the same letter'
  lines:
  - 7
