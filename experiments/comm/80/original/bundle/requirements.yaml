- id: R-HAP-1
  doc: SPEC
  quote: A string is happy if its length is at least 3 and every 3 consecutive letters are distinct
  text: A string is happy exactly when its length is at least 3 and, in every run of 3 consecutive characters, the three characters are pairwise distinct.
  kind: definition
  ambiguity:
  - phrase: happy if
    readings:
    - '''if'' means ''if and only if'': a string that fails either condition is not happy.'
    - '''if'' gives only a sufficient condition: the sentence says nothing about strings that fail a condition.'
  - phrase: every 3 consecutive letters
    readings:
    - every overlapping window s[i], s[i+1], s[i+2] for i from 0 to len(s)-3.
    - non-overlapping blocks of three (positions 0-2, 3-5, ...), so 'abccde' (blocks 'abc', 'cde') would be happy.
  - phrase: letters
    readings:
    - 'any characters: every window of 3 consecutive characters is checked, whatever the characters are.'
    - 'only alphabetic letters count: non-letter characters are skipped and windows are taken over the sequence of letters.'
    - a window that contains a non-letter character does not meet the condition, so such strings are not happy.
  - phrase: distinct
    readings:
    - the three characters of each window are pairwise distinct (no two equal), so 'aba' is not happy.
    - only adjacent characters must differ (s[i] != s[i+1] and s[i+1] != s[i+2]), so 'aba' is happy. This matches every example.
    - the three characters of a window are not all the same. This contradicts the examples is_happy(aabb) => False and is_happy(xyy) => False.
    - no 3-character window occurs twice in the string. This contradicts the examples is_happy(aabb) => False and is_happy(xyy) => False.
  - phrase: letters are distinct
    readings:
    - characters are compared by code (case-sensitive), so 'a' and 'A' are distinct.
    - characters are compared ignoring case, so 'a' and 'A' are the same letter.
  lines:
  - 7
