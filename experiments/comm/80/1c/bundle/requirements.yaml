- id: R-IN-1
  doc: SPEC
  quote: You are given a string s.
  text: Every call of is_happy passes a string as the argument s; calls whose argument is not a string are outside the request.
  kind: assumption
  ambiguity:
  - phrase: a string
    readings:
    - any string, including the empty string and strings that contain characters other than letters
    - only strings made of letters are ever passed (the definition speaks of 'letters'), so the result for other strings is left open
  lines:
  - 5
- id: R-OUT-1
  doc: SPEC
  quote: Your task is to check if the string is happy or not.
  text: For every string s, is_happy(s) finishes and returns a Python bool (True or False); it does not raise an exception, run forever or return a value of another type.
  kind: guarantee
  ambiguity:
  - phrase: check if the string is happy or not
    readings:
    - return the bool True when the string is happy and the bool False when it is not
    - return any truthy value when the string is happy and any falsy value when it is not (for example 1 and 0, or None)
  lines:
  - 6
- id: R-HAP-1
  doc: SPEC
  quote: A string is happy if its length is at least 3 and every 3 consecutive letters are distinct
  text: If s has at least 3 characters and, for every position i from 0 to len(s)-3, the characters s[i], s[i+1] and s[i+2] are pairwise distinct, then is_happy(s) returns True.
  kind: guarantee
  ambiguity:
  - phrase: letters
    readings:
    - every character of s counts as a letter, whatever its class
    - 'only alphabetic characters count: other characters are dropped before the groups of 3 consecutive letters are formed'
    - a string that contains a character other than a letter is not happy
  - phrase: its length
    readings:
    - the number of characters of s
    - the number of letters (alphabetic characters) in s
  - phrase: 3 consecutive letters
    readings:
    - every overlapping window s[i], s[i+1], s[i+2], for each start i from 0 to len(s)-3
    - the non-overlapping blocks s[0..2], s[3..5], ... (a trailing block shorter than 3 is ignored)
  - phrase: distinct
    readings:
    - the three characters are pairwise different by exact character code (so 'a' and 'A' differ)
    - the three characters are pairwise different when letter case is ignored
    - the three characters are not all the same (at least two of them differ)
    - each group of 3 consecutive letters differs, as a substring, from every other such group
  - phrase: A string is happy if its length is at least 3 and every 3 consecutive letters are distinct
    readings:
    - 'the definition is authoritative: ''abcd'' and ''adb'' meet both conditions, so is_happy returns True for them, which contradicts the examples R-EX-3 and R-EX-5'
    - 'the examples are authoritative: is_happy(''abcd'') and is_happy(''adb'') return False, so meeting both conditions does not force the result True'
    - every example is the negation of the definition, so is_happy returns True exactly when the string is not happy
  lines:
  - 7
- id: R-HAP-2
  doc: SPEC
  quote: A string is happy if its length is at least 3
  text: If s has fewer than 3 characters (including the empty string), then is_happy(s) returns False.
  kind: guarantee
  ambiguity:
  - phrase: is happy if
    readings:
    - 'if and only if: a string with fewer than 3 characters is not happy, so is_happy returns False for it'
    - 'if only (a sufficient condition): the definition does not say whether a string with fewer than 3 characters is happy, so either answer is allowed'
  - phrase: its length
    readings:
    - the number of characters of s
    - the number of letters (alphabetic characters) in s
  - phrase: its length is at least 3
    readings:
    - 'the definition is authoritative: ''a'' and ''aa'' are shorter than 3, so is_happy returns False for them, which contradicts the examples R-EX-1 and R-EX-2'
    - 'the examples are authoritative: is_happy(''a'') and is_happy(''aa'') return True, so a string shorter than 3 can be happy'
    - every example is the negation of the definition, so is_happy returns True exactly when the string is not happy
  lines:
  - 7
- id: R-HAP-3
  doc: SPEC
  quote: A string is happy if its length is at least 3 and every 3 consecutive letters are distinct
  text: If, for some position i from 0 to len(s)-3, two of the characters s[i], s[i+1] and s[i+2] are equal, then is_happy(s) returns False.
  kind: guarantee
  ambiguity:
  - phrase: is happy if
    readings:
    - 'if and only if: a string with a repeated character among some 3 consecutive letters is not happy, so is_happy returns False for it'
    - 'if only (a sufficient condition): the definition does not say whether such a string is happy, so either answer is allowed'
  - phrase: letters
    readings:
    - every character of s counts as a letter, whatever its class
