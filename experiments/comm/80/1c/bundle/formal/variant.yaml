unformalized:
  - req: R-API-1
    reason: >-
      Non-functional: the function's name and its single parameter s are a property of the
      source code, not of a trace of calls. The adapter (design.yaml, function section)
      calls is_happy(s) with one argument, so a missing or misnamed function shows up as
      calls that do not return (outcome 1), which RV-OUT-1 rejects.
  - req: R-FR-1
    reason: >-
      Frame rule of the adapter, part of every formalization set by construction and not to
      be restated (frame.md).
    covered_by: [F-ZERO]

