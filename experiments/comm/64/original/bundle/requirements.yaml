- id: R-VOW-1
  doc: SPEC
  quote: Vowels in this case are 'a', 'e', 'i', 'o', 'u'.
  text: The letters a, e, i, o and u are vowels wherever they occur in the string.
  kind: definition
  ambiguity:
  - phrase: '''a'', ''e'', ''i'', ''o'', ''u'''
    readings:
    - Only the lowercase letters a, e, i, o, u are vowels. Uppercase A, E, I, O, U are not counted. This contradicts the example vowels_count("ACEDY") == 3 (R-EX-2), which would give 0 under this reading.
    - The letters are matched without regard to case, so A, E, I, O, U are vowels too. This agrees with the example vowels_count("ACEDY") == 3 (R-EX-2).
  - phrase: Vowels in this case are
    readings:
    - "The list is exhaustive: only the ASCII letters a, e, i, o, u (and y per R-VOW-2) are vowels. Accented Latin-1 letters such as '\xE9' or '\xE0' are not."
    - "Accented Latin-1 forms of these letters (for example '\xE9', '\xE0', '\xFC') are vowels too."
  lines:
  - 11
- id: R-VOW-2
  doc: SPEC
  quote: Here, 'y' is also a vowel
  text: The letter y is a vowel when it is at the end of the given word (see R-VOW-3), so a final y adds one to the count.
  kind: definition
  depends:
  - R-VOW-3
  ambiguity:
  - phrase: '''y'''
    readings:
    - Only a lowercase y can count as a vowel, so a final uppercase Y is not counted. This contradicts the example vowels_count("ACEDY") == 3 (R-EX-2), which needs the final Y to be counted.
    - y is matched without regard to case, so a final Y counts as a vowel too. This agrees with the example vowels_count("ACEDY") == 3 (R-EX-2).
  lines:
  - 11
  - 12
- id: R-VOW-3
  doc: SPEC
  quote: but only when it is at the end of the given word
  text: A y that is not at the end of the given word is not a vowel and adds nothing to the count.
  kind: definition
  ambiguity:
  - phrase: at the end of the given word
    readings:
    - y is a vowel only when it is the last character of the whole string s.
    - If s contains several words, a y that is the last letter of any word in s is a vowel.
    - y is a vowel when it is the last letter of the word, even if non-letter characters follow it (for example trailing spaces or punctuation, as in "day!").
  - phrase: '''y'''
    readings:
    - Only a lowercase y is covered by this rule, so a non-final uppercase Y does not count, and neither does a final one.
    - y is matched without regard to case, so a non-final Y is not counted and a final Y is counted.
  lines:
  - 12
