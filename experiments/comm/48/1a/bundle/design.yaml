fcp: '0.1'
design: code_candidate
summary: A Python function on strings treated as a chip without memory. Each cycle is one call of candidate(text); the argument is an input string of at most 32 characters, the returned boolean and the way the call ended are outputs. The prompt is the specification, and code written by AI models is checked by running it.
docs:
- {id: SPEC, path: spec.md, title: 'Prompt: complete candidate(text)'}
- {id: FRAME, path: frame.md, title: 'FCP function adapter, version 0.2'}
interface:
  clock: clk
  reset: {name: rst_n, active_low: true, synchronous: true}
  signals:
  - {name: clk, dir: in, width: 1}
  - {name: rst_n, dir: in, width: 1}
  - {name: text, dir: in, width: 8, length: 32, desc: 'the text argument: a string of at most 32 characters, codes 0 to 255'}
  - {name: outcome, dir: out, width: 2, desc: 'how the call ended: 0 returned a bool, 1 any exception or no answer, 2 returned anything else'}
  - {name: result, dir: out, width: 1, desc: 'the returned value (outcome 0), 1 True, 0 False'}
environment: {initial_reset: true, reset_anytime: false, bmc_depth: 3, cover_depth: 3}
frame:
- {id: F-ZERO, req: R-FR-1, expr: 'outcome != 0 -> !result'}
function:
  name: candidate
  args:
  - {name: text, signal: text, type: str}
  returns: {signal: result, type: bool}
  outcome: {signal: outcome, raises: []}
  scope:
    text: {alphabet: 'abcdzABZ ', random: 3000, values: ['', 'aba', 'aaaaa', 'zbcd']}
