  lines:
  - 7
  - 8
- id: R-EX-2
  doc: SPEC
  quote: '>>> candidate(''aba'') True'
  text: candidate('aba') returns True.
  kind: scenario
  depends:
  - R-CHK-1
  ambiguity:
  - phrase: candidate('aba')
    readings:
    - 'the example is right: ''aba'' returns True although the letter ''a'' repeats, so being an isogram is not required; this contradicts R-CHK-1/R-CHK-2 when ''Isogram/Palindrome'' is read as ''both''
      or ''isogram only'''
    - 'the docstring is right and requires an isogram: ''aba'' is not an isogram and returns False, so the example is wrong'
  lines:
