fcp: "0.1"
set: agent_b
origin: {kind: agent, role: formalizer, id: agent_b}

# Specification model. is_palindrome is a function without memory (frame.md:
# each cycle is one independent call), so the reference model is combinational:
# a ghost with a next-state would only describe the previous call. The model
# is the palindrome predicate on the current argument, and every output is
# checked against it.
defs:
  # R-DEF-1, reading "exact" of "palindrome" and "any string" of "given string":
  # character i equals character n-1-i for every i, comparing exact codes.
  # The empty string satisfies it vacuously (it equals its reverse).
  pal: "all(i < len(text): text[i] == text[len(text) - 1 - i])"
  # the call returned a bool (outcome 0) whose value is True
  ret_true: "outcome == 0 && result"
  # the call returned a bool (outcome 0) whose value is False
  ret_false: "outcome == 0 && !result"

properties:
  - id: RB-FN-3
    req: R-FN-3
    pattern: invariant
    args: {cond: "outcome == 0"}
    note: >-
      Every call finishes and returns True or False: no exception, no
      non-termination (outcome 1) and no value of another type (outcome 2).
      Reading 1 of "Checks": an exact bool is required, since the examples
      print True and False; a truthy non-bool value is outcome 2 and violates
      this.

  - id: RB-FN-1
    req: R-FN-1
    pattern: implies
    args: {trigger: "pal", cond: "ret_true"}
    note: >-
      Literal reading (1) of "Checks if given string is a palindrome": the
      description and the name is_palindrome govern, so a palindrome
      (including the empty string and every one-character string, R-DEF-1)
      returns True. The specification contradicts itself here: the examples
      R-EX-1 (''), R-EX-2 ('aba') and R-EX-3 ('aaaaa') show False for
      palindromes. The contradiction is not repaired; the examples are kept
      as scenarios (RB-EX-1..3) that this property makes unreachable.

  - id: RB-FN-2
    req: R-FN-2
    pattern: implies
    args: {trigger: "!pal", cond: "ret_false"}
    note: >-
      Literal reading (1) of "Checks if given string is a palindrome": a
      string that is not a palindrome returns False. Contradicted by the
      example R-EX-4 (is_palindrome('zbcd') True, although 'zbcd' reversed
      is 'dcbz'); that example is kept as scenario RB-EX-4, which this
      property makes unreachable.

scenarios:
  - id: RB-FN-1-S
    req: R-FN-1
    cover: "pal && len(text) >= 2 && ret_true"
    note: A palindrome of at least two characters can be answered True.

  - id: RB-FN-2-S
    req: R-FN-2
    cover: "!pal && ret_false"
    note: A non-palindrome can be answered False.

  - id: RB-EX-1
    req: R-EX-1
    cover: "len(text) == 0 && ret_false"
    note: >-
      Doctest is_palindrome('') -> False, taken literally as correct
      (reading 1). For a function without memory, a possible call is the
      call: the empty string must be answered False. The empty string equals
      its reverse, so under the literal definition (R-DEF-1) and the literal
      description (RB-FN-1) it must be answered True: this scenario
      contradicts RB-FN-1 and is expected to be unreachable together with it.

  - id: RB-EX-2
    req: R-EX-2
    cover: 'text == "aba" && ret_false'
    note: >-
      Doctest is_palindrome('aba') -> False, taken literally as correct
      (reading 1). 'aba' is a palindrome, so this contradicts RB-FN-1 and is
      expected to be unreachable together with it.

  - id: RB-EX-3
    req: R-EX-3
    cover: 'text == "aaaaa" && ret_false'
    note: >-
      Doctest is_palindrome('aaaaa') -> False, taken literally as correct
      (reading 1). 'aaaaa' is a palindrome, so this contradicts RB-FN-1 and
      is expected to be unreachable together with it.

  - id: RB-EX-4
    req: R-EX-4
    cover: 'text == "zbcd" && ret_true'
    note: >-
      Doctest is_palindrome('zbcd') -> True, taken literally as correct
      (reading 1). 'zbcd' is not a palindrome, so this contradicts RB-FN-2
      and is expected to be unreachable together with it.

unformalized:
  - req: R-IF-1
    reason: >-
      Non-functional: the deliverable is the body of the given stub with its
      name and signature unchanged. That is a property of the source code,
      not of the call trace; the adapter calls is_palindrome(text) by name,
      so a renamed or re-signatured function simply fails every call.
  - req: R-IF-2
    reason: >-
      Interface definition, realized by the encoding itself (design.yaml
      `function` section: one argument `text` of type str driving the input
      `text`; frame.md "Inputs"). It places no constraint on outputs and no
      obligation beyond what the encoding enforces. Note that the adapter
      only exercises strings of at most 32 characters with codes 0..255,
      whereas the prompt admits any str.
  - req: R-DEF-1
    reason: >-
      Definition with no observable output of its own; it is the def `pal`
      (exact code comparison, the empty string included), used by the
      properties and scenarios below.
    covered_by: [RB-FN-1, RB-FN-2, RB-FN-1-S, RB-FN-2-S]
  - req: R-FR-1
    reason: >-
      Frame rule F-ZERO of the function adapter; frame items are added to
      every formalization set by construction (design.yaml `frame`), so it is
      not restated here.
    covered_by: [F-ZERO]

decisions:
  - {req: R-DEF-1, phrase: "palindrome", reading: 1}
  - {req: R-DEF-1, phrase: "given string", reading: 1}
  - {req: R-FN-1, phrase: "Checks if given string is a palindrome", reading: 1}
  - {req: R-FN-2, phrase: "Checks if given string is a palindrome", reading: 1}
  - {req: R-FN-3, phrase: "Checks", reading: 1}
  - {req: R-EX-1, phrase: "False", reading: 1}
  - {req: R-EX-2, phrase: "False", reading: 1}
  - {req: R-EX-3, phrase: "False", reading: 1}
  - {req: R-EX-4, phrase: "True", reading: 1}
