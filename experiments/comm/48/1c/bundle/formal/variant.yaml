    reason: >-
      Non-functional: the deliverable is an implementation of the stub with its
      name and signature unchanged. The adapter fixes the name and the single
      str argument (design.yaml, function section); nothing about it is
      observable as a property of the call trace.
  - req: R-IF-2
    reason: >-
      Interface definition realized by the encoding: each cycle is one call
