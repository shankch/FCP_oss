      (frame.md, Inputs). There is no further constraint to state; an
      assumption would only restate the encoding.
  - req: R-DEF-1
    reason: >-
      Definition, realized by the def pal used in RV-FN-1 and RV-FN-2. Readings
      taken as instructed although another seems more natural: 'palindrome'
      reading 2 (case-insensitive, every character counts: 'Aa' is a
      palindrome, 'ab, a' is not); 'given string' reading 2 (the empty string
      is not a palindrome; non-empty strings are judged by reversal). Case is
      folded as Python's str.lower() does on Latin-1 (A-Z, 192-214, 216-222).
    covered_by: [RV-FN-1, RV-FN-2]
  - req: R-FR-1
    reason: >-
      Frame rule of the function adapter (F-ZERO: result is false unless outcome
      is 0); it is part of every formalization set by construction and is not
