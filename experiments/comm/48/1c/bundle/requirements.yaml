- id: R-DEF-1
  doc: SPEC
  quote: Checks if given string is a palindrome
  text: 'A string is a palindrome when it reads the same forwards and backwards: for a string of length n, character i equals character n-1-i for every i from 0 to n-1 (the string equals its reverse).'
  kind: definition
  ambiguity:
  - phrase: palindrome
    readings:
    - 'Exact: the string equals its reverse with every character compared by its exact code (case-sensitive; spaces, punctuation and all other characters count), so ''Aa'' and ''ab, a'' are not palindromes.'
    - 'Case-insensitive: letters are compared ignoring case but every character counts, so ''Aa'' is a palindrome and ''ab, a'' is not.'
    - Case-insensitive and ignoring every character that is not a letter or digit (sentence palindrome), so both 'Aa' and 'ab, a' are palindromes.
  - phrase: given string
    readings:
    - Any string, including the empty string, which equals its reverse and is therefore a palindrome (as is every one-character string).
    - The empty string is not considered a palindrome (as the example is_palindrome('') False suggests); non-empty strings are judged by reversal.
  lines:
  - 6
- id: R-FN-1
