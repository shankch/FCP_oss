      False) and, if the empty string is a palindrome, R-EX-1 (is_palindrome('''') False), which are then wrong.'
    - 'The examples govern: the answer is inverted, and is_palindrome returns False for every palindrome (True exactly when text is not a palindrome), consistent with R-EX-1, R-EX-2, R-EX-3 and R-EX-4.'
