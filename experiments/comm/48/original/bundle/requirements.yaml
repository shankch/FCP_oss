- id: R-DEF-1
  doc: SPEC
  quote: Checks if given string is a palindrome
  text: A palindrome is a string that reads the same forwards and backwards, i.e. it is equal to its own reversal.
  kind: definition
  ambiguity:
  - phrase: palindrome
    readings:
    - 'Strict: the string equals its reversal character by character; case, spaces, punctuation and every other character count (e.g. ''Aba'' and ''a ba'' are not palindromes).'
    - 'Case-insensitive: the string equals its reversal after letters are mapped to one case; all other characters count (e.g. ''Aba'' is a palindrome, ''a ba'' is not).'
    - 'Phrase palindrome: only letters and digits are compared, ignoring case, spaces and punctuation (e.g. ''Aba'', ''a ba'' and ''A man, a plan, a canal: Panama'' are palindromes, and a string without
      letters or digits such as ''!?'' is a palindrome).'
  lines:
  - 6
