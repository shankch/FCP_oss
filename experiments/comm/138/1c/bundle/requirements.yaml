- id: R-RET-1
  doc: SPEC
  quote: Evaluate whether the given number n can be written as the sum of exactly 4 positive even numbers
  text: For every argument n, a call of is_equal_to_sum_even(n) finishes and returns a boolean (True or False); it does not raise an exception or return a value of another type.
  kind: guarantee
  ambiguity:
  - phrase: Evaluate whether
