  lines:
  - 5
- id: R-SUM-1
  doc: SPEC
  quote: Evaluate whether the given number n can be written as the sum of exactly 4 positive even numbers
  text: If n can be written as the sum of exactly 4 positive even integers, is_equal_to_sum_even(n) returns True.
  kind: guarantee
  ambiguity:
  - phrase: exactly 4 positive even numbers
    readings:
    - the four summands may repeat (e.g. 2+2+2+2), so the representable n are exactly the even n >= 8
    - the four summands must be distinct, so the representable n are exactly the even n >= 20
  - phrase: can be written as the sum of exactly 4 positive even numbers
    readings:
    - 'the description is authoritative: 8 = 2+2+2+2 is representable, so is_equal_to_sum_even(8) returns True, which contradicts the example is_equal_to_sum_even(8) == False (R-EX-3)'
    - 'the examples are authoritative and the description is inverted: the function returns True exactly when n can NOT be written as such a sum, so is_equal_to_sum_even(8) returns False'
  lines:
  - 5
- id: R-SUM-2
  doc: SPEC
