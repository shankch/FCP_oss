    - the four summands must be distinct, so the representable n are exactly the even n >= 20
  - phrase: can be written as the sum of exactly 4 positive even numbers
    readings:
    - 'the description is authoritative: 4 and 6 are below the minimum sum 2+2+2+2 = 8, so is_equal_to_sum_even(4) and is_equal_to_sum_even(6) return False, which contradicts the examples is_equal_to_sum_even(4)
