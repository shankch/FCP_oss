  - 5
- id: R-IF-2
  doc: SPEC
  quote: 'def load(self, amount: int) -> int:'
  text: A call of load(amount) that does not raise ValueError returns an int.
  kind: guarantee
  lines:
  - 6
- id: R-IF-3
  doc: SPEC
  quote: 'def spend(self, amount: int) -> bool:'
  text: A call of spend(amount) that does not raise ValueError returns a bool (True or False).
  kind: guarantee
  lines:
  - 7
- id: R-IF-4
  doc: SPEC
  quote: 'def balance(self) -> int:'
  text: A call of balance() returns an int.
  kind: guarantee
