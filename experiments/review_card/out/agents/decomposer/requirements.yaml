requirements:
- id: R-IF-1
  doc: SPEC
  quote: 'Write a Python class for our gift cards: class GiftCard:'
  text: 'The code is a Python class named GiftCard with three methods: load(amount), spend(amount) and balance().'
  kind: non_functional
  lines:
