fcp: '0.1'
design: code_mask
summary: A Python function on strings treated as a chip without memory. Each cycle is one call of mask_card(number); the argument is an input string of at most 32 characters, the returned string and the way the call ended are outputs. The prompt is the specification, and code written by AI models is checked by running it.
docs:
- {id: SPEC, path: spec.md, title: 'Prompt P-MASK-1: Fernwood Outfitters card display'}
- {id: FRAME, path: frame.md, title: 'FCP function adapter, version 0.2'}
interface:
  clock: clk
  reset: {name: rst_n, active_low: true, synchronous: true}
  signals:
  - {name: clk, dir: in, width: 1}
  - {name: rst_n, dir: in, width: 1}
  - {name: number, dir: in, width: 8, length: 32, desc: 'the number argument: a string of at most 32 characters, codes 0 to 255'}
  - {name: outcome, dir: out, width: 2, desc: 'how the call ended: 0 returned a string that fits, 1 raised ValueError, 2 other exception or no answer, 3 returned anything else'}
  - {name: masked, dir: out, width: 8, length: 32, desc: 'the returned string (outcome 0), at most 32 characters'}
environment: {initial_reset: true, reset_anytime: false, bmc_depth: 3, cover_depth: 3}
frame:
- {id: F-EMPTY, req: R-FR-1, expr: 'outcome != 0 -> len(masked) == 0'}
function:
  name: mask_card
  args:
  - {name: number, signal: number, type: str}
  returns: {signal: masked, type: str}
  outcome: {signal: outcome, raises: [ValueError]}
  scope:
    number: {alphabet: '0123456789 -', random: 3000, values: ['4111 1111 1111 1111']}
