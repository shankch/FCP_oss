# Planted bugs: one textual patch of impl/ref.py each (the target text must
# occur exactly once).  `violates` is the gold requirement each one breaks.
design: code_change
bugs:
- id: C1
  desc: the student discount replaces the member discount instead of adding to it
  violates: [R-STU-1]
  patch: {from: 'discount = min(coupon + (10 if member else 0) + (15 if student else 0), 30)', to: 'discount = min(coupon + (15 if student else (10 if member else 0)), 30)'}
- id: C2
  desc: the student discount is not capped
  violates: [R-STU-1, R-CAP-1]
  patch: {from: 'discount = min(coupon + (10 if member else 0) + (15 if student else 0), 30)', to: 'discount = min(coupon + (10 if member else 0), 30) + (15 if student else 0)'}
- id: C3
  desc: the price is now truncated for everyone, a regression in the rounding
  violates: [R-SAME-1, R-KEEP-1]
  patch: {from: 'price = (subtotal * (100 - discount) + 50) // 100', to: 'price = subtotal * (100 - discount) // 100'}
- id: C4
  desc: the coupon range check is skipped for students
  violates: [R-KEEP-1]
  patch: {from: '    if not 0 <= coupon <= 50:', to: '    if not student and not 0 <= coupon <= 50:'}
- id: C5
  desc: students' shipping is measured on the discounted price
  violates: [R-SHIP-1]
  patch: {from: 'shipping = 499 if subtotal < threshold else 0', to: 'shipping = 499 if (price if student else subtotal) < threshold else 0'}
- id: C6
  desc: the student price is computed in floating point and returned as a float
  violates: [R-STU-1]
  patch: {from: "    return price, shipping", to: "    if student:\n        price = subtotal * (100 - discount) / 100\n    return price, shipping"}
- id: C7
  desc: a 1,000,000-cent cart is rejected, but only for students
  violates: [R-KEEP-1, R-STU-1]
  patch: {from: '    if not 0 <= subtotal <= 1_000_000:', to: '    if not 0 <= subtotal <= (999_999 if student else 1_000_000):'}
- id: C8
  desc: free shipping is lost from $50 for members who are not students
  violates: [R-SAME-1]
  patch: {from: 'threshold = 7500 if student else 5000', to: 'threshold = 7500 if student or member else 5000'}
- id: C9
  desc: the discounts are summed in a list; the same behaviour, written differently
  violates: []
  note: a refactoring, not a bug, which FCP must not flag
  patch: {from: 'discount = min(coupon + (10 if member else 0) + (15 if student else 0), 30)', to: 'discount = min(sum([coupon, 10 * member, 15 * student]), 30)'}
