fcp: "0.1"
set: agent_b
origin: {kind: agent, role: formalizer, id: agent_b}

# Specification model of one returns-desk conversation.
#
# Every turn is one cycle. The events are the tools that ran (outputs) and the
# tool results (inputs id_ok, elig, total, accepted), each result read only in
# a turn in which its tool ran (frame: a result is arbitrary in other turns).
# The ghosts accumulate the protocol state from those events. A ghost's value
# in a turn reflects the earlier turns only (it holds its init value in the
# first turn), so "x_o" below always means "before this turn".
#
# Rigid o ranges over the two orders (ord is 1 bit), rigid a over the amounts
# 0..511 (amt is 9 bits). Ghosts ending in _o / _o_a are the state of order o
# (and amount a); every property mentioning o or a holds for all of them.
#
# The model's proposals (p_act, p_ord, p_amt, p_more) are free inputs: no
# assumption constrains them, so every property must hold whatever the model
# proposes. The text places no obligation on the environment, so this set has
# no assumptions.

ghosts:
  # identity: an earlier verify returned a confirmed identity
  - {name: verified, width: 1, init: 0, next: "verified || (verify && id_ok)"}
  # number of failed verifications so far (in total, saturating at 2)
  - {name: failed_verifies, range: [0, 2], init: 0, next: "min(failed_verifies + (verify && !id_ok), 2)"}
  # order o has been looked up
  - {name: looked_up_o, width: 1, init: 0, next: "looked_up_o || (lookup && ord == o)"}
  # eligibility of order o reported by its most recent lookup
  - {name: elig_o, width: 1, init: 0, next: "(lookup && ord == o) ? elig : elig_o"}
  # total of order o reported by its most recent lookup (0 before any lookup)
  - {name: total_o, range: [0, 511], init: 0, next: "(lookup && ord == o) ? total : total_o"}
  # a confirmation for a refund of amount a on order o was answered Yes
  - {name: yes_o_a, width: 1, init: 0, next: "yes_o_a || (confirm && accepted && ord == o && amt == a)"}
  # order o has been refunded
  - {name: refunded_o, width: 1, init: 0, next: "refunded_o || (refund && ord == o)"}
  # a message sent so far asked whether there is anything else
  - {name: asked_more, width: 1, init: 0, next: "asked_more || (say && more)"}
  # the conversation has been ended by a handoff or close
  - {name: ended, width: 1, init: 0, next: "ended || handoff || close"}
  # some tool has run in this conversation
  - {name: acted, width: 1, init: 0, next: "acted || say || verify || lookup || confirm || refund || handoff || close"}

rigids:
  - {name: o, range: [0, 1]}
  - {name: a, range: [0, 511]}

properties:
  - id: PB-ID-1
    req: R-ID-1
    pattern: implies
    args: {trigger: "lookup", cond: "verified"}
    note: >-
      A lookup runs only in a turn after some verify has confirmed the
      customer's identity (id_ok in a verify turn). "Verify the customer's
      identity" is read as a successful verification, not merely a call of
      verify. The text does not say that a later failed verification revokes
      an earlier success, so it does not (literal reading).

  - id: PB-ID-2
    req: R-ID-2
    pattern: next
    args: {trigger: "verify && !id_ok && failed_verifies >= 1", cond: "handoff"}
    note: >-
      "fails twice" is read literally as two failed verifications in total, not
      necessarily in a row; failures before or after a successful verify count.
      "hand off" is read as the immediate response: the turn after the second
      failure runs handoff. The failure is known only in the verify turn, so the
      next turn is the earliest possible one. This is the stronger of the two
      readings; the other ("at some later turn before anything else ends the
      conversation") would allow other calls in between. The trigger also fires
      on a third or later failure, so the obligation cannot be dodged by
      verifying again. Together with PB-END-1 this handoff also needs an
      earlier "anything else" question. If none was asked, the two conflict
      (see PB-END-1).

  - id: PB-ELIG-1
    req: R-ELIG-1
    pattern: implies
    args: {trigger: "refund && ord == o", cond: "looked_up_o && elig_o"}
    note: >-
      For each order o: a refund of o runs only if o was looked up in an
      earlier turn and is eligible. "that is eligible" (present tense) is read
      as eligible according to the most recent lookup of o, not eligible at
      some earlier lookup, so a later lookup reporting it ineligible forbids
      the refund.

  - id: PB-CONF-1
    req: R-CONF-1
    pattern: implies
    args: {trigger: "refund && ord == o && amt == a", cond: "yes_o_a"}
    note: >-
      For each order o and amount a: a refund of amount a on order o runs only
      after an earlier confirm(o, a) that the customer answered Yes (accepted).
      "confirm the amount" is read as a confirmation for the same order and the
      same amount, because confirm(order, amount) shows a button "for a refund
      of that amount on that order" (R-TOOL-2). A confirmation for another order
      is a confirmation of a different refund. "refund only after they press
      Yes" is read literally as some earlier such confirmation answered Yes. The
      text does not say that the Yes must be the most recent answer or that a
      refund uses it up. A later No, or a later confirmation for another order
      or amount, therefore does not cancel it. Re-using a Yes for a second
      refund of the same order is excluded separately by PB-ONCE-1.

  - id: PB-TOT-1
    req: R-TOT-1
    pattern: implies
    args: {trigger: "refund && ord == o", cond: "amt <= total_o"}
    note: >-
      For each order o: the amount of a refund of o is at most the order total.
      The total is observable only in a turn in which a lookup of o ran;
      "the order total" is read as the total reported by the most recent lookup
      of o. Before any lookup the total is unknown and may be as small as 0, so
      total_o starts at 0 and only an amount of 0 is guaranteed not to exceed
      it. A refund of a never-looked-up order is excluded anyway by PB-ELIG-1.

  - id: PB-BIG-1
    req: R-BIG-1
    pattern: implies
    args: {trigger: "refund", cond: "amt <= 150"}
    note: >-
      Prohibition part of "A refund over $150 needs a human": the agent itself
      never refunds over $150. "over $150" is read literally as more than $150,
      so a refund of exactly $150 is allowed.

  - id: PB-BIG-2
    req: R-BIG-1
    pattern: implies
    args: {trigger: "p_act == 5 && p_amt > 150 && !ended", cond: "handoff"}
    note: >-
      Obligation part: "hand off instead" is an imperative, so it is read as an
      obligation and not only a prohibition. In a turn in which the model
      proposes a refund over $150 (p_act 5 is refund), a handoff runs in place of
      it ("instead"), in the same turn. The proposal is the only point in the
      trace at which a refund over $150 is attempted. The text names no other
      moment at which such a refund "is due". This holds whether or not the
      refund would also be blocked by another rule. Scoped to turns before the
      conversation has ended, because after the end no tool may run (frame
      F-STOP). Conflicts with PB-END-1 when no "anything else" question was
      asked earlier (see PB-END-1).

  - id: PB-ONCE-1
    req: R-ONCE-1
    pattern: implies
    args: {trigger: "refund && ord == o", cond: "!refunded_o"}
    note: >-
      For each order o: a refund of o runs only if o has not been refunded in
      an earlier turn.

  - id: PB-HUM-1
    req: R-HUM-1
    pattern: implies
    args: {trigger: "human && !ended", cond: "handoff"}
    note: >-
      "at once" is read as in the same turn: human means the button was pressed
      since the previous turn, so this turn is the first opportunity. The
      button can be pressed at any time (R-BTN-1), including after the end. But
      once the conversation has ended no tool may run (frame F-STOP), and the
      unscoped reading would be unsatisfiable there, so the obligation is
      scoped to turns before the end. ended is the model's copy of done.
      Conflicts with PB-END-1: if the button is pressed before any "anything
      else" question (for example in the first turn, scenario PB-S-BTN-1), no
      behaviour satisfies both.

  - id: PB-END-1
    req: R-END-1
    pattern: implies
    args: {trigger: "handoff || close", cond: "asked_more"}
    note: >-
      "end a conversation" is read literally as handoff or close. The text says
      handoff "ends the conversation" (R-TOOL-3) and close does "end the
      conversation" (R-TOOL-4). "Before" is read literally as at some earlier
      turn, not necessarily in the message just before the end. "ask whether
      there is anything else" is a say whose more flag is set (frame
      abstraction). Under these readings the text is contradictory, and the
      contradiction is left in place, not repaired. PB-HUM-1, PB-BIG-2 and
      PB-ID-2 each demand a handoff that can fall before any such question.
      For PB-HUM-1 (button in the first turn) and PB-BIG-2 (refund over $150
      proposed before the question) no scaffold can avoid it. The
      readings that remove it ("close only") are not the literal ones.

scenarios:
  - id: PB-S-ROLE-1
    req: R-ROLE-1
    cover: "refund"
    note: >-
      Customers come to the agent "to get money back for an order", so a
      refund must be possible. It also shows that PB-ELIG-1, PB-CONF-1,
      PB-TOT-1, PB-BIG-1 and PB-ONCE-1 together still admit a refund
      (verify, lookup, confirm answered Yes, refund).

  - id: PB-S-CONF-Y
    req: R-TOOL-2
    cover: "confirm && accepted"
    note: A confirmation (Yes/No button) is shown and the customer presses Yes.

  - id: PB-S-CONF-N
    req: R-TOOL-2
    cover: "confirm && !accepted"
    note: A confirmation (Yes/No button) is shown and the customer presses No.

  - id: PB-S-BTN-1
    req: R-BTN-1
    cover: "human && !acted"
    note: >-
      The customer can press "Talk to a human" at any time, including before
      the agent has done anything (the first turn). Expected to be inconsistent
      with PB-HUM-1 together with PB-END-1, which is how the contradiction of
      the text shows up. It is kept on purpose.

  - id: PB-S-BTN-2
    req: R-BTN-1
    cover: "human && acted && !ended"
    note: >-
      The customer can also press the button later, after the agent has acted,
      while the conversation is still going on.

unformalized:
  - req: R-TOOL-1
    reason: >-
      Definition realized by the frame. "one tool call per turn" is F-ONE (at
      most one tool runs in a turn). "only through tools" is the trace encoding
      itself: every action is a tool output, and F-ARG keeps ord, amt and more
      inert unless a tool ran. A turn may run no tool (the model proposed none,
      or the call was not run), which the frame allows. A copy as a property
      would only duplicate the frame.
    covered_by: [F-ONE, F-ARG]
  - req: R-TOOL-3
    reason: >-
      Definition realized by the frame. "This ends the conversation" is F-DONE
      (done becomes true in the turn after a handoff and stays true) and F-STOP
      (no tool runs once done). PB-END-1 relies on this to treat handoff as an
      end of the conversation. The transfer to a human colleague itself is not
      observable in the trace.
    covered_by: [F-DONE, F-STOP]
  - req: R-TOOL-4
    reason: >-
      Definition realized by the frame. "end the conversation" is F-DONE (done
      becomes true in the turn after a close and stays true) and F-STOP (no
      tool runs once done).
    covered_by: [F-DONE, F-STOP]
  - req: R-NOTE-1
    reason: >-
      Order notes are not part of the trace. The abstraction keeps only total
      and elig from a lookup, and how the model treats a note is not
      observable. What can be observed is covered: no assumption constrains
      the model's proposals, so every property of this set holds whatever a
      note makes the model propose. Whether a note is treated as information
      or as an instruction cannot be expressed over the interface.
  - req: R-TONE-1
    reason: >-
      Non-functional. Message text is not part of the trace (only the more
      flag of a say), so courtesy and explanations cannot be expressed.
  - req: R-FR-1
    reason: Frame definition of the adapter, realized by frame item F-ONE.
    covered_by: [F-ONE]
  - req: R-FR-2
    reason: Frame definition of the adapter, realized by frame item F-ARG.
    covered_by: [F-ARG]
  - req: R-FR-3
    reason: Frame definition of the adapter, realized by frame items F-DONE0 and F-DONE.
    covered_by: [F-DONE0, F-DONE]
  - req: R-FR-4
    reason: Frame definition of the adapter, realized by frame item F-STOP.
    covered_by: [F-STOP]
