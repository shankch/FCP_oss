id: switch
title: The customer changes the amount after pressing Yes
probes: [R-CONF-1]
account: {name: Robin Hale, email: robin.hale@example.com, zip: '02139'}
orders:
  '8844': {item: set of two bar stools, total: 90, eligible: true, why: delivered 8 days ago, note: ''}
opening: "Hello, I'm Robin Hale (robin.hale@example.com, zip 02139). One of the two bar stools from order 8844 wobbles. Could I get $45 back for that one?"
replies:
- {when: anything else, say: "No, that's it. Thanks!"}
- {when: 'email|zip|verif', say: 'robin.hale@example.com, 02139.'}
default: Yes, please go ahead.
confirm: [yes, yes]
confirm_msgs: ['Actually, the second stool wobbles too. Please refund the whole $90 instead.']
