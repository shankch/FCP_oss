fcp: "0.1"
set: variant1
origin: {kind: agent, role: formalizer, id: variant1}

defs:
  is_charge: "op == 1"                          # this cycle is a call of api.charge
  is_sleep: "op == 2"                           # this cycle is a call of api.sleep
  ans_ok: "op == 1 && answer == 0"              # a charge that returned "ok"
  ans_declined: "op == 1 && answer == 1"        # a charge that returned "declined"
  ans_error: "op == 1 && answer == 2"           # a charge that returned "error"
  valid_amount: "amount >= 1 && amount <= 1000000"

ghosts:
  # Number of charges (attempts) made before the current cycle of the run.
  # Needed because "second attempt", "third attempt" and "3 attempts in total"
  # count charges, and the first charge (cycle 1 of a run) must be able to
  # trigger the retry obligation, which a prev/once count cannot do there.
  # A run makes at most 8 calls (F-LIMIT); the min only keeps the range closed.
  - {name: attempts, range: [0, 8], init: 0, next: "min(attempts + is_charge, 8)"}
  # Seconds slept (sum of api.sleep arguments) since the last charge, before
  # the current cycle: "wait 2 seconds before the second attempt" is the total
  # waiting between two attempts, which no direct relation can sum.
  - {name: waited, range: [0, 2040], init: 0, next: "is_charge ? 0 : min(waited + (is_sleep ? s_seconds : 0), 2040)"}

assumptions:
  - id: V1-A-ARGS
    req: R-SIG-1
    expr: "stable(order_id) && stable(amount)"
    note: >-
      The arguments order_id and amount of charge_order are fixed for one call
      of the function, so the input signals carrying them are the same in every
      cycle of a run (frame.md, Inputs). The result type bool of the signature
      is realized by V1-RET-1a, V1-RET-1b and V1-ERR-1, which fix the outcome
      of every return.

  - id: V1-A-ANS
    req: R-API-1
    pattern: implies
    args: {trigger: "is_charge", cond: "answer <= 2"}
    note: >-
      api.charge returns "ok", "declined" or "error" (answer 0, 1 or 2), never
      anything else. The rest of R-API-1 ("api.sleep(seconds) waits that many
      seconds") is a definition: the seconds waited are the s_seconds argument,
      which the ghost waited sums for V1-WAIT-1a/b. Time itself is not modelled.

properties:
  - id: V1-CALL-1
    req: R-CALL-1
    pattern: implies
    args: {trigger: "is_charge", cond: "c_order == order_id && c_amount == amount"}
    note: >-
      Every call api.charge(order_id, amount) charges the order and the amount
      the function was called with.

  - id: V1-ERR-1
    req: R-ERR-1
    pattern: implies
    args: {trigger: "phase && (amount < 1 || amount > 1000000)", cond: "outcome == 1"}
    note: >-
      With an amount outside 1 to 1,000,000 the run ends with ValueError. The
      text says nothing about calls made before raising, so none are
      constrained here (but see V1-RET-1a: a charge answered "ok" must be
      followed by returning True, so a conforming function cannot charge an
      invalid amount if the service could answer "ok").

  - id: V1-RET-1a
    req: R-RET-1
    pattern: next
    args: {trigger: "ans_ok", cond: "phase && outcome == 0 && result"}
    note: >-
      "once a charge returns" is read, as instructed, as reading 1: as soon as
      a charge returns "ok", with no further call. So the cycle right after a
      charge answered "ok" is the return, and the function returns True. Not
      restricted to valid amounts: the text applies to any charge.

  - id: V1-RET-1b
    req: R-RET-1
    pattern: implies
    args: {trigger: "phase && valid_amount && !once(ans_ok)", cond: "outcome == 0 && !result"}
    note: >-
      "and False otherwise": with reading 1 of "once a charge returns" (as soon
      as a charge returns "ok", with no further call), the return that does not
      come right after an "ok" is the case where no charge returned "ok" in the
      run (V1-RET-1a makes every "ok" end the run); there the function returns
      False (a bool, outcome 0). Restricted to amounts in 1..1,000,000: for the
      other amounts rule 1 says the function raises ValueError instead of
      returning, and taken over every amount the two rules could not both hold.
      This literal "False otherwise" contradicts R-KEEP-1 (V1-KEEP-1), which
      forbids returning without an "ok".

  - id: V1-RETRY-1a
    req: R-RETRY-1
    pattern: hold_until
    args: {trigger: "ans_error && attempts < 2", hold: "!phase", release: "is_charge"}
    note: >-
      "If a charge returns "error", try again, up to 3 attempts in total": after
      an "error" on the first or second attempt, the function does not return
      (or raise) before charging again. "up to 3 attempts" is read as the cap
      on retries, not as leave to stop earlier. After an "error" on the third
      attempt no retry is required (V1-RETRY-1b forbids one).

  - id: V1-RETRY-1b
    req: R-RETRY-1
    pattern: implies
    args: {trigger: "attempts >= 3", cond: "!is_charge"}
    note: >-
      At most 3 attempts in total: once 3 charges have been made, the function
      makes no further charge. Contradicts R-KEEP-1 when all three answers are
      "error".

  - id: V1-DECL-1
    req: R-DECL-1
    pattern: implies
    args: {trigger: "prev(once(ans_declined))", cond: "!is_charge"}
    note: >-
      After a charge answered "declined", the function makes no further charge
      in the run. Contradicts R-KEEP-1, which requires trying until a charge
      goes through.

  - id: V1-WAIT-1a
    req: R-WAIT-1
    pattern: implies
    args: {trigger: "is_charge && attempts == 1", cond: "waited == 2"}
    note: >-
      "wait 2 seconds before the second attempt": between the first and the
      second charge the function sleeps 2 seconds in total (the sum of the
      api.sleep arguments, since api.sleep(seconds) waits that many seconds),
      so a single api.sleep(2) as in the example, but also e.g. sleep(1) twice.
      Sleeps before the first charge or after the last one are not constrained.

  - id: V1-WAIT-1b
    req: R-WAIT-1
    pattern: implies
    args: {trigger: "is_charge && attempts == 2", cond: "waited == 4"}
    note: >-
      "4 seconds before the third": between the second and the third charge
      the function sleeps 4 seconds in total (same reading as V1-WAIT-1a).

  - id: V1-ONCE-1
    req: R-ONCE-1
    pattern: implies
    args: {trigger: "prev(once(ans_ok))", cond: "!is_charge"}
    note: >-
      After a charge answered "ok", the function makes no further charge in
      the run. Every charge is for order_id (R-CALL-1), so "charge an order
      again" is any later charge. Implied by V1-RET-1a under the reading of
      R-RET-1 taken (return right after "ok"), but stated on its own.

  - id: V1-KEEP-1
    req: R-KEEP-1
    pattern: implies
    args: {trigger: "phase && valid_amount", cond: "once(ans_ok)"}
    note: >-
      Literal reading of "Keep trying until the charge goes through": the
      function does not stop (return, raise or run out of calls) before some
      charge has returned "ok". Restricted to amounts in 1..1,000,000, where
      rule 1 does not make the function raise without charging. This
      contradicts the specification: after "declined" (R-DECL-1) or three
      "error"s (R-RETRY-1) no further charge is allowed, a run makes at most 8
      calls (F-LIMIT), and "False otherwise" (R-RET-1) becomes unreachable. No
      function can meet it when the service never answers "ok". Not repaired.

scenarios:
  - id: V1-EX-1
    req: R-EX-1
    cover: >-
      phase && outcome == 0 && result && attempts == 2
      && prev(ans_ok)
      && prev(is_sleep && s_seconds == 2, 2)
      && prev(ans_error && attempts == 0, 3)
      && hist(is_sleep -> attempts == 1)
    note: >-
      The example run: the first charge returns "error", then api.sleep(2),
      then the second charge returns "ok", then the function returns True.
      attempts == 0 at the first charge and every sleep coming after exactly
      one charge rule out any other call, so these are all the calls of the
      run.

unformalized:
  - {req: R-FR-1, reason: "Frame rule of the interface adapter, added to every set as F-END.", covered_by: [F-END]}
  - {req: R-FR-2, reason: "Frame rule of the interface adapter, added to every set as F-ZERO.", covered_by: [F-ZERO]}
  - {req: R-FR-3, reason: "Frame rule of the interface adapter, added to every set as F-LIMIT.", covered_by: [F-LIMIT]}

decisions:
  - {req: R-RET-1, phrase: "once a charge returns", reading: 1}
