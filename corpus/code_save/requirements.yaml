  kind: guarantee
  lines:
  - 11
- id: R-SYNC-1
  doc: SPEC
  quote: Before moving it, call `os.fsync` on the temporary file and close it.
  text: Before os.replace, the temporary file has been synced to disk and closed.
  kind: guarantee
  ambiguity:
  - phrase: call `os.fsync` on the temporary file
    readings:
    - os.fsync on its descriptor
    - os.fsync after flushing Python's buffer, so that the digits are on disk
  lines:
  - 12
