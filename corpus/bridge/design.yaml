fcp: '0.1'
design: apb_bridge
summary: Valid/ready command channel to APB3 bridge, one transaction at a time (BRG-1).
docs:
- id: SPEC
  path: spec.md
  title: BRG-1 Functional Specification v1.0
interface:
  clock: clk
  reset:
    name: rst_n
    active_low: true
    synchronous: true
  params:
    AW: 8
    DW: 8
  signals:
  - name: clk
    dir: in
    width: 1
  - name: rst_n
    dir: in
    width: 1
  - name: cmd_valid
    dir: in
    width: 1
  - name: cmd_ready
    dir: out
    width: 1
  - name: cmd_write
    dir: in
    width: 1
  - name: cmd_addr
    dir: in
    width: AW
  - name: cmd_wdata
    dir: in
    width: DW
  - name: rsp_valid
    dir: out
    width: 1
  - name: rsp_ready
    dir: in
    width: 1
  - name: rsp_rdata
    dir: out
    width: DW
  - name: rsp_err
    dir: out
    width: 1
  - name: psel
    dir: out
    width: 1
  - name: penable
    dir: out
    width: 1
  - name: pwrite
    dir: out
    width: 1
  - name: paddr
    dir: out
    width: AW
  - name: pwdata
    dir: out
    width: DW
  - name: pready
    dir: in
    width: 1
  - name: prdata
    dir: in
    width: DW
  - name: pslverr
    dir: in
    width: 1
environment:
  initial_reset: true
  reset_anytime: true
rtl:
  ref:
    top: apb_bridge
    files:
    - rtl/apb_bridge.v
    desc: Reference implementation (human-written).
    origin: human
  ai:
    top: apb_bridge
    files:
    - rtl/ai_apb_bridge.v
    params:
      AW: AW
      DW: DW
    desc: AI-generated implementation (RTL generator agent, spec only).
    origin: agent:rtlgen
