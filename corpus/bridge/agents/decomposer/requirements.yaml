  quote: BRG-1 converts single read and write commands received on a valid/ready command channel into APB3 transfers
  text: BRG-1 accepts single read and write commands on a valid/ready command channel (cmd_valid, cmd_ready, cmd_write, cmd_addr, cmd_wdata) and converts each one into an APB3 transfer on its APB interface
