- id: R-OV-3
  doc: SPEC
  quote: One transaction is processed at a time.
  text: The bridge processes only one transaction (one accepted command together with its APB transfer and its response) at a time.
  kind: guarantee
  depends:
  - R-OV-1
  ambiguity:
  - phrase: transaction
    readings:
    - a transaction runs from command acceptance until its response is accepted (rsp_valid and rsp_ready both high); accepting the next command in that same cycle (R-RSP-11) then makes two transactions
      touch in one cycle, which is the cycle on which R-CMD-4 and R-RSP-11 disagree
    - a transaction runs from command acceptance until its APB transfer completes; the response phase of one transaction could then overlap the transfer of the next, which R-CMD-4 forbids
    - a transaction runs from command acceptance until its response is first presented (rsp_valid high)
  confidence: medium
