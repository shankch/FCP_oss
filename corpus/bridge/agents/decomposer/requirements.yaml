    readings:
    - 'single means non-burst: each command is exactly one read access or exactly one write access and maps to exactly one APB transfer'
    - single means one command at a time (a restatement of R-OV-3 rather than a statement about the kind of command)
  - phrase: APB3 transfers
    readings:
    - only the APB behaviour spelled out in section 4 is required of the bridge
    - the full AMBA APB3 protocol rules also apply wherever section 4 is silent (for example when pready and pslverr are meaningful, or what pwdata carries during a read); the AMBA APB3 specification is
      not part of this document
