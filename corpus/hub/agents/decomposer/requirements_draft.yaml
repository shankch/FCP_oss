fcp: "0.1"
design: hub2
origin: {kind: agent, role: decomposer, id: decomposer}
requirements:

  # ======================================================================
  # Section 1: Overview
  # ======================================================================
  - id: R-OVR-1
    doc: SPEC
    quote: "HUB-2 lets two requesters, port 0 and port 1, share one APB3 bus."
    text: "HUB-2 connects two requesters (port 0 and port 1) to one shared APB3 bus; on the APB side the hub is a single APB3 master (psel, penable, pwrite, paddr, pwdata, pready, prdata, pslverr)."
    kind: definition
    confidence: high

  - id: R-OVR-2
    doc: SPEC
    quote: "Each port has a valid/ready command channel and a valid/ready response channel with the same signal meanings as the BRG-1 bridge"
    text: "Each port k (k = 0 or 1) has a valid/ready command channel (ck_valid, ck_ready, ck_write, ck_addr, ck_wdata) and a valid/ready response channel (rk_valid, rk_ready, rk_rdata, rk_err), and every one of these signals has the same meaning as the corresponding signal of the BRG-1 bridge. (The signal names are the ones listed in design.yaml; this spec does not list them itself.)"
    kind: definition
    depends: [R-OVR-3]
    ambiguity:
      - phrase: "the same signal meanings as the BRG-1 bridge"
        readings:
          - "The per-port channels follow the BRG-1 channel protocol in full: polarity of ck_write, whether every command (including a write) gets a response, what rk_rdata holds for a write, handshake rules. Those meanings exist only in the BRG-1 specification, which is not part of this bundle (design.yaml lists only SPEC), so they cannot be derived from this document."
          - "Only the signal names and the generic valid/ready handshake are shared with BRG-1; all detailed semantics are left open by this spec."
    confidence: medium

  - id: R-OVR-3
    doc: SPEC
    quote: "(signals prefixed c0_/r0_ for port 0 and c1_/r1_ for port 1)"
    text: "Port 0 signals are prefixed c0_ (command channel) and r0_ (response channel); port 1 signals are prefixed c1_ and r1_. Later sections write ck_x and rk_x for signal x of port k, where k is 0 or 1."
    kind: definition
    confidence: high

  - id: R-OVR-4
    doc: SPEC
    quote: "Internally HUB-2 consists of a round-robin port selector and one BRG-1 bridge."
    text: "HUB-2 is built from a round-robin port selector in front of exactly one BRG-1 bridge instance, so both ports share a single bridge and a single APB master."
    kind: non_functional
    depends: [R-OVR-1]
    ambiguity:
      - phrase: "round-robin"
        readings:
          - "Two-port least-recently-accepted priority that matters only when both ports are pending (the behavior R-ARB-3 spells out)."
          - "Strict alternation: a pointer that rotates regardless of which ports have a command pending, so a lone pending port might have to wait for its slot (this would interact with the 12-cycle bound of R-ARB-4)."
      - phrase: "Internally HUB-2 consists of"
        readings:
          - "Binding structural requirement on the implementation (selector plus one BRG-1 instance); it is not visible at the ports, so it cannot be checked by property checking."
          - "Descriptive background only; the observable behavior is what R-ARB-*, R-XFR-* and R-RSP-* define."
    confidence: medium

  - id: R-OVR-5
    doc: SPEC
    quote: "One transaction is processed at a time."
    text: "HUB-2 processes at most one transaction at any time; a new transaction is not started while a previously started one is still in progress."
    kind: guarantee
    depends: [R-OVR-4, R-ARB-1]
    ambiguity:
      - phrase: "One transaction is processed at a time"
        readings:
          - "A transaction runs from command acceptance until its response is accepted (rk_valid and rk_ready both high); no other command is accepted in between."
          - "A transaction runs from command acceptance until its APB transfer completes (pready sampled high); the next command may be accepted while the previous response is still waiting for rk_ready."
          - "Only the APB transfers are serialized (they never overlap); the hub may accept (queue) further commands earlier."
      - phrase: "One transaction is processed at a time [conflict: R-RST-4]"
        readings:
          - "CONTRADICTION with R-RST-4: if c0_ready and c1_ready are both high in the cycle after reset and both requesters present a valid command, two commands are accepted in one cycle, i.e. two transactions start at once."
          - "R-RST-4 only applies when at most one command is valid (ready high with no valid is harmless), so no conflict arises; the spec does not say so."
      - phrase: "One transaction is processed at a time [conflict: R-ARB-4]"
        readings:
          - "CONTRADICTION (potential) with R-ARB-4: serialization plus the alternating priority of R-ARB-3 lets a pending port wait behind two complete transactions; see R-ARB-4 for the arithmetic against R-ENV-3 and R-ENV-4."
          - "Transactions are short enough that two always fit inside the 12 cycles of R-ARB-4; this depends on the BRG-1 timing, which is not given."
    confidence: medium

  # ======================================================================
  # Section 2: Command acceptance and arbitration
  # ======================================================================
  - id: R-ARB-1
    doc: SPEC
    quote: "A command on port k is accepted in a cycle in which ck_valid and ck_ready are both high."
    text: "A command on port k (k = 0 or 1) is accepted in exactly those clock cycles in which ck_valid and ck_ready are both high. 'Accepted' elsewhere in the spec refers to this event."
    kind: definition
    depends: [R-OVR-2, R-OVR-3]
    ambiguity:
      - phrase: "ck_valid and ck_ready are both high"
        readings:
          - "ck_ready is a free hub output constrained only indirectly (R-ARB-2, R-ARB-3, R-ARB-4, R-OVR-5): it may be high with no ck_valid (ready before valid, as R-RST-4 suggests), and the spec never says when ck_ready must or must not be high."
          - "ck_ready is high only in a cycle in which the hub is idle and has selected port k (a grant), so ready high with valid low is not expected; the spec does not say this."
    confidence: high

  - id: R-ARB-2
    doc: SPEC
    quote: "At most one command is accepted per cycle."
    text: "In every cycle at most one command is accepted across the two ports; c0_valid, c0_ready, c1_valid and c1_ready are never all high in the same cycle."
    kind: guarantee
    depends: [R-ARB-1]
    ambiguity:
      - phrase: "At most one command is accepted per cycle [conflict: R-RST-4]"
        readings:
          - "CONTRADICTION with R-RST-4: R-RST-4 allows c0_ready and c1_ready to be high together in the cycle after reset. Nothing forbids both requesters from presenting a valid command in that cycle (R-ENV-1 only constrains a command once it is valid), so two commands would be accepted at once, violating this requirement."
          - "R-RST-4 is only a permission for ready to be high without a matching valid (so it applies when at most one valid is high), and the two requirements are compatible; the spec does not say this."
    confidence: medium

  - id: R-ARB-3
    doc: SPEC
    quote: "When both ports have a command pending, the port that was not accepted most recently is accepted first."
    text: "When both ports have a pending command, the command of the port that was not the most recently accepted one is accepted before the other port's command (the port that was served last yields to the other)."
    kind: guarantee
    depends: [R-ARB-1, R-OVR-4]
    ambiguity:
      - phrase: "pending"
        readings:
          - "A command is pending from the first cycle in which ck_valid is high until it is accepted, i.e. ck_valid high and ck_ready low (the acceptance cycle itself is not pending)."
          - "A command is pending in every cycle in which ck_valid is high, including the cycle in which it is accepted."
      - phrase: "the port that was not accepted most recently"
        readings:
          - "If no command has been accepted since reset there is no 'most recently accepted' port: the initial priority when both ports are pending is not specified (port 0 first, port 1 first, or either choice allowed). Reset presumably clears the history."
          - "The 'most recent' acceptance survives a reset (arbitration state is not reset) and still decides ties after reset."
      - phrase: "is accepted first"
        readings:
          - "At the next acceptance once both commands are pending, the command accepted is the preferred port's (priority re-evaluated every cycle against the current ck_valid values)."
          - "The preferred port's command is accepted before the other's, but the choice may be fixed in an earlier cycle (for example a registered grant), so a command that becomes valid in the very cycle of the decision need not be honored."
      - phrase: "the port that was not accepted most recently is accepted first [conflict: R-ARB-4]"
        readings:
          - "CONTRADICTION (potential) with R-ARB-4: because the port served last loses the next tie, its next command can wait for the in-flight transaction plus one complete transaction of the other port; see R-ARB-4 for why that may exceed 12 cycles."
          - "The two requirements are compatible if transactions are short enough; this cannot be decided without the BRG-1 timing."
    confidence: medium

  - id: R-ARB-4
    doc: SPEC
    quote: "A port whose command is pending is accepted within 12 cycles."
    text: "A command that is pending on a port is accepted no later than 12 cycles after it became pending (bounded wait for acceptance)."
    kind: guarantee
    depends: [R-ARB-1, R-ARB-3, R-OVR-5, R-ENV-1, R-ENV-3, R-ENV-4]
    ambiguity:
      - phrase: "within 12 cycles"
        readings:
          - "At most 12 cycles elapse between the first cycle in which ck_valid is high and the acceptance cycle (acceptance offset 0..12, up to 12 wait cycles)."
          - "Acceptance occurs in one of the first 12 cycles in which the command is pending (acceptance offset 0..11, up to 11 wait cycles)."
      - phrase: "A port whose command is pending"
        readings:
          - "'Pending' as the first reading given for R-ARB-3 (valid high, not yet accepted)."
          - "'Pending' as the second reading given for R-ARB-3 (valid high, including the acceptance cycle); this shifts the bound by one cycle."
      - phrase: "within 12 cycles [conflict: R-ENV-3, R-ENV-4, R-ARB-3, R-OVR-5]"
        readings:
          - "CONTRADICTION (potential) with R-ENV-3, R-ENV-4, R-ARB-3 and R-OVR-5: the port served last loses the next tie (R-ARB-3), so its next command can wait for the rest of the in-flight transaction plus one complete transaction of the other port (R-OVR-5). With pready up to 4 cycles after the start of the access phase (R-ENV-3) and a response accepted up to 2 cycles after it is presented (R-ENV-4), one transaction can keep the bridge busy for roughly 10 cycles (accept, setup, access with wait states, response, acceptance), so the wait can approach 20 cycles, more than 12. The bound only holds if the environment is faster than its allowed worst case."
          - "The 12 cycles were sized for another way of counting (for example only cycles in which the bridge is busy) or for a BRG-1 with shorter latency than assumed here; this cannot be decided without the BRG-1 timing, which is not in the bundle."
      - phrase: "A port whose command is pending is accepted"
        readings:
          - "Conditional on the environment assumptions R-ENV-1, R-ENV-3 and R-ENV-4 (and on no reset in between): if the slave never asserts pready or a requester never accepts a response, no bound is possible."
          - "Unconditional as written: the bound must hold whatever the slave and requesters do, which no implementation can guarantee."
    confidence: low

  # ======================================================================
  # Section 3: Transfers
  # ======================================================================
  - id: R-XFR-1
    doc: SPEC
    quote: "Every accepted command results in exactly one APB transfer"
    text: "Every accepted command, from either port, results in exactly one APB transfer (the two-phase setup plus access sequence of R-XFR-6); no accepted command is dropped and none is executed twice."
    kind: guarantee
    depends: [R-ARB-1, R-XFR-6]
    ambiguity:
      - phrase: "exactly one APB transfer"
        readings:
          - "One-to-one: every APB transfer is the result of exactly one accepted command, so the hub never starts a transfer that no command asked for."
          - "Forward direction only: each accepted command yields one transfer; the spec says nothing about transfers not caused by a command."
      - phrase: "results in"
        readings:
          - "The transfer starts a fixed small number of cycles after acceptance (for example the next cycle)."
          - "No latency from acceptance to the start or completion of the transfer is stated (only the indirect bounds of R-ARB-4 and R-ENV-3); the transfer must merely happen eventually."
    confidence: medium

  - id: R-XFR-2
    doc: SPEC
    quote: "whose pwrite, paddr and pwdata equal the fields of that command"
    text: "For each accepted command, pwrite during the resulting APB transfer equals the write field of that command (ck_write of the issuing port, as presented in the acceptance cycle)."
    kind: guarantee
    depends: [R-XFR-1, R-ARB-1]
    ambiguity:
      - phrase: "equal the fields of that command"
        readings:
          - "pwrite equals the command's write field in every cycle of the transfer in which psel is high (setup and access phases)."
          - "pwrite equals the command's write field only in the cycle in which the transfer completes (pready sampled high)."
      - phrase: "the fields of that command"
        readings:
          - "The fields are ck_write, ck_addr and ck_wdata of the issuing port, with pwrite = ck_write (1 means write). This spec never names the command fields; the mapping comes from design.yaml and BRG-1."
          - "The field names and polarity are as defined by the (unavailable) BRG-1 specification and may differ from the design.yaml names."
    confidence: high

  - id: R-XFR-3
    doc: SPEC
    quote: "whose pwrite, paddr and pwdata equal the fields of that command"
    text: "For each accepted command, paddr during the resulting APB transfer equals the address field of that command (ck_addr of the issuing port, as presented in the acceptance cycle)."
    kind: guarantee
    depends: [R-XFR-1, R-ARB-1]
    ambiguity:
      - phrase: "equal the fields of that command"
        readings:
          - "paddr equals the command's address in every cycle of the transfer in which psel is high (setup and access phases)."
          - "paddr equals the command's address only in the cycle in which the transfer completes."
    confidence: high

  - id: R-XFR-4
    doc: SPEC
    quote: "whose pwrite, paddr and pwdata equal the fields of that command"
    text: "For each accepted command, pwdata during the resulting APB transfer equals the write-data field of that command (ck_wdata of the issuing port, as presented in the acceptance cycle)."
    kind: guarantee
    depends: [R-XFR-1, R-ARB-1]
    ambiguity:
      - phrase: "pwdata equal the fields of that command"
        readings:
          - "pwdata equals ck_wdata for every transfer, read commands included (literal reading: the sentence has no 'for writes' qualifier)."
          - "pwdata is constrained only for write commands; for a read the wdata field is meaningless and pwdata is a don't-care (compare 'for reads' in R-RSP-4, which does carry a qualifier)."
      - phrase: "equal the fields of that command"
        readings:
          - "pwdata equals the command's write data in every cycle of the transfer in which psel is high (setup and access phases)."
          - "pwdata equals the command's write data only in the cycle in which the transfer completes."
    confidence: medium

  - id: R-XFR-5
    doc: SPEC
    quote: "in acceptance order"
    text: "The APB transfers occur in the order in which their commands were accepted, taken across both ports: the transfer of an earlier-accepted command precedes the transfer of a later-accepted command."
    kind: guarantee
    depends: [R-XFR-1, R-ARB-1, R-OVR-5]
    ambiguity:
      - phrase: "in acceptance order"
        readings:
          - "Global order across both ports: transfers follow the total order in which commands were accepted."
          - "Per-port order only: each port's commands are executed in the order that port issued them, with free interleaving between ports."
      - phrase: "in acceptance order [conflict: R-RST-4]"
        readings:
          - "CONTRADICTION (indirect) with R-RST-4 and R-ARB-2: if both commands could be accepted in the same cycle (both readys high after reset, both valids high), their acceptance order is undefined, so this requirement cannot be applied."
          - "Simultaneous acceptance never happens (R-ARB-2 prevails over R-RST-4), so acceptance order is always a strict total order."
    confidence: medium

  - id: R-XFR-6
    doc: SPEC
    quote: "The APB timing (setup and access phases, stability, penable only with psel) is the same as for BRG-1."
    text: "Every APB transfer has the two-phase APB3 timing that BRG-1 uses: a setup phase (psel high, penable low) followed by an access phase (psel and penable high) that ends when pready is sampled high."
    kind: guarantee
    depends: [R-OVR-1, R-OVR-4]
    ambiguity:
      - phrase: "The APB timing (setup and access phases ...) is the same as for BRG-1"
        readings:
          - "Standard APB3: the setup phase lasts exactly one cycle with psel=1 and penable=0, the access phase starts in the next cycle with penable=1 and ends in the first cycle with pready=1; the spec cannot confirm the exact BRG-1 details (idle cycles between back-to-back transfers, whether psel stays high between them) because the BRG-1 specification is not part of this bundle."
          - "BRG-1 specific timing that deviates from textbook APB3 (extra idle cycles, psel dropped between transfers, a longer setup phase); unknowable from this document."
    confidence: low

  - id: R-XFR-7
    doc: SPEC
    quote: "The APB timing (setup and access phases, stability, penable only with psel) is the same as for BRG-1."
    text: "During an APB transfer the master-driven APB signals are stable, with the same stability rules as BRG-1: pwrite, paddr and pwdata keep their values from the setup phase until the transfer completes."
    kind: guarantee
    depends: [R-XFR-6]
    ambiguity:
      - phrase: "stability"
        readings:
          - "Only pwrite, paddr and pwdata are held stable, from the start of the setup phase until the transfer completes."
          - "Also psel and penable are covered: psel stays high from setup to completion and penable stays high from the start of the access phase until completion."
          - "Stability applies only during the access phase (from the cycle penable is first high until completion)."
      - phrase: "stability [conflict: R-RST-1]"
        readings:
          - "CONTRADICTION (if psel is among the stable signals) with R-RST-1: a reset during a transfer forces psel low in the following cycle, which breaks 'psel stays stable'. The spec carves out no exception for reset."
          - "Stability obligations are cancelled by reset (design.yaml has reset_anytime: true and the FCP IR cancels obligations at reset), so there is no conflict; the spec does not say so."
    confidence: low

  - id: R-XFR-8
    doc: SPEC
    quote: "The APB timing (setup and access phases, stability, penable only with psel) is the same as for BRG-1."
    text: "penable is high only in cycles in which psel is high (penable implies psel)."
    kind: guarantee
    depends: [R-XFR-6]
    confidence: high

  # ======================================================================
  # Section 4: Responses
  # ======================================================================
  - id: R-RSP-1
    doc: SPEC
    quote: "The response to a command is returned on the port that issued it"
    text: "The response to a command is presented on the response channel of the port that issued the command (rk_valid of the issuing port k)."
    kind: guarantee
    depends: [R-XFR-1, R-OVR-2]
    ambiguity:
      - phrase: "The response to a command"
        readings:
          - "Every command, read or write, receives exactly one response (as BRG-1 presumably does; rk_err is specified for every transfer, which hints at this)."
          - "Only some commands (for example only reads) receive a response; which commands get one is defined by BRG-1, which is not available."
      - phrase: "is returned"
        readings:
          - "The response must eventually be presented on the issuing port; no latency bound from transfer completion to rk_valid is stated anywhere in the spec."
          - "The response is presented within a fixed small latency after transfer completion (for example the next cycle); not stated."
    confidence: medium

  - id: R-RSP-2
    doc: SPEC
    quote: "and never on the other port"
    text: "The response to a command is never presented on the other port: the response channel of the port that did not issue the command shows no response for it (rj_valid of the non-issuing port j stays low on its account)."
    kind: guarantee
    depends: [R-RSP-1]
    confidence: high

  - id: R-RSP-3
    doc: SPEC
    quote: "rk_err equals the pslverr value sampled when the transfer completed"
    text: "While the response to a command is presented on port k, rk_err equals the value of pslverr sampled when the APB transfer of that command completed. This applies to read and write commands alike."
    kind: guarantee
    depends: [R-XFR-1, R-RSP-1]
    ambiguity:
      - phrase: "sampled when the transfer completed"
        readings:
          - "pslverr as sampled in the access-phase cycle in which pready is high (the completion cycle itself)."
          - "pslverr as sampled one cycle after the completion cycle (when the response is registered). The spec does not define 'completed' and does not say how long after completion the response appears."
      - phrase: "rk_err equals"
        readings:
          - "rk_err equals the sampled pslverr whenever rk_valid is high for that response; rk_err is a don't-care while rk_valid is low."
          - "rk_err equals the sampled pslverr from transfer completion until the next transfer completes, whether or not rk_valid is high."
    confidence: medium

  - id: R-RSP-4
    doc: SPEC
    quote: "for reads rk_rdata equals the prdata value sampled when the transfer completed"
    text: "For a read command, while its response is presented on port k, rk_rdata equals the value of prdata sampled when the APB transfer of that command completed."
    kind: guarantee
    depends: [R-XFR-1, R-RSP-1]
    ambiguity:
      - phrase: "for reads"
        readings:
          - "For a write command rk_rdata is a don't-care (any value allowed); the spec states no value for it."
          - "For a write command rk_rdata has some defined value (for example 0, or the sampled prdata) given by BRG-1; not available in this bundle."
      - phrase: "prdata value sampled when the transfer completed"
        readings:
          - "Applies to every read, including a read that completes with pslverr high (APB3 does not guarantee prdata is meaningful on an error): rk_rdata still equals the sampled prdata."
          - "Applies only to reads that complete without error; rk_rdata is a don't-care when pslverr is high."
      - phrase: "sampled when the transfer completed"
        readings:
          - "prdata sampled in the access-phase cycle in which pready is high."
          - "prdata sampled in a later cycle; the spec does not define the completion cycle or the delay before the response appears."
    confidence: medium

  - id: R-RSP-5
    doc: SPEC
    quote: "Once asserted, rk_valid stays high and rk_rdata and rk_err stay stable until rk_ready is sampled high."
    text: "Once rk_valid has been asserted on port k, it stays high until rk_ready is sampled high; the response is not withdrawn before the requester accepts it."
    kind: guarantee
    depends: [R-RSP-1]
    ambiguity:
      - phrase: "until rk_ready is sampled high"
        readings:
          - "rk_valid must be high through and including the cycle in which rk_ready is sampled high (the handshake cycle), and may drop in the following cycle."
          - "rk_ready sampled high while rk_valid is still low (ready before valid) does not release the obligation; only a ready sampled together with an asserted rk_valid does."
      - phrase: "Once asserted, rk_valid stays high [conflict: R-RST-2, R-RST-3]"
        readings:
          - "CONTRADICTION (if read literally) with R-RST-2 and R-RST-3: a reset while a response is waiting for rk_ready forces r0_valid / r1_valid low in the next cycle, although rk_ready was never sampled high. The spec carves out no exception for reset."
          - "Hold obligations are cancelled by reset (design.yaml has reset_anytime: true and the FCP IR cancels obligations at reset), so there is no conflict; the spec does not say so."
    confidence: medium

  - id: R-RSP-6
    doc: SPEC
    quote: "Once asserted, rk_valid stays high and rk_rdata and rk_err stay stable until rk_ready is sampled high."
    text: "From the cycle in which rk_valid is first asserted until rk_ready is sampled high, rk_rdata and rk_err keep their values."
    kind: guarantee
    depends: [R-RSP-3, R-RSP-4, R-RSP-5]
    ambiguity:
      - phrase: "rk_rdata and rk_err stay stable"
        readings:
          - "rk_rdata must be held stable for write responses too, although its value for a write is unspecified (literal reading: this sentence has no 'for reads' qualifier)."
          - "Stability is required only where rk_rdata carries meaningful data (reads); for a write response rk_rdata is a don't-care and may change while rk_valid is high."
      - phrase: "Once asserted ... until rk_ready is sampled high [conflict: R-RST-2, R-RST-3]"
        readings:
          - "CONTRADICTION (if read literally) with R-RST-2 and R-RST-3: reset during a pending response clears rk_valid and may change rk_rdata and rk_err; the sentence has no reset exception."
          - "Obligations are cancelled by reset, so rk_rdata and rk_err only need to be stable until a reset occurs."
    confidence: medium

  # ======================================================================
  # Section 5: Environment
  # ======================================================================
  - id: R-ENV-1
    doc: SPEC
    quote: "Each requester keeps its command valid and stable until it is accepted."
    text: "Once a requester asserts ck_valid for a command, it keeps ck_valid high until that command is accepted; it does not withdraw a pending command."
    kind: assumption
    depends: [R-ARB-1]
    ambiguity:
      - phrase: "keeps its command valid ... until it is accepted"
        readings:
          - "A requester may drop ck_valid when reset is asserted (the obligation is cancelled by reset; design.yaml has reset_anytime: true)."
          - "ck_valid must stay high until acceptance even across a reset, which would forbid reset while a command is pending and contradict reset_anytime."
    confidence: high

  - id: R-ENV-2
    doc: SPEC
    quote: "Each requester keeps its command valid and stable until it is accepted."
    text: "While a command is pending, the requester keeps its command fields (ck_write, ck_addr, ck_wdata) unchanged until the command is accepted."
    kind: assumption
    depends: [R-ENV-1, R-ARB-1]
    ambiguity:
      - phrase: "stable"
        readings:
          - "All three fields ck_write, ck_addr and ck_wdata must be stable, whatever the command type (for a read the wdata field is still held)."
          - "Only the fields meaningful for the command type must be stable (ck_wdata may change while a read is pending); this interacts with the pwdata ambiguity of R-XFR-4."
    confidence: medium

  - id: R-ENV-3
    doc: SPEC
    quote: "The APB slave asserts pready within 4 cycles of the start of the access phase."
    text: "The APB slave asserts pready no later than 4 cycles after the start of the access phase of each transfer (the access phase starts in the first cycle with psel and penable high)."
    kind: assumption
    depends: [R-XFR-6]
    ambiguity:
      - phrase: "within 4 cycles of the start of the access phase"
        readings:
          - "pready is high in at least one of the first 4 cycles of the access phase, counting the first access cycle as cycle 1 (at most 3 wait states)."
