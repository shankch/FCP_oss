fcp: '0.1'
design: sync_fifo
summary: Single-clock FIFO with first-word fall-through read data (SFIFO-01).
docs:
- id: SPEC
  path: spec.md
  title: SFIFO-01 Functional Specification v1.2
interface:
  clock: clk
  reset:
    name: rst_n
    active_low: true
    synchronous: true
  params:
    DEPTH: 5
    WIDTH: 8
    AF_LEVEL: 3
  signals:
  - name: clk
    dir: in
    width: 1
  - name: rst_n
    dir: in
    width: 1
  - name: push
    dir: in
    width: 1
  - name: push_data
    dir: in
    width: WIDTH
  - name: pop
    dir: in
    width: 1
  - name: pop_data
    dir: out
    width: WIDTH
  - name: full
    dir: out
    width: 1
  - name: empty
    dir: out
    width: 1
  - name: almost_full
    dir: out
    width: 1
  - name: count
    dir: out
    width: clog2(DEPTH+1)
environment:
  initial_reset: true
  reset_anytime: true
rtl:
  ref:
    top: sync_fifo
    files:
    - rtl/sync_fifo.v
    params:
      DEPTH: DEPTH
      WIDTH: WIDTH
      AF_LEVEL: AF_LEVEL
    desc: Reference implementation (human-written).
    origin: human
  ai:
    top: sync_fifo
    files:
    - rtl/ai_sync_fifo.v
    params:
      DEPTH: DEPTH
      WIDTH: WIDTH
      AF_LEVEL: AF_LEVEL
    desc: AI-generated implementation (RTL generator agent, spec only).
    origin: agent:rtlgen
