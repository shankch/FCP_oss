fcp: '0.1'
set: variant1
origin: {kind: agent, role: formalizer, id: variant1}

defs:
  # both arguments inside the ranges of R-IN-1 and R-IN-2 (negative arguments are not part of the trace)
  in_range: 'subtotal <= 1000000 && coupon <= 50'
  # the member discount and the coupon added up, in percent (R-STACK-1, reading 1: the percentages add up)
  sum_pct: '(member ? 10 : 0) + coupon'
  # the total discount in percent, capped at 30 (R-STACK-1)
  pct: 'min(sum_pct, 30)'
  # the discounted price before rounding, in hundredths of a cent
  exact: 'subtotal * (100 - pct)'

properties:
  - id: V1-RET
    req: R-RET-1
    pattern: implies
    args: {trigger: 'in_range', cond: 'outcome == 0'}
    note: >-
      For arguments in range the call returns a pair of integers that fit price and ship
      (outcome 0), i.e. whole numbers of cents. What the two numbers are is stated by the
      items of R-MEM-1, R-COUP-1, R-STACK-1, R-ROUND-1 and R-SHIP-1.

  - id: V1-ERR
    req: R-ERR-1
    pattern: implies
    args: {trigger: '!in_range', cond: 'outcome == 1'}
    note: >-
      Out of range means subtotal above 1,000,000 or coupon above 50; negative arguments are
      not part of the trace (frame.md). The text gives only the "if" direction; V1-RET gives
      the other one.

  - id: V1-MEM
    req: R-MEM-1
    pattern: implies
    args:
      trigger: 'in_range && member && coupon == 0'
      cond: '100 * price - 90 * subtotal < 100 && 90 * subtotal - 100 * price < 100'
    note: >-
      A member without a coupon (no other discount) pays 10% off the subtotal: the price is
      within one cent of 90% of the subtotal, so it is that amount rounded down or up to a
      whole cent. Which neighbour is fixed by R-ROUND-1 (V1-ROUND). How the member discount
      combines with a coupon is R-STACK-1 (V1-STACK-ADD, V1-STACK-CAP).

  - id: V1-COUP
    req: R-COUP-1
    pattern: implies
    args:
      trigger: 'in_range && !member && coupon <= 30'
      cond: '100 * price - (100 - coupon) * subtotal < 100 && (100 - coupon) * subtotal - 100 * price < 100'
    note: >-
      A non-member's coupon takes coupon percent off: the price is within one cent of
      (100 - coupon)% of the subtotal (coupon 0, no coupon, gives price == subtotal). Rounding
      is R-ROUND-1 (V1-ROUND). Only coupons up to 30 are covered here, because rule 4 ("the
      total discount is never more than 30%") limits rule 3 explicitly. A coupon of 31 to 50,
      which R-IN-2 accepts, never takes its stated percentage off (see V1-STACK-CAP). Combining
      with the member discount is R-STACK-1.

  - id: V1-STACK-ADD
    req: R-STACK-1
    pattern: implies
    args:
      trigger: 'in_range && sum_pct <= 30'
      cond: '100 * price - subtotal * (100 - sum_pct) < 100 && subtotal * (100 - sum_pct) - 100 * price < 100'
    note: >-
      "Discounts stack" read as given (reading 1): the percentages add up, so a member with a
      coupon gets 10 + coupon percent off the subtotal, not the two discounts one after the
      other. While that sum is at most 30, the price is within one cent of the subtotal less
      the summed percentage. Rounding is R-ROUND-1 (V1-ROUND).

  - id: V1-STACK-CAP
    req: R-STACK-1
    pattern: implies
    args:
      trigger: 'in_range && sum_pct > 30'
      cond: '100 * price - 70 * subtotal < 100 && 70 * subtotal - 100 * price < 100'
    note: >-
      "Discounts stack" read as given (reading 1): the percentages add up. When the sum is
      above 30, "never more than 30%" is read as a cap: the total discount is exactly 30%, so
      the price is within one cent of 70% of the subtotal. The cap is read on the discount
      percentage, before rule 5 rounds the price. On the rounded price it would conflict with
      R-ROUND-1 for small subtotals: 30% off 3 cents is 2.1 cents, which rounds to 2, a
      discount of 33%.

  - id: V1-ROUND
    req: R-ROUND-1
    pattern: implies
    args:
      trigger: 'in_range'
      cond: '100 * price - exact <= 50 && exact - 100 * price <= 50'
    note: >-
      "the nearest cent" read as given (reading 1): at exactly half a cent, either neighbour.
      The price is at most half a cent from the discounted price subtotal * (100 - pct) / 100.
      So it is the nearest whole cent, and either neighbour is allowed when the discounted
      price ends in exactly half a cent. The discounted price uses pct, which takes R-STACK-1
      reading 1 (the percentages add up, capped at 30).

  - id: V1-SHIP-UNDER
    req: R-SHIP-1
    pattern: implies
    args: {trigger: 'in_range && subtotal < 5000', cond: 'ship == 499'}
    note: >-
      "Orders under $50" read as given (reading 1): the subtotal before discounts is under
      $50 (5,000 cents); the discounts do not matter. This rule contradicts R-MONO-1:
      crossing $50 lowers the amount charged (see V1-MONO).

  - id: V1-SHIP-FREE
    req: R-SHIP-1
    pattern: implies
    args: {trigger: 'in_range && subtotal >= 5000', cond: 'ship == 0'}
    note: >-
      "Orders of $50 or more" uses the same reading as "Orders under $50" (reading 1): the
      subtotal before discounts is at least 5,000 cents, so these orders ship free. Example: a
      member's $54.00 cart, discounted to $48.60, still ships free.

  - id: V1-MONO
    req: R-MONO-1
    pattern: implies
    args:
      trigger: 'in_range && prev(subtotal) < subtotal && stable(coupon) && stable(member)'
      cond: 'price + ship >= prev(price + ship)'
    note: >-
      Any two calls can be consecutive (frame.md), so the property compares the previous call
      with this one. Adding items means a strictly larger subtotal with the same coupon and
      membership; the amount charged is price + ship. Only calls in range are compared,
      because an out-of-range call returns no amount (the previous call is then in range too).
      CONTRADICTION with R-SHIP-1 (V1-SHIP-UNDER/V1-SHIP-FREE), under either reading of
      "Orders under $50", left unrepaired. Example: a non-member without a coupon pays
      4999 + 499 = 5498 at subtotal 4999 but 5000 + 0 = 5000 at subtotal 5000.

  - id: V1-EX
    req: R-EX-1
    pattern: implies
    args:
      trigger: 'member && subtotal == 10000 && coupon == 0'
      cond: 'outcome == 0 && price == 9000 && ship == 0'
    note: >-
      The example as a guarantee: this call returns (9000, 0). It agrees with V1-MEM, V1-ROUND
      and V1-SHIP-FREE (9000 is exact; 10,000 cents is at least $50 before and after the
      discount). V1-EX-COVER states it as a scenario.

scenarios:
  - id: V1-EX-COVER
    req: R-EX-1
    cover: 'member && subtotal == 10000 && coupon == 0 && outcome == 0 && price == 9000 && ship == 0'
    note: The example call returning (9000, 0) must be possible.

unformalized:
  - req: R-SIG-1
    reason: >-
      Defines the function's name, arguments and result type. The function section and
      interface of design.yaml fix these. The returned pair of integers (outcome 0) for valid
      arguments is V1-RET.
    covered_by: [V1-RET]
  - req: R-IN-1
    reason: >-
      Definition of the valid subtotal range 0 to 1,000,000, captured by the in_range def. Not
      an assumption: rule 1 requires out-of-range calls to raise ValueError.
    covered_by: [V1-RET, V1-ERR]
  - req: R-IN-2
    reason: >-
      Definition of the valid coupon range 0 to 50 (the in_range def) and of coupon 0 as "no
      coupon" (no coupon discount: V1-COUP gives price == subtotal for a non-member with
      coupon 0, and V1-MEM covers a member with coupon 0). Not an assumption, for the same
      reason as R-IN-1.
    covered_by: [V1-RET, V1-ERR, V1-COUP, V1-MEM]
  - req: R-IN-3
    reason: Definition of member as loyalty-program membership, which carries the 10% member discount.
    covered_by: [V1-MEM, V1-STACK-ADD, V1-STACK-CAP]
  - req: R-FR-1
    reason: >-
      Frame rule of the function adapter. design.yaml already states it as frame item F-ZERO,
      which is added to every formalization set and need not be restated (frame.md).

decisions:
  - {req: R-STACK-1, phrase: 'Discounts stack', reading: 1}
  - {req: R-ROUND-1, phrase: 'the nearest cent', reading: 1}
  - {req: R-SHIP-1, phrase: 'Orders under $50', reading: 1}
